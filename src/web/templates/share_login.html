<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5D 象棋 · 临时分享</title>
    <style>
        :root { color-scheme: dark; font-family: "Microsoft YaHei", sans-serif; }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: #202129;
            color: #f4f1f7;
        }
        main {
            width: min(420px, calc(100vw - 32px));
            padding: 32px;
            border: 1px solid #4b4d58;
            border-radius: 18px;
            background: #30313a;
            box-shadow: 0 18px 48px #0007;
        }
        h1 { margin: 0 0 8px; font-size: 28px; }
        p { color: #c8c5d0; line-height: 1.6; }
        label { display: block; margin-top: 18px; font-weight: 700; }
        input {
            width: 100%;
            margin-top: 8px;
            padding: 12px 14px;
            border: 1px solid #5b5d68;
            border-radius: 10px;
            background: #22232a;
            color: #fff;
            font: inherit;
        }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: #9d6bb4;
            color: #fff;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }
        .error {
            padding: 10px 12px;
            border-radius: 8px;
            background: #7f2f3f;
            color: #fff;
        }
    </style>
</head>
<body>
<main>
    <h1>5D 象棋</h1>
    <p>这是一个临时分享棋局，请输入发送给你的访问账号和密码。</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
        <label>访问账号
            <input name="username" autocomplete="username" required autofocus>
        </label>
        <label>访问密码
            <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">进入棋局</button>
    </form>
</main>
</body>
</html>
