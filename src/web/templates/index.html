<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时线棋局 · 多时间线国际象棋</title>
    <link rel="stylesheet" href="/static/css/style.css?v=10">
    <link rel="stylesheet" href="/static/css/p2p.css?v=1">
</head>
<body>
<div id="app">
    <section id="menu-screen" class="screen active">
        <div class="menu-hero">
            <div class="brand-mark">时线</div>
            <div>
                <h1>时线棋局</h1>
                <p>多时间线国际象棋 · 独立开源实现</p>
                <p><small>非官方项目，与灵感来源游戏的开发者、发行商无关联。</small></p>
            </div>
        </div>
        <div class="menu-grid">
            <button class="menu-card tutorial-entry" onclick="openTutorial()">
                <span class="menu-icon">◎</span>
                <strong>第一次玩？从这里开始</strong>
                <small>3 个动手练习 · 学会跨线移动与提交回合</small>
            </button>
            <button class="menu-card primary" onclick="startGame('pvp')">
                <span class="menu-icon">👥</span>
                <strong>同屏双人对弈</strong>
                <small>同屏双人对弈 · 同一浏览器轮流行动</small>
            </button>
            <button class="menu-card primary" onclick="createP2PRoom()">
                <span class="menu-icon">♚</span>
                <strong>创建在线房间</strong>
                <small>在线双人对弈 · 房间码 · 临时联机地址</small>
            </button>
            <button class="menu-card primary" onclick="joinP2PRoom()">
                <span class="menu-icon">⇄</span>
                <strong id="p2p-join-label">加入在线房间</strong>
                <small id="p2p-join-detail">在线双人对弈 · 输入 6 位房间码远程对弈</small>
            </button>
            <button class="menu-card" onclick="openSavedP2PGames()">
                <span class="menu-icon">↻</span>
                <strong>恢复在线对局</strong>
                <small>房主本机操作 · 继续存档并重新邀请对手</small>
            </button>
            <button class="menu-card" onclick="startGame('pve', 'easy')">
                <span class="menu-icon">♞</span>
                <strong>人机 · 简单</strong>
                <small>人机对弈</small>
            </button>
            <button class="menu-card" onclick="startGame('pve', 'medium')">
                <span class="menu-icon">♝</span>
                <strong>人机 · 中等</strong>
                <small>人机对弈</small>
            </button>
            <button class="menu-card" onclick="startGame('pve', 'hard')">
                <span class="menu-icon">♛</span>
                <strong>人机 · 困难</strong>
                <small>人机对弈</small>
            </button>
            <button class="menu-card" onclick="startGame('replay')">
                <span class="menu-icon">↺</span>
                <strong>棋谱回放</strong>
                <small>棋谱回放 · 多时间线概览</small>
            </button>
        </div>
        <p id="p2p-recovery-note" role="status"></p>
    </section>

    <section id="game-screen" class="screen">
        <header id="top-bar">
            <div class="top-left">
                <button class="ghost-btn" onclick="backToMenu()">← 菜单</button>
                <button class="ghost-btn" onclick="openTutorial()">新手教程</button>
                <div class="top-title">
                    <strong>时线棋局</strong>
                    <span id="game-info">多时间线</span>
                </div>
            </div>
            <div id="top-status" class="status-pills"></div>
        </header>

        <div id="workspace">
            <main id="multiverse-panel">
                <div id="canvas-toolbar">
                    <div>
                        <strong>多时间线棋盘</strong>
                        <span class="toolbar-hint">横向 = 时间 T · 纵向 = 时间线 L</span>
                    </div>
                    <div class="toolbar-actions">
                        <button class="tool-btn" onclick="zoomBoards(-16)" title="缩小棋盘">−</button>
                        <button class="tool-btn" onclick="zoomBoards(16)" title="放大棋盘">＋</button>
                        <button class="tool-btn wide" onclick="scrollToCurrent()">定位当前时刻</button>
                        <button class="tool-btn wide" onclick="refreshState()">重新同步</button>
                    </div>
                </div>

                <div id="multiverse-viewport">
                    <div id="timeline-canvas">
                        <svg id="timeline-links" aria-hidden="true"></svg>
                        <div id="timeline-lanes"></div>
                    </div>
                </div>
            </main>

            <aside id="side-panel">
                <section class="panel-card action-card">
                    <div class="panel-title-row">
                        <h2>当前行动</h2>
                        <span id="check-badge" class="mini-badge danger hidden">将军</span>
                    </div>
                    <div id="action-summary"></div>
                    <button id="submit-action-btn" class="submit-btn" onclick="submitAction()" disabled>
                        提交行动
                    </button>
                    <p id="action-help" class="panel-help"></p>
                    <p id="repetition-warning" class="repetition-warning hidden" role="status"></p>
                </section>

                <section id="p2p-connection" class="panel-card hidden">
                    <h2>联机与存档</h2>
                    <p id="p2p-connection-status" role="status"></p>
                    <p id="p2p-save-status" class="panel-help"></p>
                    <p id="p2p-recovery-help" class="panel-help"></p>
                </section>

                <section class="panel-card">
                    <h2>棋盘状态</h2>
                    <div id="board-inspector" class="inspector muted">
                        点击任意棋盘可查看棋盘坐标；点击可行动棋盘上的棋子开始走子。
                    </div>
                </section>

                <section class="panel-card">
                    <h2>图例</h2>
                    <div class="legend-grid">
                        <span><i class="legend present"></i>当前时刻</span>
                        <span><i class="legend required"></i>必须推进</span>
                        <span><i class="legend movable"></i>可行动</span>
                        <span><i class="legend inactive"></i>非活动</span>
                        <span><i class="legend target"></i>跨棋盘目标</span>
                        <span><i class="legend last"></i>最近走子</span>
                    </div>
                </section>

                <section id="replay-panel" class="panel-card hidden">
                    <h2>棋谱回放</h2>
                    <div class="button-grid">
                        <button class="side-btn" onclick="replayAction('start')">⏮</button>
                        <button class="side-btn" onclick="replayAction('backward')">◀</button>
                        <button class="side-btn" onclick="replayAction('toggle')">▶ / ⏸</button>
                        <button class="side-btn" onclick="replayAction('forward')">▶</button>
                        <button class="side-btn" onclick="replayAction('end')">⏭</button>
                        <button class="side-btn" onclick="replayJump()">跳转</button>
                    </div>
                    <button class="side-btn full" onclick="replayLoadFile()">加载 .5dpgn</button>
                </section>

                <section class="panel-card history-card">
                    <h2>走子历史</h2>
                    <div id="move-history">(无)</div>
                </section>
            </aside>
        </div>
    </section>
</div>

<dialog id="tutorial-dialog" aria-labelledby="tutorial-title">
    <header class="tutorial-heading">
        <div><span class="tutorial-eyebrow">时线棋局 / 入门练习</span><h2 id="tutorial-title" tabindex="-1">先学会走完一个回合</h2></div>
        <button class="ghost-btn" id="tutorial-close" onclick="closeTutorial()">稍后再学</button>
    </header>
    <p class="tutorial-isolation">这是独立练习，不会改变你的对局。每课依次完成：选棋子 → 点落点 → 提交行动。</p>
    <nav id="tutorial-steps" aria-label="教程章节"></nav>
    <div id="tutorial-content" aria-busy="false"></div>
    <footer class="tutorial-footer">
        <button class="ghost-btn" id="tutorial-reset" onclick="resetTutorialLesson()">重练本课</button>
        <button class="submit-btn" id="tutorial-next" onclick="nextTutorialLesson()" disabled>完成本课后继续</button>
    </footer>
</dialog>
<div id="toast" role="status"></div>
<dialog id="p2p-save-dialog" aria-labelledby="p2p-save-title">
    <h2 id="p2p-save-title">恢复在线对局</h2>
    <p id="p2p-save-detail" role="status"></p>
    <label for="p2p-save-list">最近 20 份在线棋局存档</label>
    <select id="p2p-save-list"></select>
    <div class="save-actions">
        <button class="ghost-btn" onclick="document.getElementById('p2p-save-dialog').close()">取消</button>
        <button id="p2p-restore-btn" class="tool-btn" onclick="restoreSavedP2PGame()" disabled>恢复并生成新房间码</button>
    </div>
</dialog>
<script src="/static/js/game.js?v=10"></script>
<script src="/static/js/p2p.js?v=6"></script>
<script src="/static/js/p2p_invite.js?v=2"></script>
<script src="/static/js/tutorial.js?v=1"></script>
</body>
</html>
