<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5D 象棋 · 多时间线棋盘</title>
    <link rel="stylesheet" href="/static/css/style.css?v=8">
</head>
<body>
<div id="app">
    <section id="menu-screen" class="screen active">
        <div class="menu-hero">
            <div class="brand-mark">5D</div>
            <div>
                <h1>5D 象棋</h1>
                <p>多时间线时空旅行象棋</p>
            </div>
        </div>
        <div class="menu-grid">
            <button class="menu-card primary" onclick="startGame('pvp')">
                <span class="menu-icon">♚</span>
                <strong>真人对弈</strong>
                <small>双人对弈 · 完整行动与当前时刻规则</small>
            </button>
            <button class="menu-card" onclick="startGame('pve', 'easy')">
                <span class="menu-icon">♞</span>
                <strong>人机 · 简单</strong>
                <small>旧版电脑对手兼容模式</small>
            </button>
            <button class="menu-card" onclick="startGame('pve', 'medium')">
                <span class="menu-icon">♝</span>
                <strong>人机 · 中等</strong>
                <small>旧版电脑对手兼容模式</small>
            </button>
            <button class="menu-card" onclick="startGame('pve', 'hard')">
                <span class="menu-icon">♛</span>
                <strong>人机 · 困难</strong>
                <small>旧版电脑对手兼容模式</small>
            </button>
            <button class="menu-card" onclick="startGame('replay')">
                <span class="menu-icon">↺</span>
                <strong>棋谱回放</strong>
                <small>棋谱回放 · 多时间线概览</small>
            </button>
        </div>
    </section>

    <section id="game-screen" class="screen">
        <header id="top-bar">
            <div class="top-left">
                <button class="ghost-btn" onclick="backToMenu()">← 菜单</button>
                <div class="top-title">
                    <strong>5D 象棋</strong>
                    <span id="game-info">多时间线棋局</span>
                </div>
            </div>
            <div id="top-status" class="status-pills"></div>
        </header>

        <div id="workspace">
            <main id="multiverse-panel">
                <div id="canvas-toolbar">
                    <div>
                        <strong>多时间线棋盘</strong>
                        <span class="toolbar-hint">横向 = 时间 T · 纵向 = 时间线 L</span>
                    </div>
                    <div class="toolbar-actions">
                        <button class="tool-btn" onclick="zoomBoards(-16)" title="缩小棋盘">−</button>
                        <button class="tool-btn" onclick="zoomBoards(16)" title="放大棋盘">＋</button>
                        <button class="tool-btn wide" onclick="scrollToCurrent()">定位当前时刻</button>
                        <button class="tool-btn wide" onclick="refreshState()">刷新</button>
                    </div>
                </div>

                <div id="multiverse-viewport">
                    <div id="timeline-canvas">
                        <svg id="timeline-links" aria-hidden="true"></svg>
                        <div id="timeline-lanes"></div>
                    </div>
                </div>
            </main>

            <aside id="side-panel">
                <section class="panel-card action-card">
                    <div class="panel-title-row">
                        <h2>当前行动</h2>
                        <span id="check-badge" class="mini-badge danger hidden">将军</span>
                    </div>
                    <div id="action-summary"></div>
                    <button id="submit-action-btn" class="submit-btn" onclick="submitAction()" disabled>
                        提交行动
                    </button>
                    <p id="action-help" class="panel-help"></p>
                </section>

                <section class="panel-card">
                    <h2>棋盘状态</h2>
                    <div id="board-inspector" class="inspector muted">
                        点击任意棋盘可查看棋盘坐标；点击可行动棋盘上的棋子开始走子。
                    </div>
                </section>

                <section class="panel-card">
                    <h2>图例</h2>
                    <div class="legend-grid">
                        <span><i class="legend present"></i>当前时刻</span>
                        <span><i class="legend required"></i>必须行动</span>
                        <span><i class="legend movable"></i>可行动</span>
                        <span><i class="legend inactive"></i>非活动</span>
                        <span><i class="legend target"></i>五维目标</span>
                        <span><i class="legend last"></i>上一步</span>
                    </div>
                </section>

                <section id="replay-panel" class="panel-card hidden">
                    <h2>棋谱回放</h2>
                    <div class="button-grid">
                        <button class="side-btn" onclick="replayAction('start')">⏮</button>
                        <button class="side-btn" onclick="replayAction('backward')">◀</button>
                        <button class="side-btn" onclick="replayAction('toggle')">▶ / ⏸</button>
                        <button class="side-btn" onclick="replayAction('forward')">▶</button>
                        <button class="side-btn" onclick="replayAction('end')">⏭</button>
                        <button class="side-btn" onclick="replayJump()">跳转</button>
                    </div>
                    <button class="side-btn full" onclick="replayLoadFile()">加载 .5dpgn</button>
                </section>

                <section class="panel-card history-card">
                    <h2>走子历史</h2>
                    <div id="move-history">(无)</div>
                </section>
            </aside>
        </div>
    </section>
</div>

<div id="toast" role="status"></div>
<script src="/static/js/game.js?v=8"></script>
</body>
</html>
