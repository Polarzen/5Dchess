<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5D Chess · Multiverse Board</title>
    <link rel="stylesheet" href="/static/css/style.css?v=8">
</head>
<body>
<div id="app">
    <section id="menu-screen" class="screen active">
        <div class="menu-hero">
            <div class="brand-mark">5D</div>
            <div>
                <h1>5D Chess</h1>
                <p>Multiverse Time Travel · 多棋盘时间线对弈</p>
            </div>
        </div>
        <div class="menu-grid">
            <button class="menu-card primary" onclick="startGame('pvp')">
                <span class="menu-icon">👥</span>
                <strong>同屏双人对弈</strong>
                <small>Hotseat · 本地 PvP · 同一浏览器轮流行动</small>
            </button>
            <button class="menu-card primary" onclick="createP2PRoom()">
                <span class="menu-icon">♚</span>
                <strong>创建在线房间</strong>
                <small>Online P2P · 房间码 · Cloudflare Tunnel</small>
            </button>
            <button class="menu-card primary" onclick="joinP2PRoom()">
                <span class="menu-icon">⇄</span>
                <strong id="p2p-join-label">加入在线房间</strong>
                <small id="p2p-join-detail">Online P2P · 输入 6 位房间码远程对弈</small>
            </button>
            <button class="menu-card" onclick="startGame('pve', 'easy')">
                <span class="menu-icon">♞</span>
                <strong>人机 · 简单</strong>
                <small>Canonical Action AI</small>
            </button>
            <button class="menu-card" onclick="startGame('pve', 'medium')">
                <span class="menu-icon">♝</span>
                <strong>人机 · 中等</strong>
                <small>Canonical Action AI</small>
            </button>
            <button class="menu-card" onclick="startGame('pve', 'hard')">
                <span class="menu-icon">♛</span>
                <strong>人机 · 困难</strong>
                <small>Canonical Action AI</small>
            </button>
            <button class="menu-card" onclick="startGame('replay')">
                <span class="menu-icon">↺</span>
                <strong>棋谱回放</strong>
                <small>Replay · 多时间线概览</small>
            </button>
        </div>
    </section>

    <section id="game-screen" class="screen">
        <header id="top-bar">
            <div class="top-left">
                <button class="ghost-btn" onclick="backToMenu()">← 菜单</button>
                <div class="top-title">
                    <strong>5D Chess</strong>
                    <span id="game-info">Multiverse</span>
                </div>
            </div>
            <div id="top-status" class="status-pills"></div>
        </header>

        <div id="workspace">
            <main id="multiverse-panel">
                <div id="canvas-toolbar">
                    <div>
                        <strong>Multiverse Board</strong>
                        <span class="toolbar-hint">横向 = 时间 T · 纵向 = Timeline L</span>
                    </div>
                    <div class="toolbar-actions">
                        <button class="tool-btn" onclick="zoomBoards(-16)" title="缩小棋盘">−</button>
                        <button class="tool-btn" onclick="zoomBoards(16)" title="放大棋盘">＋</button>
                        <button class="tool-btn wide" onclick="scrollToCurrent()">定位 Present</button>
                        <button class="tool-btn wide" onclick="refreshState()">刷新</button>
                    </div>
                </div>

                <div id="multiverse-viewport">
                    <div id="timeline-canvas">
                        <svg id="timeline-links" aria-hidden="true"></svg>
                        <div id="timeline-lanes"></div>
                    </div>
                </div>
            </main>

            <aside id="side-panel">
                <section class="panel-card action-card">
                    <div class="panel-title-row">
                        <h2>当前 Action</h2>
                        <span id="check-badge" class="mini-badge danger hidden">CHECK</span>
                    </div>
                    <div id="action-summary"></div>
                    <button id="submit-action-btn" class="submit-btn" onclick="submitAction()" disabled>
                        Submit Action
                    </button>
                    <p id="action-help" class="panel-help"></p>
                </section>

                <section class="panel-card">
                    <h2>棋盘状态</h2>
                    <div id="board-inspector" class="inspector muted">
                        点击任意棋盘可查看 BoardCoord；点击可行动棋盘上的棋子开始走子。
                    </div>
                </section>

                <section class="panel-card">
                    <h2>图例</h2>
                    <div class="legend-grid">
                        <span><i class="legend present"></i>Present</span>
                        <span><i class="legend required"></i>Required</span>
                        <span><i class="legend movable"></i>Movable</span>
                        <span><i class="legend inactive"></i>Inactive</span>
                        <span><i class="legend target"></i>5D Target</span>
                        <span><i class="legend last"></i>Last Move</span>
                    </div>
                </section>

                <section id="replay-panel" class="panel-card hidden">
                    <h2>Replay</h2>
                    <div class="button-grid">
                        <button class="side-btn" onclick="replayAction('start')">⏮</button>
                        <button class="side-btn" onclick="replayAction('backward')">◀</button>
                        <button class="side-btn" onclick="replayAction('toggle')">▶ / ⏸</button>
                        <button class="side-btn" onclick="replayAction('forward')">▶</button>
                        <button class="side-btn" onclick="replayAction('end')">⏭</button>
                        <button class="side-btn" onclick="replayJump()">跳转</button>
                    </div>
                    <button class="side-btn full" onclick="replayLoadFile()">加载 .5dpgn</button>
                </section>

                <section class="panel-card history-card">
                    <h2>走子历史</h2>
                    <div id="move-history">(无)</div>
                </section>
            </aside>
        </div>
    </section>
</div>

<div id="toast" role="status"></div>
<script src="/static/js/game.js?v=8"></script>
<script src="/static/js/p2p.js?v=3"></script>
<script src="/static/js/p2p_invite.js?v=1"></script>
</body>
</html>
