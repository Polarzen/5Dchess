name: TEMP Arena final profile
on:
  push:
    branches: [feat/local-ai-training-v2]
    paths: [.github/workflows/temp-arena-final-profile.yml]
permissions:
  contents: read
  actions: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-ai-training-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"
      - uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-33347901504
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: '33347901504'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run exact Arena profile
        shell: bash
        run: |
          mkdir -p _work/profile
          python -m cProfile -o _work/profile/final.pstats -m src.training.arena \
            --checkpoint _work/checkpoint/best \
            --opponent easy --games 1 \
            --planner-seconds 5.0 --planner-actions 24 \
            --planner-states 256 --planner-moves 32 \
            --device cpu --seed 42 --max-actions 40 \
            --max-wall-seconds 300 --output json \
            --result-json _work/profile/result.json
      - name: Print final profile evidence
        run: |
          python - <<'PY'
          import pstats
          from pathlib import Path
          s = pstats.Stats('_work/profile/final.pstats').strip_dirs().sort_stats('cumulative')
          print('=== RESULT ===')
          print(Path('_work/profile/result.json').read_text())
          print('=== TARGETS ===')
          for pattern in ['apply_action_plan','_apply_specs_once','submit_action','_check_multiverse_game_result','_evaluate_multiverse_game_result','resolve_move_spec','encode_candidates','filter_legal_moves','action_planner.py','action_search.py','board.py']:
              print('---', pattern, '---')
              s.print_stats(pattern)
          print('=== RAW TOP-LEVEL DEEPCOPY CALLERS ===')
          for key, value in s.stats.items():
              if key[0].endswith('copy.py') and key[2] == 'deepcopy':
                  cc, nc, tt, ct, callers = value
                  print('DEEPCOPY', cc, nc, tt, ct)
                  for caller, contribution in sorted(callers.items(), key=lambda x: x[1][-1], reverse=True):
                      if not caller[0].endswith('copy.py'):
                          print('CALLER', caller, contribution)
          print('=== POSITION COPY ===')
          for key, value in s.stats.items():
              if key[0].endswith('board.py') and key[2] == 'copy':
                  print('POSITION_COPY', key, value[:4])
                  for caller, contribution in sorted(value[4].items(), key=lambda x: x[1][-1], reverse=True):
                      print('CALLER', caller, contribution)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: temp-arena-final-profile-${{ github.run_id }}
          path: _work/profile
          retention-days: 3
