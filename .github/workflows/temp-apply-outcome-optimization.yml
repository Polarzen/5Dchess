name: TEMP Apply Action outcome optimization

on:
  push:
    branches: [feat/local-ai-training-v2]
    paths:
      - .github/workflows/temp-apply-outcome-optimization.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-ai-training-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install game dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply minimal outcome-evaluation optimization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          engine_path = Path('src/engine/engine.py')
          engine = engine_path.read_text(encoding='utf-8')
          engine = replace_once(
              engine,
              'from src.engine.rules import RulesEngine\n\n\n@dataclass',
              'from src.engine.rules import RulesEngine\n\n\n_OUTCOME_UNSET = object()\n\n\n@dataclass',
              'engine outcome sentinel',
          )
          engine = replace_once(
              engine,
              '''    def submit_action(self) -> bool:\n        \"\"\"Finalize a royal-safe Action, then evaluate the opponent's full turn.\"\"\"\n''',
              '''    def submit_action(self, *, evaluate_outcome: bool = True) -> bool:\n        \"\"\"Finalize a royal-safe Action and, by default, evaluate the outcome.\n\n        ``evaluate_outcome=False`` is an internal transaction hook used only\n        when a caller has isolated the submitted state and will apply a\n        separately validated outcome. Canonical Action submission is never\n        skipped.\n        \"\"\"\n''',
              'submit signature',
          )
          engine = replace_once(
              engine,
              '''        # Checkmate/stalemate is global: after every submitted Action, determine\n        # whether the next player has at least one complete legal Action.\n        self._check_multiverse_game_result()\n        return True\n''',
              '''        # Checkmate/stalemate is global: after every submitted Action, determine\n        # whether the next player has at least one complete legal Action. The\n        # default public behavior is unchanged; the false branch is reserved for\n        # an isolated caller that already owns outcome-validation evidence.\n        if evaluate_outcome:\n            self._check_multiverse_game_result()\n        return True\n''',
              'submit outcome gate',
          )
          engine = replace_once(
              engine,
              '''    def _check_multiverse_game_result(self) -> None:\n        \"\"\"Update terminal state from complete Action-level 5D rules.\"\"\"\n        outcome = OutcomeRules.evaluate(self, self.current_turn_color)\n        if outcome is None:\n            return\n\n        if outcome.kind == OutcomeKind.CHECKMATE:\n            self.game_state = GameState.CHECKMATE\n            winner = outcome.winner.value if outcome.winner else \"unknown\"\n            logger.info(\n                f\"5D checkmate: {self.current_turn_color.value} has no legal \"\n                f\"Action; winner={winner}\"\n            )\n            return\n\n        if outcome.kind == OutcomeKind.STALEMATE:\n            self.game_state = GameState.STALEMATE\n            logger.info(\n                f\"5D stalemate: {self.current_turn_color.value} has no legal Action\"\n            )\n''',
              '''    def _evaluate_multiverse_game_result(self):\n        \"\"\"Evaluate terminal state without applying it to ``game_state``.\"\"\"\n        outcome = OutcomeRules.evaluate(self, self.current_turn_color)\n        return outcome, getattr(self, \"rule_warning\", None)\n\n    def _check_multiverse_game_result(\n        self,\n        *,\n        precomputed_outcome=_OUTCOME_UNSET,\n        rule_warning: str | None = None,\n    ) -> None:\n        \"\"\"Update terminal state from complete Action-level 5D rules.\n\n        Supplying ``precomputed_outcome`` applies outcome evidence produced from\n        an isolated but canonically submitted equivalent state. This avoids\n        repeating the expensive ActionSearch while keeping the normal no-argument\n        submission path unchanged.\n        \"\"\"\n        if precomputed_outcome is _OUTCOME_UNSET:\n            outcome, _ = self._evaluate_multiverse_game_result()\n        else:\n            outcome = precomputed_outcome\n            setattr(self, \"rule_warning\", rule_warning)\n\n        if outcome is None:\n            return\n\n        if outcome.kind == OutcomeKind.CHECKMATE:\n            self.game_state = GameState.CHECKMATE\n            winner = outcome.winner.value if outcome.winner else \"unknown\"\n            logger.info(\n                f\"5D checkmate: {self.current_turn_color.value} has no legal \"\n                f\"Action; winner={winner}\"\n            )\n            return\n\n        if outcome.kind == OutcomeKind.STALEMATE:\n            self.game_state = GameState.STALEMATE\n            logger.info(\n                f\"5D stalemate: {self.current_turn_color.value} has no legal Action\"\n            )\n''',
              'outcome evaluation split',
          )
          engine_path.write_text(engine, encoding='utf-8')

          planner_path = Path('src/ai/action_planner.py')
          planner = planner_path.read_text(encoding='utf-8')
          planner = replace_once(
              planner,
              '''def _apply_specs_once(\n    engine: \"FiveDEngine\",\n    plan: AIActionPlan,\n) -> tuple[Move, ...]:\n''',
              '''def _apply_specs_once(\n    engine: \"FiveDEngine\",\n    plan: AIActionPlan,\n    *,\n    evaluate_outcome: bool = True,\n) -> tuple[Move, ...]:\n''',
              'apply helper signature',
          )
          planner = replace_once(
              planner,
              '''    if not engine.submit_action():\n        raise ActionApplicationError(\"plan does not reach a submit-capable Action\")\n''',
              '''    if not engine.submit_action(evaluate_outcome=evaluate_outcome):\n        raise ActionApplicationError(\"plan does not reach a submit-capable Action\")\n''',
              'apply helper submission',
          )
          planner = replace_once(
              planner,
              '''    probe = deepcopy(engine)\n    try:\n        _apply_specs_once(probe, plan)\n    except InvalidActionPlanError:\n        raise\n    except (ValueError, RuntimeError) as exc:\n        raise ActionApplicationError(f\"plan validation failed: {exc}\") from exc\n\n    try:\n        return _apply_specs_once(engine, plan)\n    except InvalidActionPlanError:\n        raise\n    except (ValueError, RuntimeError) as exc:\n        raise ActionApplicationError(f\"plan application failed: {exc}\") from exc\n''',
              '''    probe = deepcopy(engine)\n    try:\n        # Validate every Move and canonical ActionRules.submit() on the isolated\n        # engine, but do not run the expensive global outcome search inside\n        # submit_action. Evaluate that post-submit state exactly once afterwards\n        # so any evaluation exception is still discovered before live mutation.\n        _apply_specs_once(probe, plan, evaluate_outcome=False)\n        outcome, rule_warning = probe._evaluate_multiverse_game_result()\n    except InvalidActionPlanError:\n        raise\n    except (ValueError, RuntimeError) as exc:\n        raise ActionApplicationError(f\"plan validation failed: {exc}\") from exc\n\n    try:\n        # Replay through the same canonical Move/Action submission path. The\n        # already-validated outcome is then applied on the live engine without\n        # repeating ActionSearch. Normal submit_action() callers remain unchanged.\n        applied = _apply_specs_once(engine, plan, evaluate_outcome=False)\n        engine._check_multiverse_game_result(\n            precomputed_outcome=outcome,\n            rule_warning=rule_warning,\n        )\n        return applied\n    except InvalidActionPlanError:\n        raise\n    except (ValueError, RuntimeError) as exc:\n        raise ActionApplicationError(f\"plan application failed: {exc}\") from exc\n''',
              'atomic one-pass outcome application',
          )
          planner_path.write_text(planner, encoding='utf-8')

          test_path = Path('tests/test_action_plan_outcome_efficiency.py')
          test_path.write_text(r'''\"\"\"Regression tests for one-pass Action-plan outcome evaluation.\"\"\"\nfrom copy import deepcopy\n\nimport pytest\n\nfrom src.ai import (\n    AIActionPlan,\n    ActionSearchBudget,\n    MoveSpec,\n    RandomAI,\n    apply_action_plan,\n    engine_state_signature,\n)\nfrom src.engine import ActionRules, FiveDEngine, Position, Timeline, TimelineManager\nfrom src.utils.constants import ChessColor, GameState\n\n\ndef _plan(engine: FiveDEngine) -> AIActionPlan:\n    return RandomAI(\n        engine.current_turn_color,\n        seed=17,\n        budget=ActionSearchBudget(\n            max_states=256,\n            max_actions=8,\n            max_move_depth=8,\n            max_seconds=1.0,\n        ),\n    ).plan_action(engine)\n\n\ndef _make_position(\n    timeline_id: int,\n    time_point: int,\n    pieces: dict[tuple[int, int], str],\n) -> Position:\n    board = [[\"\" for _ in range(8)] for _ in range(8)]\n    for (x, y), piece in pieces.items():\n        board[y][x] = piece\n    return Position(\n        board=board,\n        turn=ChessColor.WHITE if time_point % 2 == 0 else ChessColor.BLACK,\n        timeline_id=timeline_id,\n        time_point=time_point,\n        castling_rights={\n            \"white_kingside\": False,\n            \"white_queenside\": False,\n            \"black_kingside\": False,\n            \"black_queenside\": False,\n        },\n    )\n\n\ndef _install_position(engine: FiveDEngine, position: Position, color: ChessColor) -> None:\n    timeline = Timeline(timeline_id=0)\n    timeline.add_position(position)\n    manager = TimelineManager(max_timelines=engine.max_timelines)\n    manager.timelines = {0: timeline}\n    manager.active_timeline_id = 0\n    manager.refresh_activity()\n    engine.timeline_manager = manager\n    engine.game_state = GameState.PLAYING\n    engine.move_history = []\n    engine.action_history = []\n    engine.move_counter = 0\n    engine.current_turn_color = color\n    engine.current_action = ActionRules.begin(color, manager.timelines)\n\n\ndef _specific_plan(engine: FiveDEngine, coords: tuple[int, int, int, int]) -> AIActionPlan:\n    position = engine.get_current_position()\n    move = next(\n        move\n        for move in engine.get_legal_moves(position)\n        if (\n            move.source.x,\n            move.source.y,\n            move.destination.x,\n            move.destination.y,\n        ) == coords\n    )\n    return AIActionPlan(\n        color=engine.current_turn_color,\n        moves=(MoveSpec.from_move(move),),\n        start_signature=engine_state_signature(engine),\n    )\n\n\ndef test_apply_action_plan_evaluates_outcome_once_before_live_mutation(monkeypatch):\n    engine = FiveDEngine()\n    plan = _plan(engine)\n    evaluated_on = []\n    checked_on = []\n    original_evaluate = FiveDEngine._evaluate_multiverse_game_result\n    original_check = FiveDEngine._check_multiverse_game_result\n\n    def tracked_evaluate(self):\n        evaluated_on.append(self)\n        return original_evaluate(self)\n\n    def tracked_check(self, *args, **kwargs):\n        checked_on.append((self, kwargs))\n        return original_check(self, *args, **kwargs)\n\n    monkeypatch.setattr(FiveDEngine, \"_evaluate_multiverse_game_result\", tracked_evaluate)\n    monkeypatch.setattr(FiveDEngine, \"_check_multiverse_game_result\", tracked_check)\n\n    assert apply_action_plan(engine, plan)\n\n    assert len(evaluated_on) == 1\n    assert evaluated_on[0] is not engine\n    assert len(checked_on) == 1\n    assert checked_on[0][0] is engine\n    assert \"precomputed_outcome\" in checked_on[0][1]\n\n\ndef test_default_submit_action_still_evaluates_outcome_on_live_engine(monkeypatch):\n    engine = FiveDEngine()\n    position = engine.get_current_position()\n    move = engine.get_legal_moves(position)[0]\n    assert engine.execute_action_move(move)\n\n    evaluated_on = []\n    original_evaluate = FiveDEngine._evaluate_multiverse_game_result\n\n    def tracked_evaluate(self):\n        evaluated_on.append(self)\n        return original_evaluate(self)\n\n    monkeypatch.setattr(FiveDEngine, \"_evaluate_multiverse_game_result\", tracked_evaluate)\n\n    assert engine.submit_action()\n    assert evaluated_on == [engine]\n\n\n@pytest.mark.parametrize(\n    \"pieces, move_coords, expected_state\",\n    [\n        (\n            {(7, 7): \"K\", (6, 5): \"q\", (5, 5): \"k\"},\n            (6, 5, 6, 6),\n            GameState.CHECKMATE,\n        ),\n        (\n            {(7, 7): \"K\", (5, 4): \"q\", (5, 6): \"k\"},\n            (5, 4, 6, 5),\n            GameState.STALEMATE,\n        ),\n    ],\n)\ndef test_apply_action_plan_preserves_terminal_semantics(\n    pieces, move_coords, expected_state\n):\n    engine = FiveDEngine()\n    _install_position(engine, _make_position(0, 1, pieces), ChessColor.BLACK)\n    baseline = deepcopy(engine)\n    plan = _specific_plan(engine, move_coords)\n\n    baseline_move = next(\n        move\n        for move in baseline.get_legal_moves(baseline.get_current_position())\n        if (\n            move.source.x,\n            move.source.y,\n            move.destination.x,\n            move.destination.y,\n        ) == move_coords\n    )\n    assert baseline.execute_move(baseline_move)\n\n    assert apply_action_plan(engine, plan)\n    assert engine.game_state == expected_state\n    assert engine_state_signature(engine) == engine_state_signature(baseline)\n\n\ndef test_apply_action_plan_preserves_nonterminal_state_semantics():\n    engine = FiveDEngine()\n    baseline = deepcopy(engine)\n    plan = _plan(engine)\n\n    baseline_moves = []\n    for spec in plan.moves:\n        position = baseline._resolve_position(spec.source.board)\n        move = next(\n            move\n            for move in baseline.get_legal_moves_from_square(\n                position, spec.source.x, spec.source.y\n            )\n            if (\n                move.source == spec.source\n                and move.destination == spec.destination\n                and move.promotion == spec.promotion\n            )\n        )\n        assert baseline.execute_action_move(move)\n        baseline_moves.append(move)\n    assert baseline.submit_action()\n\n    assert apply_action_plan(engine, plan)\n    assert engine.game_state == GameState.PLAYING\n    assert engine_state_signature(engine) == engine_state_signature(baseline)\n'''.replace('\\n', '\n'), encoding='utf-8')
          PY

      - name: Compile and run focused regressions
        run: |
          python -m compileall -q src tests
          python -m pytest -q \
            tests/test_action_plan_outcome_efficiency.py \
            tests/test_action_plan_submission_efficiency.py \
            tests/test_checkmate_stalemate.py \
            tests/test_ai_action_planning.py

      - name: Commit validated source and tests
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/engine/engine.py src/ai/action_planner.py tests/test_action_plan_outcome_efficiency.py
          git diff --cached --check
          git commit -m 'perf(ai): evaluate applied Action outcome once'
          git push origin HEAD:feat/local-ai-training-v2
