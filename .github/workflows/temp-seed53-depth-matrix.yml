name: TEMP Shallow Completion Depth Matrix

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-seed53-depth-matrix.yml

permissions:
  contents: read
  actions: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install game dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Download exact planner failure states
        uses: actions/download-artifact@v4
        with:
          name: planner-failure-states-34337992183
          path: _work/failure-states
          repository: ${{ github.repository }}
          run-id: 34337992183
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run branch-local shallow depth matrix
        run: |
          export PYTHONPATH="$PWD"
          mkdir -p _work/depth-matrix
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          from src.ai.action_planner import ActionPlanner, ActionSearchBudget
          from src.data.archive import GameArchive

          rows = []
          for seed in (53, 55):
              payload = json.loads(Path(
                  f"_work/failure-states/seed{seed}-failure-archive.json"
              ).read_text(encoding="utf-8"))
              for depth in range(2, 9):
                  engine = GameArchive.restore(payload)
                  if hasattr(engine, "_replay_origin"):
                      delattr(engine, "_replay_origin")
                  started = time.monotonic()
                  result = ActionPlanner(ActionSearchBudget(
                      max_states=1024,
                      max_actions=1,
                      max_move_depth=depth,
                      max_seconds=5.0,
                  )).search(engine)
                  row = {
                      "seed": seed,
                      "depth": depth,
                      "elapsed_seconds": time.monotonic() - started,
                      "explored_states": result.explored_states,
                      "candidate_count": len(result.candidates),
                      "termination_reason": result.termination_reason,
                      "first_action_length": len(result.candidates[0]) if result.candidates else None,
                      "failed_state_cache_hits": result.failed_state_cache_hits,
                  }
                  rows.append(row)
                  print("DEPTH_RESULT=" + json.dumps(row, sort_keys=True))
                  if result.candidates:
                      break
          Path("_work/depth-matrix/results.json").write_text(
              json.dumps(rows, indent=2, sort_keys=True), encoding="utf-8"
          )
          PY
      - name: Upload matrix
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: shallow-depth-matrix-${{ github.run_id }}
          path: _work/depth-matrix
          retention-days: 7
          if-no-files-found: error
