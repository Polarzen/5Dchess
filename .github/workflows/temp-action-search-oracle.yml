name: TEMP ActionSearch Oracle Validation

on:
  push:
    branches:
      - feat/local-ai-training-v2

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile target modules
        run: python -m py_compile src/engine/action_search.py src/engine/engine.py tests/test_action_search_simulation_clone.py
      - name: Run deepcopy oracle tests
        run: python -m pytest -q tests/test_action_search_simulation_clone.py
