name: Local AI Training v2 CI

on:
  push:
    branches: [feat/local-ai-training-v2]
  pull_request:
    branches: [main]
    paths:
      - "src/training/**"
      - "scripts/training/**"
      - "tests/training/**"
      - "requirements-training.txt"
      - ".github/workflows/training-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  training-smoke:
    name: Python 3.11 CPU training smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt

      - name: Install game dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install CPU PyTorch training dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"

      - name: Compile source
        run: python -m compileall -q src scripts/training

      - name: Canonical Action AI regression
        run: timeout 90s python -m pytest -q tests/test_ai.py tests/test_ai_action_planning.py

      - name: Training unit and integration tests
        run: timeout 180s python -m pytest -q tests/training

      - name: PowerShell training launcher parse validation
        shell: pwsh
        run: |
          Get-ChildItem scripts/training/*.ps1 | ForEach-Object {
            [scriptblock]::Create((Get-Content $_.FullName -Raw)) | Out-Null
          }

      - name: End-to-end CPU smoke
        run: timeout 180s python -m src.training.smoke --device cpu
