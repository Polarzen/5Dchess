name: TEMP Dispatch 500 Training

on:
  push:
    branches: [feat/local-ai-training-v2]
    paths:
      - .github/workflows/temp-dispatch-500-training.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch existing Local AI Cloud Training workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run local-ai-train.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref feat/local-ai-training-v2 \
            -f games=500 \
            -f teacher=mixed \
            -f target_epochs=20 \
            -f batch_size=64 \
            -f preset=small \
            -f seed=42 \
            -f max_actions=120 \
            -f run_arena=false \
            -f arena_opponent=easy \
            -f arena_games=20 \
            -f arena_planner_seconds=5.0 \
            -f retain_dataset=true \
            -f resume_run_id='' \
            -f resume_artifact=''
