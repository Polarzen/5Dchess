name: TEMP Replay Clone Contract Fix

on:
  push:
    branches:
      - feat/local-ai-training-v2

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-ai-training-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Narrowly support archive-only replay metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/engine/engine.py')
          text = path.read_text(encoding='utf-8')
          old_doc = '''        Unknown dynamic engine attributes fail closed instead of being silently
        aliased or dropped. ``rule_warning`` is the one supported transient field.
        """
        expected = set(self.__dataclass_fields__) | {"rule_warning"}
'''
          new_doc = '''        Unknown dynamic engine attributes fail closed instead of being silently
        aliased or dropped. ``rule_warning`` is copied as supported transient rule
        state. ``_replay_origin`` is known archive-only metadata and is deliberately
        omitted: canonical simulation never reads it, and copying its mutable JSON
        snapshot into every search child would add cost without rule semantics.
        """
        expected = set(self.__dataclass_fields__) | {"rule_warning", "_replay_origin"}
'''
          if old_doc not in text:
              raise SystemExit('expected clone contract block not found')
          path.write_text(text.replace(old_doc, new_doc, 1), encoding='utf-8')
          PY
      - name: Compile
        run: python -m py_compile src/engine/engine.py src/engine/action_search.py tests/test_engine_simulation_clone.py tests/test_action_search_simulation_clone.py
      - name: Run focused clone and replay regressions
        run: |
          python -m pytest -q \
            tests/test_engine_simulation_clone.py \
            tests/test_action_search_simulation_clone.py \
            tests/test_checkmate_stalemate.py \
            tests/test_replay_storage_v2.py \
            tests/test_web_5d_interaction.py
      - name: Commit validated production fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/engine/engine.py
          git diff --cached --quiet && exit 1
          git commit -m 'fix(engine): ignore archive-only replay metadata in simulation clones'
          git push origin HEAD:feat/local-ai-training-v2
