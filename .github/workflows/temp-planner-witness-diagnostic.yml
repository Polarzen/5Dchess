name: TEMP Planner Witness Diagnostic

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-planner-witness-diagnostic.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged patch
        run: python .github/scripts/temp_apply_planner_direct_completion.py
      - name: Install test dependency
        run: python -m pip install "pytest>=7.4.0"
      - name: Run targeted tests
        run: python -m pytest -q tests/test_action_planner_direct_completion.py tests/test_action_planner_ordering.py
      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai/action_planner.py tests/test_action_planner_direct_completion.py
          git diff --cached --check
          git commit -m "fix(planner): prioritize direct Action completions"
          git push origin HEAD:feat/local-ai-training-v2
