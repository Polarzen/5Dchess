name: TEMP Planner Witness Diagnostic

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-planner-witness-diagnostic.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-training.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"
      - name: Download Stage 1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-stage1-500-34028226472
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: 34028226472
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Capture and deep-probe seed 42 failure
        run: |
          mkdir -p _work/diagnostic
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          from src.ai.action_planner import ActionPlanner, ActionSearchBudget, engine_state_signature
          from src.data.archive import GameArchive
          from src.engine.action import ActionRules
          from src.engine.action_search import ActionSearch
          from src.engine.engine import FiveDEngine
          from src.engine.royal_rules import RoyalRules
          from src.training.arena import evaluate_arena

          checkpoint = Path("_work/checkpoint/best").resolve()
          normal_budget = ActionSearchBudget(
              max_states=1024,
              max_actions=24,
              max_move_depth=32,
              max_seconds=5.0,
          )
          target_signature = "0649e0aa4bb20000a1db4fe41070c034c3a374a671203aacc173c6ecdf817137"
          original_search = ActionPlanner.search
          captured = {"done": False}
          evidence = {"target_signature": target_signature, "probe": None}

          def move_text(move):
              return {
                  "source": [move.source.board.timeline, move.source.board.turn, move.source.board.side.value, move.source.x, move.source.y],
                  "destination": [move.destination.board.timeline, move.destination.board.turn, move.destination.board.side.value, move.destination.x, move.destination.y],
                  "piece": move.piece.piece_type.value,
                  "promotion": move.promotion.value if move.promotion else None,
                  "branching": bool(move.is_branching),
                  "cross_timeline": bool(move.is_cross_timeline),
              }

          def capture_and_probe(self, engine):
              result = original_search(self, engine)
              if captured["done"] or result.candidates:
                  return result
              signature = engine_state_signature(engine)
              if signature != target_signature:
                  return result

              captured["done"] = True
              archive = GameArchive.capture(engine)
              archive_path = Path("_work/diagnostic/seed42-failure-state.json")
              archive_path.write_text(json.dumps(archive, indent=2, sort_keys=True), encoding="utf-8")
              restored = GameArchive.restore(json.loads(archive_path.read_text(encoding="utf-8")))
              restored_signature = engine_state_signature(restored)
              action = restored._ensure_current_action()
              required = ActionRules.required_boards(action, restored.timeline_manager.timelines)
              movable = ActionRules.movable_boards(action, restored.timeline_manager.timelines)

              counters = {"safe": 0}
              original_safe = RoyalRules.is_action_safe
              def counted_safe(rules, color):
                  counters["safe"] += 1
                  return original_safe(rules, color)
              RoyalRules.is_action_safe = counted_safe
              try:
                  started = time.monotonic()
                  deep = ActionSearch(
                      max_states=None,
                      max_depth=64,
                      max_seconds=120.0,
                  ).find_legal_completion(restored)
                  elapsed = time.monotonic() - started
              finally:
                  RoyalRules.is_action_safe = original_safe

              evidence["probe"] = {
                  "restored_signature": restored_signature,
                  "archive_roundtrip_matches": restored_signature == target_signature,
                  "required_boards": [str(board) for board in required],
                  "movable_boards": [str(board) for board in movable],
                  "elapsed_seconds": elapsed,
                  "explored_states": deep.explored_states,
                  "termination_reason": deep.termination_reason,
                  "has_legal_action": deep.has_legal_action,
                  "witness_length": len(deep.witness),
                  "witness": [move_text(move) for move in deep.witness],
                  "royal_safety_calls": counters["safe"],
              }
              Path("_work/diagnostic/deep-proof.json").write_text(
                  json.dumps(evidence, indent=2, sort_keys=True), encoding="utf-8"
              )
              return result

          ActionPlanner.search = capture_and_probe
          report = evaluate_arena(
              checkpoint=checkpoint,
              opponent="easy",
              games=1,
              device_name="cpu",
              seed=42,
              max_actions=120,
              budget=normal_budget,
              max_wall_seconds=1800,
              output="json",
              model_color="white",
              game_seeds=[42],
          )
          evidence["arena"] = {
              "planning_failure_count": report["planning_failure_count"],
              "first_failure": report.get("first_failure"),
          }
          Path("_work/diagnostic/deep-proof.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True), encoding="utf-8"
          )
          print(Path("_work/diagnostic/deep-proof.json").read_text(encoding="utf-8"))
          if not captured["done"]:
              raise SystemExit("target seed 42 failure state was not captured")
          PY
      - name: Upload diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: planner-seed42-deep-proof-${{ github.run_id }}
          path: _work/diagnostic
          retention-days: 7
          if-no-files-found: error
