name: TEMP Planner Witness Diagnostic

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-planner-witness-diagnostic.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download captured seed 42 state
        uses: actions/download-artifact@v4
        with:
          name: planner-seed42-deep-proof-34114771960
          path: _work/input
          repository: ${{ github.repository }}
          run-id: 34114771960
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rank root direct-completion moves
        run: |
          mkdir -p _work/diagnostic
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          from src.ai.action_planner import (
              _required_board_progress,
              _required_move_sort_key,
          )
          from src.data.archive import GameArchive
          from src.engine.action import ActionRules

          archive_path = Path("_work/input/seed42-failure-state.json")
          engine = GameArchive.restore(json.loads(archive_path.read_text(encoding="utf-8")))
          action = engine._ensure_current_action()
          required = set(ActionRules.required_boards(action, engine.timeline_manager.timelines))

          moves = []
          for board in sorted(required, key=lambda b: (b.timeline, b.turn, b.side.value)):
              position = engine._resolve_position(board)
              if position is not None:
                  moves.extend(engine.get_legal_moves(position))

          ordered = sorted(moves, key=lambda move: _required_move_sort_key(move, required))

          def move_text(move):
              return {
                  "source": [move.source.board.timeline, move.source.board.turn, move.source.board.side.value, move.source.x, move.source.y],
                  "destination": [move.destination.board.timeline, move.destination.board.turn, move.destination.board.side.value, move.destination.x, move.destination.y],
                  "piece": move.piece.piece_type.value,
                  "captured": move.captured.piece_type.value if move.captured else None,
                  "branching": bool(move.is_branching),
                  "cross_timeline": bool(move.is_cross_timeline),
                  "progress": _required_board_progress(move, required),
              }

          witness_source = (0, 25, "white", 1, 3)
          witness_destination = (-1, 25, "white", 1, 4)
          rows = []
          witness_rank = None
          direct_submit_ranks = []
          progress2_count = 0
          total_probe_seconds = 0.0

          for rank, move in enumerate(ordered, start=1):
              text = move_text(move)
              is_witness = (
                  tuple(text["source"]) == witness_source
                  and tuple(text["destination"]) == witness_destination
              )
              if is_witness:
                  witness_rank = rank

              direct_submit = False
              probe_seconds = None
              required_after = None
              if text["progress"] == 2:
                  progress2_count += 1
                  child = engine.clone_for_simulation()
                  assert child.execute_action_move(move)
                  after = set(ActionRules.required_boards(
                      child._ensure_current_action(),
                      child.timeline_manager.timelines,
                  ))
                  required_after = len(after)
                  started = time.monotonic()
                  direct_submit = not after and child.can_submit_action()
                  probe_seconds = time.monotonic() - started
                  total_probe_seconds += probe_seconds
                  if direct_submit:
                      direct_submit_ranks.append(rank)

              if rank <= 40 or text["progress"] == 2 or is_witness:
                  rows.append({
                      "rank": rank,
                      "is_witness": is_witness,
                      "direct_submit": direct_submit,
                      "required_after": required_after,
                      "submit_probe_seconds": probe_seconds,
                      **text,
                  })

          evidence = {
              "required_boards": [str(board) for board in sorted(required, key=lambda b: (b.timeline, b.turn, b.side.value))],
              "root_required_move_count": len(ordered),
              "progress2_count": progress2_count,
              "witness_rank": witness_rank,
              "direct_submit_count": len(direct_submit_ranks),
              "direct_submit_ranks": direct_submit_ranks,
              "total_direct_submit_probe_seconds": total_probe_seconds,
              "rows": rows,
          }
          out = Path("_work/diagnostic/root-ranking.json")
          out.write_text(json.dumps(evidence, indent=2, sort_keys=True), encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          if witness_rank is None:
              raise SystemExit("known seed 42 witness was not present in root required moves")
          PY
      - name: Upload diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: planner-seed42-root-ranking-${{ github.run_id }}
          path: _work/diagnostic
          retention-days: 7
          if-no-files-found: error
