name: TEMP Planner Witness Diagnostic

# One-shot validation for the current Arena terminal-proof fallback.
on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-planner-witness-diagnostic.yml

permissions:
  contents: read
  actions: read

jobs:
  reproduce-seed43:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-training.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"
      - name: Download Stage 1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-stage1-500-34028226472
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: 34028226472
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run current seed 43 case
        run: |
          mkdir -p _work/diagnostic
          python - <<'PY'
          import json
          from pathlib import Path

          from src.ai.action_planner import ActionSearchBudget
          from src.training.arena import evaluate_arena

          result = evaluate_arena(
              checkpoint=Path("_work/checkpoint/best").resolve(),
              opponent="easy",
              games=1,
              device_name="cpu",
              seed=43,
              max_actions=120,
              budget=ActionSearchBudget(
                  max_states=1024,
                  max_actions=24,
                  max_move_depth=32,
                  max_seconds=5.0,
              ),
              max_wall_seconds=300,
              output="json",
              model_color="black",
              game_seeds=[43],
          )
          path = Path("_work/diagnostic/seed43-current.json")
          path.write_text(json.dumps(result, indent=2, sort_keys=True), encoding="utf-8")
          print(path.read_text(encoding="utf-8"))
          PY
      - name: Upload result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: planner-seed43-current-${{ github.run_id }}
          path: _work/diagnostic
          retention-days: 7
          if-no-files-found: error
