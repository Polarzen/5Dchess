name: TEMP Planner Witness Diagnostic

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-planner-witness-diagnostic.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-training.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"
      - name: Download Stage 1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-stage1-500-34028226472
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: 34028226472
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Diagnose fixed failure states
        run: |
          mkdir -p _work/diagnostic
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          from src.ai.action_planner import ActionPlanner, ActionSearchBudget
          from src.engine.action import ActionRules
          from src.engine.action_search import ActionSearch
          from src.training.arena import evaluate_arena

          checkpoint = Path("_work/checkpoint/best").resolve()
          normal_budget = ActionSearchBudget(
              max_states=1024,
              max_actions=24,
              max_move_depth=32,
              max_seconds=5.0,
          )
          original_search = ActionPlanner.search
          diagnostics = []
          active_case = {"seed": None, "model_color": None}

          def board_text(board):
              return f"L{board.timeline}:T{board.turn}:{board.side.value}"

          def move_text(move):
              return {
                  "source": [move.source.board.timeline, move.source.board.turn, move.source.board.side.value, move.source.x, move.source.y],
                  "destination": [move.destination.board.timeline, move.destination.board.turn, move.destination.board.side.value, move.destination.x, move.destination.y],
                  "piece": move.piece.piece_type.value,
                  "promotion": move.promotion.value if move.promotion else None,
                  "branching": bool(move.is_branching),
                  "cross_timeline": bool(move.is_cross_timeline),
              }

          def run_engine_probe(engine, max_states, max_seconds):
              started = time.monotonic()
              result = ActionSearch(
                  max_states=max_states,
                  max_depth=32,
                  max_seconds=max_seconds,
              ).find_legal_completion(engine)
              return {
                  "kind": "ActionSearch",
                  "max_states": max_states,
                  "max_seconds": max_seconds,
                  "elapsed_seconds": time.monotonic() - started,
                  "has_legal_action": result.has_legal_action,
                  "explored_states": result.explored_states,
                  "termination_reason": result.termination_reason,
                  "witness_length": len(result.witness),
                  "witness": [move_text(move) for move in result.witness],
              }

          def run_planner_probe(engine, max_states, max_seconds):
              planner = ActionPlanner(ActionSearchBudget(
                  max_states=max_states,
                  max_actions=1,
                  max_move_depth=32,
                  max_seconds=max_seconds,
              ))
              started = time.monotonic()
              result = original_search(planner, engine)
              return {
                  "kind": "ActionPlanner-first",
                  "max_states": max_states,
                  "max_seconds": max_seconds,
                  "elapsed_seconds": time.monotonic() - started,
                  "has_legal_action": bool(result.candidates),
                  "explored_states": result.explored_states,
                  "termination_reason": result.termination_reason,
                  "failed_state_cache_hits": getattr(result, "failed_state_cache_hits", 0),
                  "witness_length": len(result.candidates[0]) if result.candidates else 0,
              }

          def diagnostic_search(self, engine):
              result = original_search(self, engine)
              if result.candidates:
                  return result
              snapshot = engine.clone_for_simulation()
              snapshot.timeline_manager.refresh_activity()
              action = snapshot._ensure_current_action()
              required = set(ActionRules.required_boards(action, snapshot.timeline_manager.timelines))
              movable = set(ActionRules.movable_boards(action, snapshot.timeline_manager.timelines))
              legal_counts = {}
              for board in sorted(movable, key=lambda b: (b.timeline, b.turn, b.side.value)):
                  position = snapshot._resolve_position(board)
                  legal_counts[board_text(board)] = len(snapshot.get_legal_moves(position)) if position is not None else None
              entry = {
                  "seed": active_case["seed"],
                  "model_color": active_case["model_color"],
                  "player": engine.current_turn_color.value,
                  "original": {
                      "explored_states": result.explored_states,
                      "termination_reason": result.termination_reason,
                      "failed_state_cache_hits": getattr(result, "failed_state_cache_hits", 0),
                  },
                  "required_boards": [board_text(b) for b in sorted(required, key=lambda b: (b.timeline, b.turn, b.side.value))],
                  "movable_boards": [board_text(b) for b in sorted(movable, key=lambda b: (b.timeline, b.turn, b.side.value))],
                  "legal_move_counts": legal_counts,
                  "probes": [],
              }
              for states, seconds in ((1024, 5.0), (4096, 15.0), (16384, 30.0)):
                  entry["probes"].append(run_engine_probe(engine, states, seconds))
                  entry["probes"].append(run_planner_probe(engine, states, seconds))
                  if entry["probes"][-1]["has_legal_action"] and entry["probes"][-2]["has_legal_action"]:
                      break
              diagnostics.append(entry)
              return result

          ActionPlanner.search = diagnostic_search

          reports = []
          for seed, model_color in ((42, "white"), (43, "black")):
              active_case["seed"] = seed
              active_case["model_color"] = model_color
              report = evaluate_arena(
                  checkpoint=checkpoint,
                  opponent="easy",
                  games=1,
                  device_name="cpu",
                  seed=seed,
                  max_actions=120,
                  budget=normal_budget,
                  max_wall_seconds=1800,
                  output="json",
                  model_color=model_color,
                  game_seeds=[seed],
              )
              reports.append({
                  "seed": seed,
                  "model_color": model_color,
                  "planning_failure_count": report["planning_failure_count"],
                  "first_failure": report.get("first_failure"),
              })

          payload = {"reports": reports, "diagnostics": diagnostics}
          path = Path("_work/diagnostic/witness-diagnostic.json")
          path.write_text(json.dumps(payload, indent=2, sort_keys=True), encoding="utf-8")
          print(path.read_text(encoding="utf-8"))
          PY
      - name: Upload diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: planner-witness-diagnostic-${{ github.run_id }}
          path: _work/diagnostic
          retention-days: 7
          if-no-files-found: error
