name: Planner Regression

on:
  push:
    branches: [main, feat/local-ai-training-v2]
  pull_request:
    branches: [main, feat/local-ai-training-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planner-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  captured-positions:
    name: Canonical planner fixtures and budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install game dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Historical captures include positions whose old witnesses are unsafe
      # under all-King validation. Their tests require the canonical proof,
      # never a candidate merely to turn a previous timeout into a pass.
      - name: Run durable planner and outcome regressions
        run: >-
          timeout 300s python -m pytest -q
          tests/test_action_planner_*.py
          tests/test_planner_*.py
          tests/test_action_plan_*efficiency.py
          tests/test_action_proof.py
          tests/test_required_arrival_proof.py
          tests/test_action_search_*.py
          tests/test_minimax_planner_budget.py
          tests/test_legacy_royal_witnesses.py
          tests/test_outcome_rewind_probe.py
          tests/training/test_planner_complex_fixture.py
          tests/training/test_planner_complex_32.py
          --junitxml=planner-regression.xml

      - name: Upload regression report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: planner-regression-${{ github.run_id }}
          path: planner-regression.xml
          retention-days: 30
          if-no-files-found: warn
