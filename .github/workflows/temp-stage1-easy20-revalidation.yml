name: TEMP Stage1 Easy20 Revalidation

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-stage1-easy20-revalidation.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-stage1-easy20-revalidation
  cancel-in-progress: false

jobs:
  arena:
    name: Fixed-seed Easy 20 post-fix gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt
      - name: Install game and CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"
      - name: Download Stage 1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-stage1-500-34028226472
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: 34028226472
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate checkpoint shape
        run: python -m src.training.cloud check-resume --checkpoint _work/checkpoint/best --preset small
      - name: Run fixed-seed side-balanced Easy benchmark
        run: |
          mkdir -p _work/arena-report
          python - <<'PY'
          import json
          from pathlib import Path
          from src.ai.action_planner import ActionSearchBudget
          from src.training.arena import evaluate_arena

          checkpoint = Path("_work/checkpoint/best")
          out_dir = Path("_work/arena-report")
          seeds = list(range(42, 62))
          white_seeds = seeds[0::2]
          black_seeds = seeds[1::2]
          budget = ActionSearchBudget(max_states=1024,max_actions=24,max_move_depth=32,max_seconds=5.0)
          white = evaluate_arena(checkpoint=checkpoint,opponent="easy",games=len(white_seeds),device_name="cpu",seed=42,max_actions=120,budget=budget,max_wall_seconds=1800,output="json",model_color="white",game_seeds=white_seeds)
          black = evaluate_arena(checkpoint=checkpoint,opponent="easy",games=len(black_seeds),device_name="cpu",seed=42,max_actions=120,budget=budget,max_wall_seconds=1800,output="json",model_color="black",game_seeds=black_seeds)
          def total(key): return int(white.get(key,0)) + int(black.get(key,0))
          games = total("games")
          combined = {"opponent":"easy","seed_set":seeds,"planner":{"states":1024,"actions":24,"moves":32,"seconds":5.0},"games":games,"wins":total("wins"),"draws":total("draws"),"losses":total("losses"),"win_rate":total("wins")/max(1,games),"illegal_action_count":total("illegal_action_count"),"stale_failure_count":total("stale_failure_count"),"planning_failure_count":total("planning_failure_count"),"unexpected_failure_count":total("unexpected_failure_count"),"budget_termination_count":total("budget_termination_count"),"proven_terminal_adjudication_count":total("proven_terminal_adjudication_count"),"white":white,"black":black}
          for name,data in [("easy-white.json",white),("easy-black.json",black),("easy-combined.json",combined)]:
              (out_dir/name).write_text(json.dumps(data,indent=2,sort_keys=True),encoding="utf-8")
          print(json.dumps(combined,indent=2,sort_keys=True))
          PY
      - name: Upload benchmark artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stage1-easy20-revalidation-${{ github.run_id }}
          path: _work/arena-report
          retention-days: 7
          if-no-files-found: warn
      - name: Enforce Arena safety gate
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("_work/arena-report/easy-combined.json")
          if not p.exists(): raise SystemExit("benchmark result missing")
          r=json.loads(p.read_text(encoding="utf-8"))
          failures=sum(int(r[k]) for k in ("illegal_action_count","stale_failure_count","planning_failure_count","unexpected_failure_count"))
          if failures: raise SystemExit(f"Arena safety gate failed with {failures} failures")
          PY
