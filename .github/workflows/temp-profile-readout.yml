name: TEMP Profile attribution readout

on:
  push:
    branches: [feat/local-ai-training-v2]
    paths:
      - .github/workflows/temp-profile-readout.yml

permissions:
  contents: read
  actions: read

jobs:
  readout:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: temp-arena-outcome-profile-33952173118
          path: profile
          repository: ${{ github.repository }}
          run-id: "33952173118"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Print raw deepcopy attribution
        run: |
          python - <<'PY'
          import pstats
          from pathlib import Path

          path = Path('profile/arena-5s.pstats')
          stats = pstats.Stats(str(path)).strip_dirs().sort_stats('cumulative')

          def dump_function(filename, funcname):
              matches = [
                  (key, value)
                  for key, value in stats.stats.items()
                  if key[0].endswith(filename) and key[2] == funcname
              ]
              print(f'=== {filename}:{funcname} RAW ===')
              for key, value in matches:
                  cc, nc, tt, ct, callers = value
                  print('FUNCTION', key, 'cc=', cc, 'nc=', nc, 'tt=', tt, 'ct=', ct)
                  for caller, contribution in sorted(
                      callers.items(), key=lambda item: item[1][-1], reverse=True
                  ):
                      print('CALLER', caller, 'CONTRIB', contribution)

          dump_function('board.py', 'copy')
          dump_function('copy.py', 'deepcopy')
          dump_function('encoding.py', 'encode_action')
          PY
