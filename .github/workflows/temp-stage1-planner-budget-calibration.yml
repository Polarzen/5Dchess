name: TEMP Stage1 Planner Budget Calibration

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-stage1-planner-budget-calibration.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-stage1-planner-budget-calibration
  cancel-in-progress: false

jobs:
  calibrate:
    name: Recheck fixed planner failures at 10s / 4096 states
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt

      - name: Install game and CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"

      - name: Download Stage 1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-stage1-500-34028226472
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: 34028226472
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate checkpoint shape
        run: python -m src.training.cloud check-resume --checkpoint _work/checkpoint/best --preset small

      - name: Reproduce neural and baseline failures with expanded budget
        run: |
          mkdir -p _work/planner-calibration
          python - <<'PY'
          import json
          from pathlib import Path

          from src.ai.action_planner import ActionSearchBudget
          from src.training.arena import evaluate_arena

          checkpoint = Path("_work/checkpoint/best")
          out_dir = Path("_work/planner-calibration")
          budget = ActionSearchBudget(
              max_states=4096,
              max_actions=24,
              max_move_depth=32,
              max_seconds=10.0,
          )

          # Fixed failures from Easy benchmark run 34087779778:
          # - neural-side failure: model white, seed 42
          # - baseline-side failure: model black, seed 43 (failure player was white)
          cases = [
              ("neural-white-seed42", "white", 42),
              ("baseline-white-seed43", "black", 43),
          ]
          results = {}
          for name, model_color, game_seed in cases:
              result = evaluate_arena(
                  checkpoint=checkpoint,
                  opponent="easy",
                  games=1,
                  device_name="cpu",
                  seed=game_seed,
                  max_actions=120,
                  budget=budget,
                  max_wall_seconds=1200,
                  output="json",
                  model_color=model_color,
                  game_seeds=[game_seed],
              )
              results[name] = result
              (out_dir / f"{name}.json").write_text(
                  json.dumps(result, indent=2, sort_keys=True), encoding="utf-8"
              )

          summary = {
              "source_benchmark_run": 34087779778,
              "planner": {
                  "states": 4096,
                  "actions": 24,
                  "moves": 32,
                  "seconds": 10.0,
              },
              "cases": {
                  name: {
                      "model_color": result.get("model_color_mode"),
                      "seed": result.get("explicit_game_seeds", [None])[0],
                      "wins": result.get("wins", 0),
                      "draws": result.get("draws", 0),
                      "losses": result.get("losses", 0),
                      "planning_failure_count": result.get("planning_failure_count", 0),
                      "budget_termination_count": result.get("budget_termination_count", 0),
                      "illegal_action_count": result.get("illegal_action_count", 0),
                      "stale_failure_count": result.get("stale_failure_count", 0),
                      "unexpected_failure_count": result.get("unexpected_failure_count", 0),
                      "first_failure": result.get("first_failure"),
                  }
                  for name, result in results.items()
              },
          }
          (out_dir / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True), encoding="utf-8"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Publish calibration summary
        if: ${{ always() }}
        run: |
          echo "# Stage 1 planner budget calibration" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "- Source benchmark: run \`34087779778\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Expanded planner: \`10.0 s / 4096 states / 24 actions / 32 moves\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f _work/planner-calibration/summary.json ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path("_work/planner-calibration/summary.json").read_text(encoding="utf-8"))
          for name, case in r["cases"].items():
              print(
                  f"- {name}: W/D/L `{case['wins']}/{case['draws']}/{case['losses']}`, "
                  f"planning `{case['planning_failure_count']}`, budget `{case['budget_termination_count']}`, "
                  f"illegal `{case['illegal_action_count']}`, stale `{case['stale_failure_count']}`, "
                  f"unexpected `{case['unexpected_failure_count']}`"
              )
              failure = case.get("first_failure")
              if failure:
                  print(
                      f"  - first failure: player `{failure.get('player')}`, "
                      f"reason `{failure.get('planning_reason')}`, states `{failure.get('explored_states')}`"
                  )
          PY
          fi

      - name: Upload calibration artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stage1-planner-calibration-${{ github.run_id }}
          path: _work/planner-calibration
          retention-days: 30
          if-no-files-found: warn

      - name: Enforce diagnostic safety gate
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("_work/planner-calibration/summary.json")
          if not path.exists():
              raise SystemExit("planner calibration result missing")
          r = json.loads(path.read_text(encoding="utf-8"))
          failures = 0
          for case in r["cases"].values():
              failures += int(case["planning_failure_count"])
              failures += int(case["illegal_action_count"])
              failures += int(case["stale_failure_count"])
              failures += int(case["unexpected_failure_count"])
          if failures:
              raise SystemExit(f"Planner calibration still has {failures} safety failures")
          PY
