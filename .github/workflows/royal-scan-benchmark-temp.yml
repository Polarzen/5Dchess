name: TEMP RoyalRules 32-timeline benchmark

on:
  push:
    branches: [feat/local-ai-training-v2]
    paths:
      - .github/workflows/royal-scan-benchmark-temp.yml
      - src/engine/royal_rules.py

permissions:
  contents: read

concurrency:
  group: temp-royal-scan-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Safe full scan across 32 timelines
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Benchmark worst-case safe royal scan
        run: |
          python - <<'PY'
          from statistics import median
          from time import perf_counter

          from src.engine.board import Position
          from src.engine.coordinates import BoardCoord
          from src.engine.royal_rules import RoyalRules
          from src.engine.timeline import Timeline
          from src.utils.constants import ChessColor

          timeline_ids = tuple(range(-16, 16))
          time_points = tuple(range(1, 42))  # 41 boards per timeline; latest is Black-to-move.
          timelines = {}

          for timeline_id in timeline_ids:
              timeline = Timeline(timeline_id=timeline_id)
              for time_point in time_points:
                  board = [["" for _ in range(8)] for _ in range(8)]
                  board[7][7] = "K"
                  if time_point == time_points[-1]:
                      # Sixteen black attackers per playable board. Keep them far
                      # from h8 so this is a safe position and RoyalRules must
                      # exhaust the full attacker × historical-King candidate set.
                      for y in (0, 1):
                          for x in range(8):
                              board[y][x] = "p"
                  position = Position(
                      board=board,
                      turn=BoardCoord.legacy_side_for_time_point(time_point),
                      timeline_id=timeline_id,
                      time_point=time_point,
                  )
                  timeline.add_position(position)
              timelines[timeline_id] = timeline

          expected_kings = len(timeline_ids) * len(time_points)
          expected_attackers = len(timeline_ids) * 16
          candidate_pairs = expected_kings * expected_attackers
          rules = RoyalRules(timelines)

          timings = []
          for _ in range(5):
              started = perf_counter()
              threats = rules.direct_threats_against(ChessColor.WHITE)
              elapsed = perf_counter() - started
              if threats:
                  raise SystemExit(f"synthetic safe position unexpectedly has {len(threats)} threats")
              timings.append(elapsed)

          print(f"timelines={len(timeline_ids)}")
          print(f"boards={expected_kings}")
          print(f"attackers={expected_attackers}")
          print(f"candidate_pairs={candidate_pairs}")
          print(f"scan_seconds={timings}")
          print(f"median_seconds={median(timings):.6f}")
          print(f"max_seconds={max(timings):.6f}")

          if max(timings) >= 5.0:
              raise SystemExit(
                  f"RoyalRules full safe scan exceeded planner budget: {max(timings):.3f}s"
              )
          PY
