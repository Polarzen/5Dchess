name: TEMP Arena witness comparison

on:
  push:
    branches: [feat/local-ai-training-v2]
    paths:
      - .github/workflows/arena-checkpoint-diagnostic-temp.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-arena-witness-comparison-${{ github.ref }}
  cancel-in-progress: false

jobs:
  witness-comparison:
    name: Reproduce Arena failure and compare witness search
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"

      - name: Download run 33347901504 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-33347901504
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: "33347901504"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reproduce first 5-second planning failure and compare searches
        run: |
          mkdir -p _work/witness-comparison
          python - <<'PY'
          from __future__ import annotations

          from copy import deepcopy
          import hashlib
          import json
          from pathlib import Path
          import time

          from src.ai.action_planner import (
              AIActionPlan,
              ActionPlanner,
              ActionPlanningError,
              ActionSearchBudget,
              MoveSpec,
              engine_state_signature,
              resolve_move_spec,
          )
          from src.ai.random_ai import RandomAI
          from src.engine import ActionRules
          from src.engine.action_search import ActionSearch
          from src.engine.engine import FiveDEngine
          from src.training.agent import NeuralPolicyValueAgent
          from src.training.checkpoint import load_checkpoint
          from src.training.utils import resolve_device, seed_everything
          from src.utils.constants import ChessColor, GameState

          root = Path('_work/witness-comparison')
          seed_everything(42)
          device = resolve_device('cpu')
          model, metadata = load_checkpoint('_work/checkpoint/best', device=device)
          arena_budget = ActionSearchBudget(
              max_states=256,
              max_actions=24,
              max_move_depth=32,
              max_seconds=5.0,
          )

          failure_engine = None
          failure = None
          for game_index in range(5):
              neural_color = ChessColor.WHITE if game_index % 2 == 0 else ChessColor.BLACK
              engine = FiveDEngine()
              neural = NeuralPolicyValueAgent(model, neural_color, device=device, budget=arena_budget)
              baseline = RandomAI(
                  neural_color.opposite(),
                  seed=42 + game_index + 1,
                  budget=arena_budget,
              )
              for action_index in range(120):
                  if engine.game_state != GameState.PLAYING:
                      break
                  actor = neural if engine.current_turn_color == neural_color else baseline
                  actor_name = 'neural' if actor is neural else 'baseline'
                  try:
                      plan = actor.plan_action(engine)
                  except ActionPlanningError as exc:
                      failure_engine = deepcopy(engine)
                      signature = repr(engine_state_signature(engine)).encode('utf-8')
                      action = engine._ensure_current_action()
                      required = ActionRules.required_boards(action, engine.timeline_manager.timelines)
                      movable = ActionRules.movable_boards(action, engine.timeline_manager.timelines)
                      failure = {
                          'game_index': game_index,
                          'action_index': action_index,
                          'actor': actor_name,
                          'player': engine.current_turn_color.value,
                          'ply': engine.move_counter,
                          'timeline_count': len(engine.timeline_manager.timelines),
                          'required_board_count': len(required),
                          'movable_board_count': len(movable),
                          'current_action_prefix_moves': len(action.moves),
                          'reason': exc.reason,
                          'incomplete': exc.incomplete,
                          'explored_states': exc.explored_states,
                          'state_signature_sha256': hashlib.sha256(signature).hexdigest(),
                      }
                      break
                  from src.ai.action_planner import apply_action_plan
                  apply_action_plan(engine, plan)
              if failure_engine is not None:
                  break

          report = {
              'checkpoint_epoch': metadata.get('epoch'),
              'arena_budget_seconds': 5.0,
              'arena_max_states': 256,
              'failure': failure,
              'comparisons': [],
          }

          if failure_engine is None:
              report['error'] = 'no planning failure reproduced in five games'
          else:
              prefix_len = len(failure_engine._ensure_current_action().moves)

              def verify_witness(witness):
                  suffix = tuple(witness[prefix_len:])
                  probe = deepcopy(failure_engine)
                  for move in suffix:
                      spec = MoveSpec.from_move(move)
                      resolved = resolve_move_spec(probe, spec)
                      if not probe.execute_action_move(resolved):
                          return {'valid': False, 'suffix_moves': len(suffix), 'reason': 'execute_rejected'}
                  return {
                      'valid': bool(probe.can_submit_action()),
                      'suffix_moves': len(suffix),
                      'reason': None if probe.can_submit_action() else 'not_submit_capable',
                  }

              for states in (256, 4096):
                  started = time.perf_counter()
                  result = ActionSearch(
                      max_states=states,
                      max_depth=64,
                      max_seconds=5.0,
                  ).find_legal_completion(failure_engine)
                  item = {
                      'search': 'engine_action_search',
                      'max_states': states,
                      'max_seconds': 5.0,
                      'has_legal_action': result.has_legal_action,
                      'explored_states': result.explored_states,
                      'termination_reason': result.termination_reason,
                      'witness_moves': len(result.witness),
                      'wall_ms': (time.perf_counter() - started) * 1000.0,
                  }
                  if result.has_legal_action:
                      item['verification'] = verify_witness(result.witness)
                  report['comparisons'].append(item)

              started = time.perf_counter()
              planner = ActionPlanner(ActionSearchBudget(
                  max_states=4096,
                  max_actions=1,
                  max_move_depth=64,
                  max_seconds=5.0,
              ))
              planner_result = planner.search(failure_engine)
              planner_item = {
                  'search': 'current_action_planner',
                  'max_states': 4096,
                  'max_seconds': 5.0,
                  'candidate_count': len(planner_result.candidates),
                  'explored_states': planner_result.explored_states,
                  'termination_reason': planner_result.termination_reason,
                  'wall_ms': (time.perf_counter() - started) * 1000.0,
              }
              if planner_result.candidates:
                  probe = deepcopy(failure_engine)
                  for spec in planner_result.candidates[0]:
                      resolved = resolve_move_spec(probe, spec)
                      assert probe.execute_action_move(resolved)
                  planner_item['verification'] = {
                      'valid': bool(probe.can_submit_action()),
                      'suffix_moves': len(planner_result.candidates[0]),
                  }
              report['comparisons'].append(planner_item)

          path = root / 'witness-comparison.json'
          path.write_text(json.dumps(report, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps(report, indent=2, sort_keys=True))
          if failure_engine is None:
              raise SystemExit(2)
          PY

      - name: Upload diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: temp-arena-witness-comparison-${{ github.run_id }}
          path: _work/witness-comparison
          retention-days: 3
          if-no-files-found: error
