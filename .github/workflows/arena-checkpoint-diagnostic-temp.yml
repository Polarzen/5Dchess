name: TEMP Arena root planner profile

on:
  push:
    branches: [feat/local-ai-training-v2]
    paths:
      - .github/workflows/arena-checkpoint-diagnostic-temp.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-arena-root-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  root-profile:
    name: Profile reproduced Arena planner root
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"

      - name: Download run 33347901504 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-33347901504
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: "33347901504"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reproduce and profile root
        run: |
          mkdir -p _work/root-profile
          python - <<'PY'
          from __future__ import annotations

          from copy import deepcopy
          import hashlib
          import json
          from pathlib import Path
          import statistics
          import time

          from src.ai.action_planner import (
              ActionPlanningError,
              ActionSearchBudget,
              _required_board_progress,
              _required_move_sort_key,
              apply_action_plan,
              engine_state_signature,
          )
          from src.ai.random_ai import RandomAI
          from src.engine import ActionRules
          from src.engine.engine import FiveDEngine
          from src.engine.royal_rules import RoyalRules
          from src.training.agent import NeuralPolicyValueAgent
          from src.training.checkpoint import load_checkpoint
          from src.training.utils import resolve_device, seed_everything
          from src.utils.constants import ChessColor, GameState

          root = Path('_work/root-profile')
          seed_everything(42)
          device = resolve_device('cpu')
          model, metadata = load_checkpoint('_work/checkpoint/best', device=device)
          arena_budget = ActionSearchBudget(max_states=256, max_actions=24, max_move_depth=32, max_seconds=5.0)

          failure_engine = None
          failure = None
          for game_index in range(5):
              neural_color = ChessColor.WHITE if game_index % 2 == 0 else ChessColor.BLACK
              engine = FiveDEngine()
              neural = NeuralPolicyValueAgent(model, neural_color, device=device, budget=arena_budget)
              baseline = RandomAI(neural_color.opposite(), seed=42 + game_index + 1, budget=arena_budget)
              for action_index in range(120):
                  if engine.game_state != GameState.PLAYING:
                      break
                  actor = neural if engine.current_turn_color == neural_color else baseline
                  actor_name = 'neural' if actor is neural else 'baseline'
                  try:
                      plan = actor.plan_action(engine)
                  except ActionPlanningError as exc:
                      failure_engine = deepcopy(engine)
                      action = engine._ensure_current_action()
                      required = set(ActionRules.required_boards(action, engine.timeline_manager.timelines))
                      movable = ActionRules.movable_boards(action, engine.timeline_manager.timelines)
                      failure = {
                          'game_index': game_index,
                          'action_index': action_index,
                          'actor': actor_name,
                          'player': engine.current_turn_color.value,
                          'ply': engine.move_counter,
                          'timeline_count': len(engine.timeline_manager.timelines),
                          'required_board_count': len(required),
                          'movable_board_count': len(movable),
                          'reason': exc.reason,
                          'explored_states': exc.explored_states,
                          'state_signature_sha256': hashlib.sha256(repr(engine_state_signature(engine)).encode('utf-8')).hexdigest(),
                      }
                      break
                  apply_action_plan(engine, plan)
              if failure_engine is not None:
                  break

          report = {'checkpoint_epoch': metadata.get('epoch'), 'failure': failure}
          if failure_engine is None:
              report['error'] = 'no planning failure reproduced'
          else:
              state = failure_engine
              action = state._ensure_current_action()
              required = set(ActionRules.required_boards(action, state.timeline_manager.timelines))
              movable = ActionRules.movable_boards(action, state.timeline_manager.timelines)
              safety_started = time.perf_counter()
              in_check = RoyalRules(state.timeline_manager.timelines).is_in_check(state.current_turn_color)
              check_ms = (time.perf_counter() - safety_started) * 1000.0
              threats_started = time.perf_counter()
              threats = RoyalRules(state.timeline_manager.timelines).threats_against(state.current_turn_color)
              threats_ms = (time.perf_counter() - threats_started) * 1000.0

              board_profiles = []
              all_moves = []
              ordered_boards = tuple(sorted(movable, key=lambda b: (b not in required, b.timeline, b.turn, b.side.value)))
              for board in ordered_boards:
                  position = state._resolve_position(board)
                  if position is None:
                      continue
                  started = time.perf_counter()
                  moves = state.get_legal_moves(position)
                  legal_ms = (time.perf_counter() - started) * 1000.0
                  started = time.perf_counter()
                  ordered = sorted(moves, key=lambda m: _required_move_sort_key(m, required))
                  sort_ms = (time.perf_counter() - started) * 1000.0
                  counts = {
                      'total': len(ordered),
                      'branching': sum(bool(m.is_branching) for m in ordered),
                      'cross_timeline': sum(bool(m.is_cross_timeline) for m in ordered),
                      'captures': sum(m.captured is not None for m in ordered),
                      'king_moves': sum(m.piece.piece_type.value == 'king' for m in ordered),
                      'progress_2': sum(_required_board_progress(m, required) >= 2 for m in ordered),
                      'progress_1': sum(_required_board_progress(m, required) == 1 for m in ordered),
                  }
                  board_profiles.append({
                      'board': [board.timeline, board.turn, board.side.value],
                      'required': board in required,
                      'legal_ms': legal_ms,
                      'sort_ms': sort_ms,
                      'counts': counts,
                  })
                  all_moves.extend(ordered)

              copy_ms = []
              execute_ms = []
              child_required_counts = []
              terminal_ms = []
              terminal_checks = 0
              submit_capable = 0
              first_submit_rank = None
              move_samples = []
              for rank, move in enumerate(all_moves, start=1):
                  started = time.perf_counter()
                  child = deepcopy(state)
                  copy_ms.append((time.perf_counter() - started) * 1000.0)
                  started = time.perf_counter()
                  ok = child.execute_action_move(move)
                  execute_ms.append((time.perf_counter() - started) * 1000.0)
                  if not ok:
                      continue
                  child_required = set(ActionRules.required_boards(child._ensure_current_action(), child.timeline_manager.timelines))
                  child_required_counts.append(len(child_required))
                  can_submit = None
                  can_submit_ms = None
                  if not child_required:
                      terminal_checks += 1
                      started = time.perf_counter()
                      can_submit = child.can_submit_action()
                      can_submit_ms = (time.perf_counter() - started) * 1000.0
                      terminal_ms.append(can_submit_ms)
                      if can_submit:
                          submit_capable += 1
                          if first_submit_rank is None:
                              first_submit_rank = rank
                  if rank <= 30:
                      move_samples.append({
                          'rank': rank,
                          'piece': move.piece.piece_type.value,
                          'capture': move.captured.piece_type.value if move.captured else None,
                          'branching': bool(move.is_branching),
                          'cross_timeline': bool(move.is_cross_timeline),
                          'progress': _required_board_progress(move, required),
                          'source': [move.source.board.timeline, move.source.board.turn, move.source.board.side.value, move.source.x, move.source.y],
                          'destination': [move.destination.board.timeline, move.destination.board.turn, move.destination.board.side.value, move.destination.x, move.destination.y],
                          'child_required_count': len(child_required),
                          'can_submit': can_submit,
                          'can_submit_ms': can_submit_ms,
                      })

              def stat(values):
                  if not values:
                      return {'count': 0, 'total_ms': 0.0, 'median_ms': 0.0, 'max_ms': 0.0}
                  return {
                      'count': len(values),
                      'total_ms': sum(values),
                      'median_ms': statistics.median(values),
                      'max_ms': max(values),
                  }

              report['root_profile'] = {
                  'in_check': in_check,
                  'in_check_ms': check_ms,
                  'threat_count': len(threats),
                  'threats_ms': threats_ms,
                  'boards': board_profiles,
                  'total_root_moves': len(all_moves),
                  'deepcopy': stat(copy_ms),
                  'execute': stat(execute_ms),
                  'terminal_checks': terminal_checks,
                  'terminal_check': stat(terminal_ms),
                  'one_move_submit_capable': submit_capable,
                  'first_one_move_submit_rank': first_submit_rank,
                  'child_required_counts': {str(v): child_required_counts.count(v) for v in sorted(set(child_required_counts))},
                  'first_30_moves': move_samples,
              }

          (root / 'root-profile.json').write_text(json.dumps(report, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps(report, indent=2, sort_keys=True))
          if failure_engine is None:
              raise SystemExit(2)
          PY

      - name: Upload diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: temp-arena-root-profile-${{ github.run_id }}
          path: _work/root-profile
          retention-days: 3
          if-no-files-found: error
