name: TEMP Arena checkpoint validation

on:
  push:
    branches: [feat/local-ai-training-v2]
    paths:
      - .github/workflows/arena-checkpoint-diagnostic-temp.yml

permissions:
  contents: write

concurrency:
  group: temp-arena-checkpoint-validation-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-proven-ordering:
    name: Apply proven two-board planner ordering
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-ai-training-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch ActionPlanner with exact validated ordering
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/ai/action_planner.py')
          text = path.read_text(encoding='utf-8')

          old_key = '''    if len(required) == 2:\n        return (\n            base[0],\n            -_required_board_progress(move, required),\n            *base[1:],\n        )\n'''
          new_key = '''    if len(required) == 2:\n        return (\n            base[0],\n            -_required_board_progress(move, required),\n            move.piece.piece_type is not PieceType.KING,\n            move.captured is None,\n            *base[1:],\n        )\n'''
          assert text.count(old_key) == 1
          text = text.replace(old_key, new_key)

          marker = '''        for board in ordered_boards:\n            if tracker.check(depth):\n                return\n'''
          insertion = '''        # With exactly two required Present boards, a complete Action can be a\n        # single cross-timeline Move between them.  Rank legal Moves from both\n        # required boards together so a completion on the second board is not\n        # hidden behind a deep dead-end from the first board.  Optional boards\n        # remain fully searchable afterwards; this changes ordering only.\n        if len(required) == 2:\n            required_moves: list[Move] = []\n            optional_boards: list[BoardCoord] = []\n            for board in ordered_boards:\n                if board not in required:\n                    optional_boards.append(board)\n                    continue\n                position = state._resolve_position(board)\n                if position is None:\n                    continue\n                required_moves.extend(state.get_legal_moves(position))\n\n            for move in sorted(\n                required_moves,\n                key=lambda candidate: _required_move_sort_key(candidate, required),\n            ):\n                if tracker.check(depth):\n                    return\n                child = deepcopy(state)\n                if not child.execute_action_move(move):\n                    continue\n                self._dfs(\n                    child,\n                    path + (MoveSpec.from_move(move),),\n                    depth + 1,\n                    tracker,\n                    candidates,\n                )\n\n            ordered_boards = tuple(optional_boards)\n\n        for board in ordered_boards:\n            if tracker.check(depth):\n                return\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, insertion)
          path.write_text(text, encoding='utf-8')
          PY

          python -m compileall -q src/ai/action_planner.py
          git diff --check
          git diff -- src/ai/action_planner.py

      - name: Commit production planner optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai/action_planner.py
          git commit -m "perf(ai): prioritize two-board Action completions"
          git push origin HEAD:feat/local-ai-training-v2
