name: TEMP Arena checkpoint validation

on:
  push:
    branches: [feat/local-ai-training-v2]
    paths:
      - .github/workflows/arena-checkpoint-diagnostic-temp.yml
      - scripts/planner_target_order_probe_temp.py

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-arena-checkpoint-validation-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planner-order-probe:
    name: Deterministic failure-state ordering probe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download deterministic failure trace
        uses: actions/download-artifact@v4
        with:
          name: temp-arena-failure-trace-33813126560
          path: _work/source
          repository: ${{ github.repository }}
          run-id: "33813126560"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ordering probes
        run: |
          mkdir -p _work/order-probe
          python scripts/planner_target_order_probe_temp.py \
            --trace _work/source/trace.json \
            --output _work/order-probe/report.json

      - name: Upload ordering evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: temp-planner-order-probe-${{ github.run_id }}
          path: _work/order-probe
          retention-days: 3
          if-no-files-found: error
