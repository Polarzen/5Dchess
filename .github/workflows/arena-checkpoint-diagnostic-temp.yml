name: TEMP Arena checkpoint validation

on:
  push:
    branches: [feat/local-ai-training-v2]
    paths:
      - .github/workflows/arena-checkpoint-diagnostic-temp.yml
      - src/engine/royal_rules.py
      - tests/test_royal_rules.py

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-arena-checkpoint-validation-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-planner:
    name: Profile one-game Arena royal hot path
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"

      - name: Download run 33347901504 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-33347901504
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: "33347901504"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Profile one-game 5s Arena through action 60
        shell: bash
        run: |
          set +e
          mkdir -p _work/profile
          python -m cProfile -o _work/profile/arena-5s.pstats -m src.training.arena \
            --checkpoint _work/checkpoint/best \
            --opponent easy \
            --games 1 \
            --planner-seconds 5.0 \
            --planner-actions 24 \
            --planner-states 256 \
            --planner-moves 32 \
            --device cpu \
            --seed 42 \
            --max-actions 60 \
            --max-wall-seconds 600 \
            --output json \
            --result-json _work/profile/arena-result.json \
            > _work/profile/arena-stdout.txt 2>&1
          echo "$?" > _work/profile/arena-exit.txt
          set -e

      - name: Render profiler reports
        run: |
          python - <<'PY'
          from pathlib import Path
          import pstats

          root = Path('_work/profile')
          stats_path = root / 'arena-5s.pstats'
          with (root / 'profile-cumulative.txt').open('w', encoding='utf-8') as fh:
              pstats.Stats(str(stats_path), stream=fh).strip_dirs().sort_stats('cumulative').print_stats(120)
          with (root / 'profile-tottime.txt').open('w', encoding='utf-8') as fh:
              pstats.Stats(str(stats_path), stream=fh).strip_dirs().sort_stats('tottime').print_stats(120)
          with (root / 'profile-royal.txt').open('w', encoding='utf-8') as fh:
              pstats.Stats(str(stats_path), stream=fh).strip_dirs().sort_stats('cumulative').print_stats('royal_rules')
          with (root / 'profile-action.txt').open('w', encoding='utf-8') as fh:
              pstats.Stats(str(stats_path), stream=fh).strip_dirs().sort_stats('cumulative').print_stats('action_planner')
          PY

          echo '=== RoyalRules ==='
          cat _work/profile/profile-royal.txt
          echo '=== ActionPlanner ==='
          cat _work/profile/profile-action.txt
          echo '=== Top cumulative ==='
          head -n 90 _work/profile/profile-cumulative.txt
          echo '=== Arena result ==='
          cat _work/profile/arena-result.json || true

      - name: Upload profiling evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: temp-arena-planner-profile-${{ github.run_id }}
          path: _work/profile
          retention-days: 3
          if-no-files-found: error
