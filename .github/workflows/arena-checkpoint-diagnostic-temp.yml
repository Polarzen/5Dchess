name: TEMP Arena shallow-witness diagnostic

on:
  push:
    branches: [feat/local-ai-training-v2]
    paths:
      - .github/workflows/arena-checkpoint-diagnostic-temp.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-arena-shallow-witness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: Rank and benchmark immediate complete Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"

      - name: Download run 33347901504 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-33347901504
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: "33347901504"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reproduce and benchmark shallow completion scan
        run: |
          mkdir -p _work/arena-diagnostic
          python - <<'PY'
          from __future__ import annotations
          from copy import deepcopy
          import json
          from pathlib import Path
          import time

          from src.ai.action_planner import ActionPlanningError, ActionSearchBudget, _required_move_sort_key, _required_board_progress, apply_action_plan
          from src.ai.random_ai import RandomAI
          from src.engine import ActionRules
          from src.engine.engine import FiveDEngine
          from src.training.agent import NeuralPolicyValueAgent
          from src.training.arena import _state_signature_sha256
          from src.training.checkpoint import load_checkpoint
          from src.training.utils import resolve_device, seed_everything
          from src.utils.constants import ChessColor, GameState

          root = Path('_work/arena-diagnostic')
          seed_everything(42)
          device = resolve_device('cpu')
          model, metadata = load_checkpoint('_work/checkpoint/best', device=device)
          arena_budget = ActionSearchBudget(max_states=256, max_actions=24, max_move_depth=32, max_seconds=5.0)
          failure_engine = None
          failure = None

          for game_index in range(3):
              neural_color = ChessColor.WHITE if game_index % 2 == 0 else ChessColor.BLACK
              engine = FiveDEngine()
              neural = NeuralPolicyValueAgent(model, neural_color, device=device, budget=arena_budget)
              baseline = RandomAI(neural_color.opposite(), seed=42 + game_index + 1, budget=arena_budget)
              for action_index in range(120):
                  if engine.game_state != GameState.PLAYING:
                      break
                  actor = neural if engine.current_turn_color == neural_color else baseline
                  actor_name = 'neural' if actor is neural else 'baseline'
                  try:
                      plan = actor.plan_action(engine)
                  except ActionPlanningError as exc:
                      if game_index == 2:
                          failure_engine = deepcopy(engine)
                          failure = {
                              'game_index': game_index,
                              'action_index': action_index,
                              'actor': actor_name,
                              'player': engine.current_turn_color.value,
                              'ply': engine.move_counter,
                              'timeline_count': len(engine.timeline_manager.timelines),
                              'state_signature_sha256': _state_signature_sha256(engine),
                              'reason': exc.reason,
                              'incomplete': exc.incomplete,
                              'explored_states': exc.explored_states,
                          }
                      break
                  apply_action_plan(engine, plan)
              if failure_engine is not None:
                  break

          report = {'checkpoint_epoch': metadata.get('epoch'), 'failure': failure}
          if failure_engine is None:
              report['error'] = 'expected failure not reproduced'
          else:
              state = deepcopy(failure_engine)
              state.timeline_manager.refresh_activity()
              action = state._ensure_current_action()
              required = set(ActionRules.required_boards(action, state.timeline_manager.timelines))
              movable = ActionRules.movable_boards(action, state.timeline_manager.timelines)
              ordered_boards = tuple(sorted(movable, key=lambda b: (b not in required, b.timeline, b.turn, b.side.value)))
              report['required_boards'] = [[b.timeline, b.turn, b.side.value] for b in sorted(required, key=lambda b:(b.timeline,b.turn,b.side.value))]
              report['movable_board_count'] = len(movable)

              flat = []
              shallow_started = time.perf_counter()
              first_complete = None
              tested = 0
              for board in ordered_boards:
                  position = state._resolve_position(board)
                  if position is None:
                      continue
                  moves = sorted(state.get_legal_moves(position), key=lambda m: _required_move_sort_key(m, required))
                  for local_rank, move in enumerate(moves):
                      tested += 1
                      item = {
                          'global_rank': tested,
                          'local_rank': local_rank + 1,
                          'source': [move.source.board.timeline, move.source.board.turn, move.source.board.side.value, move.source.x, move.source.y],
                          'destination': [move.destination.board.timeline, move.destination.board.turn, move.destination.board.side.value, move.destination.x, move.destination.y],
                          'piece': move.piece.piece_type.value,
                          'captured': move.captured.piece_type.value if move.captured else None,
                          'branching': bool(move.is_branching),
                          'cross_timeline': bool(move.is_cross_timeline),
                          'required_progress': _required_board_progress(move, required),
                      }
                      if len(flat) < 40:
                          flat.append(item)
                      child = deepcopy(state)
                      if not child.execute_action_move(move):
                          continue
                      child_required = set(ActionRules.required_boards(child._ensure_current_action(), child.timeline_manager.timelines))
                      if not child_required and child.can_submit_action():
                          first_complete = item | {
                              'child_required_count': 0,
                              'wall_ms': (time.perf_counter() - shallow_started) * 1000.0,
                              'tested_moves': tested,
                          }
                          break
                  if first_complete is not None:
                      break

              report['first_40_current_order'] = flat
              report['shallow_scan'] = {
                  'tested_moves': tested,
                  'wall_ms': (time.perf_counter() - shallow_started) * 1000.0,
                  'first_complete': first_complete,
              }

          (root / 'shallow-witness.json').write_text(json.dumps(report, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: temp-arena-shallow-witness-${{ github.run_id }}
          path: _work/arena-diagnostic
          retention-days: 3
          if-no-files-found: error
