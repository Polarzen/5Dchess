name: TEMP Arena checkpoint validation

on:
  push:
    branches: [feat/local-ai-training-v2]
    paths:
      - .github/workflows/arena-checkpoint-diagnostic-temp.yml
      - scripts/arena_witness_seed_probe_temp.py

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-arena-checkpoint-validation-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arena-validation:
    name: Capture deterministic Arena failure trace
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"

      - name: Download run 33347901504 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-33347901504
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: "33347901504"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture first five-second witness-first failure
        shell: bash
        run: |
          set -u
          mkdir -p _work/arena-trace
          set +e
          python scripts/arena_witness_seed_probe_temp.py \
            --checkpoint _work/checkpoint/best \
            --opponent easy \
            --games 2 \
            --planner-seconds 5.0 \
            --planner-actions 24 \
            --planner-states 256 \
            --planner-moves 32 \
            --device cpu \
            --seed 42 \
            --max-actions 120 \
            --max-wall-seconds 1800 \
            --output json \
            --result-json _work/arena-trace/arena.json
          status=$?
          set -e
          echo "$status" > _work/arena-trace/arena.exit

      - name: Replay captured trace canonically and profile target
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import time
          from pathlib import Path

          from src.ai.action_planner import ActionPlanner, ActionSearchBudget
          from src.engine import ActionRules, BoardCoord, FiveDEngine, Square5D
          from src.engine.action_search import ActionSearch
          from src.training.arena import _state_signature_sha256
          from src.utils.constants import ChessColor, PieceType

          root = Path('_work/arena-trace')
          data = json.loads((root / 'arena.json').read_text(encoding='utf-8'))
          failure = data.get('first_failure')
          assert failure is not None, 'target run unexpectedly had no planning failure'
          trace = failure.get('canonical_action_trace')
          assert isinstance(trace, list) and trace, 'failure record did not contain canonical Action trace'
          assert len(trace) == failure.get('canonical_action_trace_length')

          def square(raw):
              timeline, turn, side, x, y = raw
              return Square5D(BoardCoord(timeline, turn, ChessColor(side)), x, y)

          engine = FiveDEngine()
          for action_index, action_specs in enumerate(trace):
              for spec in action_specs:
                  source = square(spec['source'])
                  destination = square(spec['destination'])
                  promotion = PieceType(spec['promotion']) if spec.get('promotion') else None
                  position = engine._resolve_position(source.board)
                  assert position is not None, (action_index, spec)
                  matches = [
                      move for move in engine.get_legal_moves(position)
                      if move.source == source
                      and move.destination == destination
                      and move.promotion == promotion
                  ]
                  assert len(matches) == 1, (action_index, spec, len(matches))
                  assert engine.execute_action_move(matches[0]), (action_index, spec)
              assert engine.can_submit_action(), action_index
              assert engine.submit_action(), action_index

          replay_sha = _state_signature_sha256(engine)
          expected_sha = failure['state_signature_sha256']
          assert replay_sha == expected_sha, (replay_sha, expected_sha)

          action = engine._ensure_current_action()
          required = ActionRules.required_boards(action, engine.timeline_manager.timelines)
          movable = ActionRules.movable_boards(action, engine.timeline_manager.timelines)
          verification = {
              'replay_sha': replay_sha,
              'expected_sha': expected_sha,
              'trace_actions': len(trace),
              'move_counter': engine.move_counter,
              'player': engine.current_turn_color.value,
              'timeline_count': len(engine.timeline_manager.timelines),
              'required_board_count': len(required),
              'movable_board_count': len(movable),
              'failure_action_index': failure.get('action_index'),
              'failure_game_index': failure.get('game_index'),
          }
          (root / 'trace.json').write_text(json.dumps(trace, indent=2, sort_keys=True), encoding='utf-8')
          (root / 'replay-verification.json').write_text(json.dumps(verification, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps(verification, indent=2, sort_keys=True))

          profile = {'verification': verification, 'searches': []}
          for seconds in (5.0, 30.0):
              started = time.perf_counter()
              result = ActionSearch(
                  max_states=16384,
                  max_depth=64,
                  max_seconds=seconds,
              ).find_legal_completion(engine)
              elapsed_ms = (time.perf_counter() - started) * 1000.0
              profile['searches'].append({
                  'implementation': 'ActionSearch',
                  'budget_seconds': seconds,
                  'wall_ms': elapsed_ms,
                  'has_legal_action': result.has_legal_action,
                  'explored_states': result.explored_states,
                  'termination_reason': result.termination_reason,
                  'witness_length': len(result.witness),
                  'witness': [
                      {
                          'source': [m.source.board.timeline, m.source.board.turn, m.source.board.side.value, m.source.x, m.source.y],
                          'destination': [m.destination.board.timeline, m.destination.board.turn, m.destination.board.side.value, m.destination.x, m.destination.y],
                          'promotion': m.promotion.value if m.promotion else None,
                      }
                      for m in result.witness
                  ],
              })
              if result.has_legal_action:
                  break

          started = time.perf_counter()
          planner = ActionPlanner(ActionSearchBudget(
              max_states=256,
              max_actions=24,
              max_move_depth=32,
              max_seconds=5.0,
          )).search(engine)
          profile['searches'].append({
              'implementation': 'ActionPlanner',
              'budget_seconds': 5.0,
              'wall_ms': (time.perf_counter() - started) * 1000.0,
              'candidate_count': len(planner.candidates),
              'explored_states': planner.explored_states,
              'termination_reason': planner.termination_reason,
              'first_candidate_length': len(planner.candidates[0]) if planner.candidates else 0,
          })
          (root / 'target-profile.json').write_text(json.dumps(profile, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps(profile, indent=2, sort_keys=True))
          PY

      - name: Upload diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: temp-arena-failure-trace-${{ github.run_id }}
          path: _work/arena-trace
          retention-days: 3
          if-no-files-found: error
