name: TEMP Arena minimal-depth witness diagnostic

on:
  push:
    branches: [feat/local-ai-training-v2]
    paths:
      - .github/workflows/arena-checkpoint-diagnostic-temp.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-arena-min-depth-witness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  witness-diagnostic:
    name: Compare depth-first and minimal-depth witness search
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"

      - name: Download run 33347901504 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-33347901504
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: "33347901504"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reproduce failure and run minimal-depth search
        run: |
          mkdir -p _work/min-depth-witness
          python - <<'PY'
          from __future__ import annotations

          from copy import deepcopy
          import hashlib
          import json
          import math
          from pathlib import Path
          import time

          from src.ai.action_planner import (
              ActionPlanner,
              ActionPlanningError,
              ActionSearchBudget,
              MoveSpec,
              _required_move_sort_key,
              engine_state_signature,
              resolve_move_spec,
          )
          from src.ai.random_ai import RandomAI
          from src.engine import ActionRules
          from src.engine.engine import FiveDEngine
          from src.training.agent import NeuralPolicyValueAgent
          from src.training.checkpoint import load_checkpoint
          from src.training.utils import resolve_device, seed_everything
          from src.utils.constants import ChessColor, GameState

          root = Path('_work/min-depth-witness')
          seed_everything(42)
          device = resolve_device('cpu')
          model, metadata = load_checkpoint('_work/checkpoint/best', device=device)
          arena_budget = ActionSearchBudget(max_states=256, max_actions=24, max_move_depth=32, max_seconds=5.0)

          failure_engine = None
          failure = None
          for game_index in range(5):
              neural_color = ChessColor.WHITE if game_index % 2 == 0 else ChessColor.BLACK
              engine = FiveDEngine()
              neural = NeuralPolicyValueAgent(model, neural_color, device=device, budget=arena_budget)
              baseline = RandomAI(neural_color.opposite(), seed=42 + game_index + 1, budget=arena_budget)
              for action_index in range(120):
                  if engine.game_state != GameState.PLAYING:
                      break
                  actor = neural if engine.current_turn_color == neural_color else baseline
                  actor_name = 'neural' if actor is neural else 'baseline'
                  try:
                      plan = actor.plan_action(engine)
                  except ActionPlanningError as exc:
                      failure_engine = deepcopy(engine)
                      action = engine._ensure_current_action()
                      required = ActionRules.required_boards(action, engine.timeline_manager.timelines)
                      movable = ActionRules.movable_boards(action, engine.timeline_manager.timelines)
                      failure = {
                          'game_index': game_index,
                          'action_index': action_index,
                          'actor': actor_name,
                          'player': engine.current_turn_color.value,
                          'ply': engine.move_counter,
                          'timeline_count': len(engine.timeline_manager.timelines),
                          'required_board_count': len(required),
                          'movable_board_count': len(movable),
                          'reason': exc.reason,
                          'explored_states': exc.explored_states,
                          'state_signature_sha256': hashlib.sha256(repr(engine_state_signature(engine)).encode('utf-8')).hexdigest(),
                      }
                      break
                  from src.ai.action_planner import apply_action_plan
                  apply_action_plan(engine, plan)
              if failure_engine is not None:
                  break

          report = {'checkpoint_epoch': metadata.get('epoch'), 'failure': failure, 'comparisons': []}
          if failure_engine is None:
              report['error'] = 'no planning failure reproduced'
          else:
              started = time.monotonic()
              search_state = {'explored': 0, 'termination': None}
              depth_attempts = []
              required_at_root = set(ActionRules.required_boards(
                  failure_engine._ensure_current_action(), failure_engine.timeline_manager.timelines
              ))
              lower_bound = max(0, math.ceil(len(required_at_root) / 2))

              def budget_hit():
                  if search_state['termination'] is not None:
                      return True
                  if time.monotonic() - started >= 5.0:
                      search_state['termination'] = 'time_budget'
                      return True
                  if search_state['explored'] >= 256:
                      search_state['termination'] = 'state_budget'
                      return True
                  return False

              def search_depth(state, path, depth, limit):
                  action = state._ensure_current_action()
                  required = set(ActionRules.required_boards(action, state.timeline_manager.timelines))
                  if not required and state.can_submit_action():
                      return path
                  if depth >= limit or budget_hit():
                      return None
                  search_state['explored'] += 1
                  movable = ActionRules.movable_boards(action, state.timeline_manager.timelines)
                  ordered_boards = tuple(sorted(
                      movable,
                      key=lambda board: (
                          board not in required,
                          board.timeline,
                          board.turn,
                          board.side.value,
                      ),
                  ))
                  for board in ordered_boards:
                      if budget_hit():
                          return None
                      position = state._resolve_position(board)
                      if position is None:
                          continue
                      moves = sorted(
                          state.get_legal_moves(position),
                          key=lambda move: _required_move_sort_key(move, required),
                      )
                      for move in moves:
                          if budget_hit():
                              return None
                          child = deepcopy(state)
                          if not child.execute_action_move(move):
                              continue
                          witness = search_depth(
                              child,
                              path + (MoveSpec.from_move(move),),
                              depth + 1,
                              limit,
                          )
                          if witness is not None:
                              return witness
                  return None

              witness = None
              for limit in range(lower_bound, 9):
                  before_states = search_state['explored']
                  before_time = time.monotonic()
                  witness = search_depth(failure_engine, (), 0, limit)
                  depth_attempts.append({
                      'depth_limit': limit,
                      'states': search_state['explored'] - before_states,
                      'wall_ms': (time.monotonic() - before_time) * 1000.0,
                      'found': witness is not None,
                  })
                  if witness is not None or search_state['termination'] is not None:
                      break

              verify = None
              if witness is not None:
                  probe = deepcopy(failure_engine)
                  for spec in witness:
                      move = resolve_move_spec(probe, spec)
                      assert probe.execute_action_move(move)
                  verify = {'submit_capable': bool(probe.can_submit_action()), 'moves': len(witness)}

              report['comparisons'].append({
                  'search': 'minimal_depth_iddfs',
                  'found': witness is not None,
                  'witness_moves': len(witness) if witness is not None else 0,
                  'explored_states': search_state['explored'],
                  'termination_reason': search_state['termination'],
                  'wall_ms': (time.monotonic() - started) * 1000.0,
                  'depth_attempts': depth_attempts,
                  'verification': verify,
              })

              started_current = time.perf_counter()
              current = ActionPlanner(ActionSearchBudget(
                  max_states=256, max_actions=1, max_move_depth=32, max_seconds=5.0
              )).search(failure_engine)
              report['comparisons'].append({
                  'search': 'current_dfs',
                  'candidate_count': len(current.candidates),
                  'explored_states': current.explored_states,
                  'termination_reason': current.termination_reason,
                  'wall_ms': (time.perf_counter() - started_current) * 1000.0,
              })

          (root / 'min-depth-witness.json').write_text(json.dumps(report, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps(report, indent=2, sort_keys=True))
          if failure_engine is None:
              raise SystemExit(2)
          PY

      - name: Upload diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: temp-arena-min-depth-witness-${{ github.run_id }}
          path: _work/min-depth-witness
          retention-days: 3
          if-no-files-found: error
