name: TEMP Arena single-progress ordering diagnostic

on:
  push:
    branches: [feat/local-ai-training-v2]
    paths:
      - .github/workflows/arena-checkpoint-diagnostic-temp.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-arena-single-progress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ordering-diagnostic:
    name: Compare planner ordering on reproduced Arena failure
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"

      - name: Download run 33347901504 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-33347901504
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: "33347901504"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reproduce failure and compare ordering
        run: |
          mkdir -p _work/single-progress
          python - <<'PY'
          from __future__ import annotations

          from copy import deepcopy
          import hashlib
          import json
          from pathlib import Path
          import time

          import src.ai.action_planner as planner_mod
          from src.ai.action_planner import (
              ActionPlanner,
              ActionPlanningError,
              ActionSearchBudget,
              _move_sort_key,
              _required_board_progress,
              apply_action_plan,
              engine_state_signature,
          )
          from src.ai.random_ai import RandomAI
          from src.engine import ActionRules
          from src.engine.engine import FiveDEngine
          from src.training.agent import NeuralPolicyValueAgent
          from src.training.checkpoint import load_checkpoint
          from src.training.utils import resolve_device, seed_everything
          from src.utils.constants import ChessColor, GameState

          root = Path('_work/single-progress')
          seed_everything(42)
          device = resolve_device('cpu')
          model, metadata = load_checkpoint('_work/checkpoint/best', device=device)
          arena_budget = ActionSearchBudget(max_states=256, max_actions=24, max_move_depth=32, max_seconds=5.0)

          failure_engine = None
          failure = None
          for game_index in range(5):
              neural_color = ChessColor.WHITE if game_index % 2 == 0 else ChessColor.BLACK
              engine = FiveDEngine()
              neural = NeuralPolicyValueAgent(model, neural_color, device=device, budget=arena_budget)
              baseline = RandomAI(neural_color.opposite(), seed=42 + game_index + 1, budget=arena_budget)
              for action_index in range(120):
                  if engine.game_state != GameState.PLAYING:
                      break
                  actor = neural if engine.current_turn_color == neural_color else baseline
                  actor_name = 'neural' if actor is neural else 'baseline'
                  try:
                      plan = actor.plan_action(engine)
                  except ActionPlanningError as exc:
                      failure_engine = deepcopy(engine)
                      action = engine._ensure_current_action()
                      required = ActionRules.required_boards(action, engine.timeline_manager.timelines)
                      failure = {
                          'game_index': game_index,
                          'action_index': action_index,
                          'actor': actor_name,
                          'player': engine.current_turn_color.value,
                          'ply': engine.move_counter,
                          'timeline_count': len(engine.timeline_manager.timelines),
                          'required_board_count': len(required),
                          'reason': exc.reason,
                          'explored_states': exc.explored_states,
                          'state_signature_sha256': hashlib.sha256(repr(engine_state_signature(engine)).encode('utf-8')).hexdigest(),
                      }
                      break
                  apply_action_plan(engine, plan)
              if failure_engine is not None:
                  break

          report = {'checkpoint_epoch': metadata.get('epoch'), 'failure': failure, 'benchmarks': []}
          if failure_engine is None:
              report['error'] = 'no planning failure reproduced'
          else:
              original_key = planner_mod._required_move_sort_key

              def single_progress_first(move, required):
                  if len(required) != 2:
                      return original_key(move, required)
                  base = _move_sort_key(move)
                  progress = _required_board_progress(move, required)
                  # Preserve canonical non-branching-first ordering, but when exactly
                  # two boards are required prefer advancing one board before trying
                  # double-progress cross-timeline completions. This changes ordering
                  # only; no Move or complete Action is pruned.
                  progress_bucket = 0 if progress == 1 else 1 if progress >= 2 else 2
                  return (base[0], progress_bucket, *base[1:])

              def run_case(name, key, seconds):
                  planner_mod._required_move_sort_key = key
                  started = time.perf_counter()
                  try:
                      result = ActionPlanner(ActionSearchBudget(
                          max_states=256,
                          max_actions=1,
                          max_move_depth=32,
                          max_seconds=seconds,
                      )).search(failure_engine)
                  finally:
                      planner_mod._required_move_sort_key = original_key
                  wall_ms = (time.perf_counter() - started) * 1000.0
                  candidate = result.candidates[0] if result.candidates else None
                  verification = None
                  if candidate is not None:
                      probe = deepcopy(failure_engine)
                      from src.ai.action_planner import resolve_move_spec
                      for spec in candidate:
                          move = resolve_move_spec(probe, spec)
                          assert probe.execute_action_move(move)
                      verification = {
                          'moves': len(candidate),
                          'submit_capable': bool(probe.can_submit_action()),
                          'move_specs': [
                              {
                                  'source': [spec.source.board.timeline, spec.source.board.turn, spec.source.board.side.value, spec.source.x, spec.source.y],
                                  'destination': [spec.destination.board.timeline, spec.destination.board.turn, spec.destination.board.side.value, spec.destination.x, spec.destination.y],
                                  'promotion': spec.promotion.value if spec.promotion else None,
                              }
                              for spec in candidate
                          ],
                      }
                  report['benchmarks'].append({
                      'name': name,
                      'budget_seconds': seconds,
                      'candidate_count': len(result.candidates),
                      'explored_states': result.explored_states,
                      'termination_reason': result.termination_reason,
                      'wall_ms': wall_ms,
                      'verification': verification,
                  })

              run_case('current', original_key, 5.0)
              for seconds in (0.5, 1.0, 2.0, 5.0):
                  run_case('single_progress_first', single_progress_first, seconds)

          (root / 'single-progress-ordering.json').write_text(json.dumps(report, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps(report, indent=2, sort_keys=True))
          if failure_engine is None:
              raise SystemExit(2)
          PY

      - name: Upload diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: temp-arena-single-progress-${{ github.run_id }}
          path: _work/single-progress
          retention-days: 3
          if-no-files-found: error
