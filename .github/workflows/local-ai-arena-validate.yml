name: Local AI Arena Validation

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Local AI training run containing the checkpoint Artifact
        required: true
        type: string
      source_artifact:
        description: Optional checkpoint Artifact name; blank auto-detects standard or Stage 1 checkpoint
        required: false
        type: string
        default: ""
      source_preset:
        description: PolicyValueModel preset used by the source checkpoint
        required: true
        type: choice
        options: [tiny, small, medium]
        default: small
      arena_opponent:
        description: Canonical Arena opponent
        required: true
        type: choice
        options: [easy, medium, hard]
        default: easy
      arena_games:
        description: Arena games, alternating neural White/Black (1..500)
        required: true
        type: number
        default: 5
      arena_planner_seconds:
        description: Per-action Arena planning wall-time budget in seconds (0.1..60)
        required: true
        type: number
        default: 0.5
      seed:
        description: Signed integer random seed
        required: true
        type: string
        default: "42"
      max_actions:
        description: Maximum complete Actions per Arena game (1..1000)
        required: true
        type: number
        default: 120
      arena_wall_seconds:
        description: Whole Arena wall-time budget in seconds (1..10800)
        required: true
        type: number
        default: 9000

permissions:
  contents: read
  actions: read

concurrency:
  group: local-ai-arena-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  arena:
    name: Arena-only checkpoint validation
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt

      - name: Install game and CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"

      - name: Validate inputs
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          ARENA_GAMES: ${{ inputs.arena_games }}
          ARENA_PLANNER_SECONDS: ${{ inputs.arena_planner_seconds }}
          SEED: ${{ inputs.seed }}
          MAX_ACTIONS: ${{ inputs.max_actions }}
          ARENA_WALL_SECONDS: ${{ inputs.arena_wall_seconds }}
        run: |
          python - <<'PY'
          import math
          import os

          run_id = os.environ["SOURCE_RUN_ID"].strip()
          if not run_id.isdigit() or int(run_id) <= 0:
              raise SystemExit("source_run_id must be a positive GitHub Actions run ID")

          def bounded_int(name, lower, upper):
              raw = os.environ[name].strip()
              value = int(raw)
              if not lower <= value <= upper:
                  raise SystemExit(f"{name.lower()} must be in {lower}..{upper}")
              return value

          bounded_int("ARENA_GAMES", 1, 500)
          bounded_int("MAX_ACTIONS", 1, 1000)
          bounded_int("ARENA_WALL_SECONDS", 1, 10800)
          int(os.environ["SEED"].strip())

          seconds = float(os.environ["ARENA_PLANNER_SECONDS"].strip())
          if not math.isfinite(seconds) or not 0.1 <= seconds <= 60.0:
              raise SystemExit("arena_planner_seconds must be finite and in 0.1..60")
          PY

      - name: Resolve trusted checkpoint Artifact
        id: resolve_checkpoint
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ARTIFACT: ${{ inputs.source_artifact }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          run_id = os.environ["SOURCE_RUN_ID"].strip()
          explicit = os.environ["SOURCE_ARTIFACT"].strip()
          repository = os.environ["GH_REPOSITORY"].strip()
          token = os.environ["GH_TOKEN"].strip()

          url = f"https://api.github.com/repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "5dchess-local-ai-arena-validation",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"failed to list artifacts for source run {run_id}: HTTP {exc.code}") from exc

          available = {
              item.get("name")
              for item in payload.get("artifacts", [])
              if item.get("name") and not item.get("expired", False)
          }

          if explicit:
              if explicit not in available:
                  raise SystemExit(
                      f"requested source_artifact {explicit!r} is missing or expired in source run {run_id}"
                  )
              selected = explicit
          else:
              candidates = (
                  f"local-ai-checkpoint-{run_id}",
                  f"local-ai-checkpoint-stage1-500-{run_id}",
              )
              selected = next((name for name in candidates if name in available), None)
              if selected is None:
                  expected = ", ".join(candidates)
                  found = ", ".join(sorted(available)) or "<none>"
                  raise SystemExit(
                      f"no supported checkpoint Artifact found in source run {run_id}; "
                      f"expected one of [{expected}], found [{found}]"
                  )

          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"artifact_name={selected}\n")
          print(f"resolved checkpoint Artifact: {selected}")
          PY

      - name: Download trusted checkpoint from source run
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.resolve_checkpoint.outputs.artifact_name }}
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate checkpoint shape
        env:
          INPUT_PRESET: ${{ inputs.source_preset }}
        run: |
          python -m src.training.cloud check-resume --checkpoint _work/checkpoint/best --preset "$INPUT_PRESET"

      - name: Run Arena only
        env:
          INPUT_ARENA_OPPONENT: ${{ inputs.arena_opponent }}
          INPUT_ARENA_GAMES: ${{ inputs.arena_games }}
          INPUT_ARENA_PLANNER_SECONDS: ${{ inputs.arena_planner_seconds }}
          INPUT_SEED: ${{ inputs.seed }}
          INPUT_MAX_ACTIONS: ${{ inputs.max_actions }}
          INPUT_ARENA_WALL_SECONDS: ${{ inputs.arena_wall_seconds }}
        run: |
          mkdir -p _work/arena-report
          python -m src.training.arena \
            --checkpoint _work/checkpoint/best \
            --opponent "$INPUT_ARENA_OPPONENT" \
            --games "$INPUT_ARENA_GAMES" \
            --planner-seconds "$INPUT_ARENA_PLANNER_SECONDS" \
            --device cpu \
            --seed "$INPUT_SEED" \
            --max-actions "$INPUT_MAX_ACTIONS" \
            --max-wall-seconds "$INPUT_ARENA_WALL_SECONDS" \
            --output json \
            --result-json _work/arena-report/arena-result.json

      - name: Publish Arena summary
        if: ${{ always() }}
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ARTIFACT: ${{ steps.resolve_checkpoint.outputs.artifact_name }}
        run: |
          if [[ -f _work/arena-report/arena-result.json ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          path = Path("_work/arena-report/arena-result.json")
          result = json.loads(path.read_text(encoding="utf-8"))
          print("# Local AI Arena Validation")
          print()
          print(f"- Source run: `{os.environ['SOURCE_RUN_ID']}`")
          print(f"- Source Artifact: `{os.environ.get('SOURCE_ARTIFACT', '')}`")
          print(f"- Opponent: `{result.get('opponent')}`")
          print(f"- Games played: `{result.get('games_played', result.get('games'))}`")
          print(f"- W/D/L: `{result.get('wins')}/{result.get('draws')}/{result.get('losses')}`")
          print(f"- Illegal: `{result.get('illegal')}`")
          print(f"- Stale failures: `{result.get('stale_failures')}`")
          print(f"- Planning failures: `{result.get('planning_failures')}`")
          print(f"- Budget terminations: `{result.get('budget_terminations')}`")
          PY
          else
            echo "# Local AI Arena Validation" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "Arena result JSON was not produced; inspect the Arena step logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Arena validation Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-arena-validation-${{ github.run_id }}
          path: _work/arena-report
          retention-days: 30
          if-no-files-found: warn
