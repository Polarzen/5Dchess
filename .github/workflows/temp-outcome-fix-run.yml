name: TEMP Outcome optimization retry

on:
  push:
    branches: [feat/local-ai-training-v2]
    paths:
      - .github/workflows/temp-outcome-fix-run.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-ai-training-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install game dependencies
        run: python -m pip install -r requirements.txt
      - name: Reuse validated patch generator and fix test quoting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/temp-apply-outcome-optimization.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply_outcome_patch.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply_outcome_patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_action_plan_outcome_efficiency.py')
          text = path.read_text(encoding='utf-8').replace('\\"', '"')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Compile and run focused regressions
        run: |
          python -m compileall -q src tests
          python -m pytest -q \
            tests/test_action_plan_outcome_efficiency.py \
            tests/test_action_plan_submission_efficiency.py \
            tests/test_checkmate_stalemate.py \
            tests/test_ai_action_planning.py
      - name: Commit only validated source and tests
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/engine/engine.py src/ai/action_planner.py tests/test_action_plan_outcome_efficiency.py
          git diff --cached --check
          git commit -m 'perf(ai): evaluate applied Action outcome once'
          git push origin HEAD:feat/local-ai-training-v2
