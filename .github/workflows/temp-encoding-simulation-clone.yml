name: TEMP Encoding simulation clone validation

on:
  push:
    branches: [feat/local-ai-training-v2]
    paths:
      - .github/workflows/temp-encoding-simulation-clone.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-ai-training-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply simulation clone and encoding optimization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          engine_path = Path('src/engine/engine.py')
          text = engine_path.read_text(encoding='utf-8')
          text = text.replace(
              'from src.engine.timeline import TimelineManager\n',
              'from src.engine.timeline import Timeline, TimelineManager\n',
          )
          marker = '''    def _board_view(self) -> MultiverseBoardView:\n        """Return the canonical lookup layer over the current multiverse."""\n        return MultiverseBoardView(self.timeline_manager.timelines)\n\n'''
          insert = '''    @staticmethod\n    def _clone_action_for_simulation(action: Action | None) -> Action | None:\n        """Copy mutable Action bookkeeping while sharing frozen move metadata."""\n        if action is None:\n            return None\n        return Action(\n            color=action.color,\n            starting_present=action.starting_present,\n            moves=list(action.moves),\n            submitted=action.submitted,\n        )\n\n    @staticmethod\n    def _clone_timeline_mapping_for_simulation(timelines) -> dict[int, Timeline]:\n        """Deep-copy timeline storage through Position's explicit copy contract."""\n        return {\n            timeline_id: Timeline(\n                timeline_id=timeline.timeline_id,\n                parent_id=timeline.parent_id,\n                branch_move_id=timeline.branch_move_id,\n                branch_turn=timeline.branch_turn,\n                positions={\n                    time_point: position.copy()\n                    for time_point, position in timeline.positions.items()\n                },\n                is_active=timeline.is_active,\n                created_at_turn=timeline.created_at_turn,\n                owner=timeline.owner,\n            )\n            for timeline_id, timeline in timelines.items()\n        }\n\n    def clone_for_simulation(self) -> "FiveDEngine":\n        """Return an isolated engine suitable for canonical Action simulation.\n\n        The clone may run move generation/validation, ``execute_action_move`` and\n        Action submission without mutating the source. Every mutable canonical\n        engine container is copied: timeline/history Positions, branch allocation\n        counters, move/action history lists, and current Action bookkeeping. Frozen\n        ``Move``/``Piece``/``PresentState`` values are intentionally shared.\n\n        ``RulesEngine`` is legacy board-local state and normally contains no bound\n        timelines. The canonical default is rebuilt cheaply; non-standard populated\n        instances fall back to deepcopy rather than sharing mutable rule state.\n        Unknown dynamic engine attributes fail closed instead of being silently\n        aliased or dropped. ``rule_warning`` is the one supported transient field.\n        """\n        expected = set(self.__dataclass_fields__) | {"rule_warning"}\n        unexpected = set(self.__dict__) - expected\n        if unexpected:\n            names = ", ".join(sorted(unexpected))\n            raise RuntimeError(\n                f"cannot safely simulation-clone unknown engine state: {names}"\n            )\n\n        clone = object.__new__(type(self))\n        clone.max_timelines = self.max_timelines\n        clone.max_turns = self.max_turns\n\n        source_manager = self.timeline_manager\n        manager = TimelineManager(max_timelines=source_manager.max_timelines)\n        manager.timelines = self._clone_timeline_mapping_for_simulation(\n            source_manager.timelines\n        )\n        manager.active_timeline_id = source_manager.active_timeline_id\n        manager._next_positive_id = source_manager._next_positive_id\n        manager._next_negative_id = source_manager._next_negative_id\n        clone.timeline_manager = manager\n\n        if (\n            not self.rules_engine.timelines\n            and not self.rules_engine.validator.timelines\n        ):\n            clone.rules_engine = RulesEngine()\n        else:\n            # Preserve non-standard legacy rule bindings conservatively. This is\n            # not the normal canonical engine path and deliberately favors exact\n            # isolation over speed.\n            from copy import deepcopy\n            clone.rules_engine = deepcopy(self.rules_engine)\n\n        clone.game_state = self.game_state\n        clone.move_history = list(self.move_history)\n        clone.move_counter = self.move_counter\n        clone.current_turn_color = self.current_turn_color\n        clone.action_history = [\n            self._clone_action_for_simulation(action)\n            for action in self.action_history\n        ]\n        clone.current_action = self._clone_action_for_simulation(self.current_action)\n        if hasattr(self, "rule_warning"):\n            clone.rule_warning = self.rule_warning\n        return clone\n\n'''
          if marker not in text:
              raise SystemExit('engine insertion marker not found')
          text = text.replace(marker, insert + marker, 1)
          engine_path.write_text(text, encoding='utf-8')

          encoding_path = Path('src/training/encoding.py')
          text = encoding_path.read_text(encoding='utf-8')
          text = text.replace('from copy import deepcopy\n', '')
          old = '    clone = deepcopy(engine)\n'
          new = '    clone = engine.clone_for_simulation()\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one encoding deepcopy, found {text.count(old)}')
          text = text.replace(old, new, 1)
          encoding_path.write_text(text, encoding='utf-8')
          PY

          cat > tests/test_engine_simulation_clone.py <<'PY'
          from copy import deepcopy

          from src.ai.action_planner import MoveSpec, engine_state_signature, resolve_move_spec
          from src.engine.action import ActionRules
          from src.engine.board import Position
          from src.engine.engine import FiveDEngine
          from src.engine.piece import Piece
          from src.engine.timeline import Timeline
          from src.utils.constants import ChessColor, GameState, PieceType


          def _position(timeline_id, time_point, side, *pieces, en_passant_target=None):
              board = [["" for _ in range(8)] for _ in range(8)]
              board[7][7] = "K"
              board[0][7] = "k"
              for x, y, char in pieces:
                  board[y][x] = char
              return Position(
                  board=board,
                  turn=side,
                  timeline_id=timeline_id,
                  time_point=time_point,
                  en_passant_target=en_passant_target,
                  unmoved_pawns=set(),
              )


          def _single_timeline_engine(*positions):
              engine = FiveDEngine()
              manager = engine.timeline_manager
              timeline = Timeline(timeline_id=0)
              for position in positions:
                  timeline.add_position(position)
              manager.timelines = {0: timeline}
              manager.active_timeline_id = 0
              manager._next_positive_id = 1
              manager._next_negative_id = -1
              manager.refresh_activity()
              engine.game_state = GameState.PLAYING
              engine.move_history = []
              engine.action_history = []
              engine.move_counter = max((p.move_number for p in positions), default=0)
              engine.current_turn_color = positions[-1].turn
              engine.current_action = ActionRules.begin(
                  engine.current_turn_color, manager.timelines
              )
              return engine


          def _advanced_engine():
              engine = FiveDEngine()
              move = next(
                  move for move in engine.get_legal_moves()
                  if move.source.x == 4 and move.source.y == 6
                  and move.destination.x == 4 and move.destination.y == 4
              )
              assert engine.execute_action_move(move)
              assert engine.submit_action(evaluate_outcome=False)
              engine.rule_warning = "clone-me"
              return engine


          def test_simulation_clone_matches_deepcopy_rule_state():
              engine = _advanced_engine()
              legacy = deepcopy(engine)
              clone = engine.clone_for_simulation()

              assert engine_state_signature(clone) == engine_state_signature(legacy)
              assert clone.rule_warning == legacy.rule_warning == "clone-me"
              assert clone.timeline_manager is not engine.timeline_manager
              assert clone.current_action is not engine.current_action
              assert clone.action_history is not engine.action_history
              assert clone.action_history[0] is not engine.action_history[0]
              assert clone.move_history is not engine.move_history
              assert clone.rules_engine is not engine.rules_engine


          def test_simulation_clone_mutations_do_not_alias_source():
              engine = _advanced_engine()
              before = engine_state_signature(engine)
              clone = engine.clone_for_simulation()
              latest = clone.get_current_position()

              latest.board[0][0] = ""
              latest.castling_rights["black_kingside"] = False
              latest.en_passant_target = (0, 0)
              latest.unmoved_pawns.add((0, 0))
              clone.current_action.moves.append(clone.move_history[-1])
              clone.action_history[0].moves.clear()
              clone.move_history.clear()
              clone.timeline_manager._next_positive_id += 7
              clone.timeline_manager._next_negative_id -= 7
              clone.timeline_manager.timelines[0].positions.pop(0)
              clone.rules_engine.timelines[99] = Timeline(timeline_id=99)

              assert engine_state_signature(engine) == before
              assert 0 in engine.timeline_manager.timelines[0].positions
              assert 99 not in engine.rules_engine.timelines

              reverse = engine.clone_for_simulation()
              reverse_before = engine_state_signature(reverse)
              engine.timeline_manager._next_positive_id += 3
              engine.current_action.moves.append(engine.move_history[-1])
              assert engine_state_signature(reverse) == reverse_before


          def test_simulation_clone_execute_and_submit_match_deepcopy():
              engine = FiveDEngine()
              move = next(
                  move for move in engine.get_legal_moves()
                  if move.source.x == 4 and move.source.y == 6
              )
              spec = MoveSpec.from_move(move)
              legacy = deepcopy(engine)
              clone = engine.clone_for_simulation()

              for state in (legacy, clone):
                  resolved = resolve_move_spec(state, spec)
                  assert state.execute_action_move(resolved)
              assert engine_state_signature(clone) == engine_state_signature(legacy)
              assert clone.can_submit_action() == legacy.can_submit_action() is True
              assert clone.submit_action(evaluate_outcome=False)
              assert legacy.submit_action(evaluate_outcome=False)
              assert engine_state_signature(clone) == engine_state_signature(legacy)


          def test_simulation_clone_branching_matches_deepcopy():
              old = _position(0, 0, ChessColor.WHITE)
              latest = _position(0, 2, ChessColor.WHITE, (3, 3, "R"))
              engine = _single_timeline_engine(old, latest)
              branching = next(
                  move for move in engine.get_legal_moves_from_square(latest, 3, 3)
                  if move.is_branching
                  and move.destination.timeline == 0
                  and move.destination.board.legacy_time_point == 0
              )
              spec = MoveSpec.from_move(branching)
              legacy = deepcopy(engine)
              clone = engine.clone_for_simulation()

              for state in (legacy, clone):
                  resolved = resolve_move_spec(state, spec)
                  assert resolved.is_branching
                  assert state.execute_action_move(resolved)

              assert engine_state_signature(clone) == engine_state_signature(legacy)
              assert clone.timeline_manager._next_positive_id == 2
              assert clone.timeline_manager.get_timeline(1) is not None
              assert clone.can_submit_action() == legacy.can_submit_action()


          def test_simulation_clone_fails_closed_on_unknown_dynamic_state():
              engine = FiveDEngine()
              engine.unmodeled_mutable_state = []
              try:
                  engine.clone_for_simulation()
              except RuntimeError as exc:
                  assert "unmodeled_mutable_state" in str(exc)
              else:
                  raise AssertionError("unknown mutable state must fail closed")
          PY

          cat > tests/training/test_encoding_clone_equivalence.py <<'PY'
          from copy import deepcopy

          import numpy as np
          import pytest

          from src.ai.action_planner import (
              ActionPlanner,
              ActionSearchBudget,
              InvalidActionPlanError,
              MoveSpec,
              engine_state_signature,
              resolve_move_spec,
          )
          from src.engine.action import ActionRules
          from src.engine.board import Position
          from src.engine.coordinates import Square5D
          from src.engine.engine import FiveDEngine
          from src.engine.timeline import Timeline
          from src.training.config import DEFAULT_ENCODING
          from src.training.encoding import (
              EncodedCandidates,
              EncodingError,
              _move_feature_vector,
              encode_action,
              encode_candidates,
          )
          from src.utils.constants import ChessColor, GameState, PieceType


          def legacy_encode_action_with_deepcopy(engine, specs, config=DEFAULT_ENCODING):
              specs = tuple(specs)
              if not specs:
                  raise EncodingError("an AI Action candidate must contain at least one Move")
              if len(specs) > config.max_moves_per_action:
                  raise EncodingError(
                      f"Action has {len(specs)} moves, above max {config.max_moves_per_action}"
                  )
              moves = np.zeros(
                  (config.max_moves_per_action, config.action_move_feature_dim),
                  dtype=np.float32,
              )
              move_mask = np.zeros((config.max_moves_per_action,), dtype=np.bool_)
              clone = deepcopy(engine)
              has_branching = False
              has_cross = False
              for index, spec in enumerate(specs):
                  resolved = resolve_move_spec(clone, spec)
                  if not clone.execute_action_move(resolved):
                      raise EncodingError(f"candidate move {index} was rejected during encoding")
                  recorded = clone.current_action.moves[-1]
                  moves[index] = _move_feature_vector(recorded, clone, config)
                  move_mask[index] = True
                  has_branching = has_branching or bool(recorded.is_branching)
                  has_cross = has_cross or bool(recorded.is_cross_timeline)
              if not clone.can_submit_action():
                  raise EncodingError("candidate does not reach a submit-capable Action")
              action_global = np.asarray(
                  [
                      len(specs) / float(config.max_moves_per_action),
                      1.0 if has_branching else 0.0,
                      1.0 if has_cross else 0.0,
                      1.0,
                  ],
                  dtype=np.float32,
              )
              return moves, move_mask, action_global


          def legacy_encode_candidates(engine, candidates, config=DEFAULT_ENCODING):
              candidates = tuple(tuple(candidate) for candidate in candidates)
              moves = np.zeros(
                  (
                      len(candidates),
                      config.max_moves_per_action,
                      config.action_move_feature_dim,
                  ),
                  dtype=np.float32,
              )
              masks = np.zeros(
                  (len(candidates), config.max_moves_per_action), dtype=np.bool_
              )
              globals_ = np.zeros(
                  (len(candidates), config.action_global_dim), dtype=np.float32
              )
              for index, candidate in enumerate(candidates):
                  moves[index], masks[index], globals_[index] = (
                      legacy_encode_action_with_deepcopy(engine, candidate, config)
                  )
              return EncodedCandidates(
                  moves,
                  masks,
                  globals_,
                  np.ones((len(candidates),), dtype=np.bool_),
              )


          def _assert_encoded_equal(expected, actual):
              np.testing.assert_array_equal(actual[0], expected[0])
              np.testing.assert_array_equal(actual[1], expected[1])
              np.testing.assert_array_equal(actual[2], expected[2])


          def _assert_candidate_equal(engine, candidate):
              before = engine_state_signature(engine)
              expected = legacy_encode_action_with_deepcopy(engine, candidate)
              actual = encode_action(engine, candidate)
              _assert_encoded_equal(expected, actual)
              assert engine_state_signature(engine) == before


          def _position(
              timeline_id,
              time_point,
              side,
              *pieces,
              en_passant_target=None,
              castling_rights=None,
              unmoved_pawns=None,
          ):
              board = [["" for _ in range(8)] for _ in range(8)]
              board[7][7] = "K"
              board[0][7] = "k"
              for x, y, char in pieces:
                  board[y][x] = char
              kwargs = {}
              if castling_rights is not None:
                  kwargs["castling_rights"] = castling_rights
              return Position(
                  board=board,
                  turn=side,
                  timeline_id=timeline_id,
                  time_point=time_point,
                  en_passant_target=en_passant_target,
                  unmoved_pawns=set() if unmoved_pawns is None else unmoved_pawns,
                  **kwargs,
              )


          def _engine_with_timelines(timelines, color=ChessColor.WHITE):
              engine = FiveDEngine()
              manager = engine.timeline_manager
              manager.timelines = {timeline.timeline_id: timeline for timeline in timelines}
              manager.active_timeline_id = 0
              manager._next_positive_id = max(
                  [1, *(tid + 1 for tid in manager.timelines if tid > 0)]
              )
              manager._next_negative_id = min(
                  [-1, *(tid - 1 for tid in manager.timelines if tid < 0)]
              )
              manager.refresh_activity()
              engine.game_state = GameState.PLAYING
              engine.move_history = []
              engine.action_history = []
              engine.move_counter = 0
              engine.current_turn_color = color
              engine.current_action = ActionRules.begin(color, manager.timelines)
              return engine


          def _single_position_engine(position):
              timeline = Timeline(timeline_id=0)
              timeline.add_position(position)
              return _engine_with_timelines([timeline], position.turn)


          def _planner_candidates(engine, limit=24):
              result = ActionPlanner(
                  ActionSearchBudget(
                      max_states=256,
                      max_actions=limit,
                      max_move_depth=8,
                      max_seconds=None,
                  )
              ).search(engine)
              assert result.candidates
              return result.candidates


          def test_initial_all_planner_candidates_match_legacy_oracle_exactly():
              engine = FiveDEngine()
              before = engine_state_signature(engine)
              candidates = _planner_candidates(engine)
              expected = legacy_encode_candidates(engine, candidates)
              actual = encode_candidates(engine, candidates)
              np.testing.assert_array_equal(actual.moves, expected.moves)
              np.testing.assert_array_equal(actual.move_mask, expected.move_mask)
              np.testing.assert_array_equal(actual.action_global, expected.action_global)
              np.testing.assert_array_equal(actual.candidate_mask, expected.candidate_mask)
              assert engine_state_signature(engine) == before


          def test_repeated_encoding_is_deterministic_and_non_mutating():
              engine = FiveDEngine()
              candidates = _planner_candidates(engine, 6)[:6]
              before = engine_state_signature(engine)
              first = encode_candidates(engine, candidates)
              second = encode_candidates(engine, candidates)
              third = encode_candidates(engine, candidates)
              for attr in ("moves", "move_mask", "action_global", "candidate_mask"):
                  np.testing.assert_array_equal(getattr(first, attr), getattr(second, attr))
                  np.testing.assert_array_equal(getattr(first, attr), getattr(third, attr))
              assert engine_state_signature(engine) == before


          def _branching_engine():
              old = _position(0, 0, ChessColor.WHITE)
              latest = _position(0, 2, ChessColor.WHITE, (3, 3, "R"))
              timeline = Timeline(timeline_id=0)
              timeline.add_position(old)
              timeline.add_position(latest)
              return _engine_with_timelines([timeline]), latest


          def test_candidate_order_isolation_including_branch_allocator():
              engine, latest = _branching_engine()
              legal = engine.get_legal_moves_from_square(latest, 3, 3)
              branch = next(move for move in legal if move.is_branching)
              spatial = [move for move in legal if move.is_spatial]
              assert len(spatial) >= 2
              candidates = (
                  (MoveSpec.from_move(branch),),
                  (MoveSpec.from_move(spatial[0]),),
                  (MoveSpec.from_move(spatial[1]),),
              )
              baseline = [encode_action(engine, candidate) for candidate in candidates]
              before = engine_state_signature(engine)
              for order in ((0, 1, 2), (2, 0, 1), (1, 2, 0)):
                  ordered = tuple(candidates[index] for index in order)
                  encoded = encode_candidates(engine, ordered)
                  for row, original_index in enumerate(order):
                      expected = baseline[original_index]
                      np.testing.assert_array_equal(encoded.moves[row], expected[0])
                      np.testing.assert_array_equal(encoded.move_mask[row], expected[1])
                      np.testing.assert_array_equal(encoded.action_global[row], expected[2])
                  assert engine.timeline_manager._next_positive_id == 1
                  assert engine_state_signature(engine) == before


          def test_failed_candidate_does_not_pollute_engine_or_later_encoding():
              engine = FiveDEngine()
              candidates = _planner_candidates(engine, 3)[:3]
              assert len(candidates) >= 2
              good_a = candidates[0]
              good_c = candidates[-1]
              first_spec = good_a[0]
              invalid = MoveSpec(
                  source=first_spec.source,
                  destination=Square5D(first_spec.source.board, first_spec.source.x, first_spec.source.y),
                  promotion=first_spec.promotion,
              )
              expected_c = encode_action(engine, good_c)
              before = engine_state_signature(engine)
              with pytest.raises(InvalidActionPlanError):
                  encode_candidates(engine, (good_a, (invalid,), good_c))
              assert engine_state_signature(engine) == before
              actual_c = encode_action(engine, good_c)
              _assert_encoded_equal(expected_c, actual_c)


          def test_castling_encoding_matches_legacy_and_isolated():
              rights = {
                  "white_kingside": True,
                  "white_queenside": False,
                  "black_kingside": False,
                  "black_queenside": False,
              }
              position = _position(
                  0, 0, ChessColor.WHITE,
                  (4, 7, "K"), (7, 7, "R"),
                  castling_rights=rights,
              )
              # _position adds a king at h1; overwrite it so only e1 is White King.
              position.board[7][7] = "R"
              position.board[7][4] = "K"
              engine = _single_position_engine(position)
              move = next(
                  move for move in engine.get_legal_moves_from_square(position, 4, 7)
                  if move.is_castling and move.destination.x == 6
              )
              _assert_candidate_equal(engine, (MoveSpec.from_move(move),))


          def test_en_passant_encoding_matches_legacy_and_isolated():
              position = _position(
                  0, 0, ChessColor.WHITE,
                  (4, 3, "P"), (3, 3, "p"),
                  en_passant_target=(3, 2),
              )
              engine = _single_position_engine(position)
              move = next(
                  move for move in engine.get_legal_moves_from_square(position, 4, 3)
                  if move.is_en_passant
              )
              _assert_candidate_equal(engine, (MoveSpec.from_move(move),))


          def test_promotion_encoding_matches_legacy_and_isolated():
              position = _position(0, 0, ChessColor.WHITE, (0, 1, "P"))
              engine = _single_position_engine(position)
              move = next(
                  move for move in engine.get_legal_moves_from_square(position, 0, 1)
                  if move.promotion == PieceType.QUEEN
              )
              _assert_candidate_equal(engine, (MoveSpec.from_move(move),))


          def test_branching_encoding_matches_legacy_and_isolated():
              engine, latest = _branching_engine()
              move = next(
                  move for move in engine.get_legal_moves_from_square(latest, 3, 3)
                  if move.is_branching
              )
              _assert_candidate_equal(engine, (MoveSpec.from_move(move),))


          def test_cross_timeline_encoding_matches_legacy_and_isolated():
              main_pos = _position(0, 0, ChessColor.WHITE, (3, 3, "R"))
              other_pos = _position(1, 0, ChessColor.WHITE)
              main = Timeline(timeline_id=0)
              main.add_position(main_pos)
              other = Timeline(timeline_id=1, owner=ChessColor.WHITE)
              other.add_position(other_pos)
              engine = _engine_with_timelines([main, other])
              move = next(
                  move for move in engine.get_legal_moves_from_square(main_pos, 3, 3)
                  if move.is_cross_timeline
                  and not move.is_branching
                  and move.destination.timeline == 1
                  and move.destination.x == 3
                  and move.destination.y == 3
              )
              _assert_candidate_equal(engine, (MoveSpec.from_move(move),))


          def test_multi_move_action_encoding_matches_legacy_and_isolated():
              main_pos = _position(0, 0, ChessColor.WHITE, (4, 6, "P"), unmoved_pawns={(4, 6)})
              other_pos = _position(1, 0, ChessColor.WHITE, (4, 6, "P"), unmoved_pawns={(4, 6)})
              main = Timeline(timeline_id=0)
              main.add_position(main_pos)
              other = Timeline(timeline_id=1, owner=ChessColor.WHITE)
              other.add_position(other_pos)
              engine = _engine_with_timelines([main, other])

              replay = deepcopy(engine)
              first_pos = replay.timeline_manager.get_timeline(0).positions[0]
              first = next(
                  move for move in replay.get_legal_moves_from_square(first_pos, 4, 6)
                  if move.is_spatial and move.destination.y == 5
              )
              first_spec = MoveSpec.from_move(first)
              assert replay.execute_action_move(first)
              assert not replay.can_submit_action()

              second_pos = replay.timeline_manager.get_timeline(1).positions[0]
              second = next(
                  move for move in replay.get_legal_moves_from_square(second_pos, 4, 6)
                  if move.is_spatial and move.destination.y == 5
              )
              second_spec = MoveSpec.from_move(second)
              assert replay.execute_action_move(second)
              assert replay.can_submit_action()

              _assert_candidate_equal(engine, (first_spec, second_spec))
          PY
