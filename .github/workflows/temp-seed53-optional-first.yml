name: TEMP Planner Completion Skeleton

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-seed53-optional-first.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install game dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Download exact planner failure states
        uses: actions/download-artifact@v4
        with:
          name: planner-failure-states-34337992183
          path: _work/failure-states
          repository: ${{ github.repository }}
          run-id: 34337992183
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Probe completion skeletons through canonical APIs
        run: |
          mkdir -p _work/skeleton
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          from src.ai.action_planner import MoveSpec, _required_board_progress, _required_move_sort_key
          from src.data.archive import GameArchive
          from src.engine.action import ActionRules

          def load(seed):
              engine = GameArchive.restore(json.loads(Path(
                  f"_work/failure-states/seed{seed}-failure-archive.json"
              ).read_text(encoding="utf-8")))
              if hasattr(engine, "_replay_origin"):
                  delattr(engine, "_replay_origin")
              return engine

          def required(engine):
              return set(ActionRules.required_boards(
                  engine._ensure_current_action(), engine.timeline_manager.timelines
              ))

          def legal_required_moves(engine, req):
              moves=[]
              for board in sorted(req, key=lambda b:(b.timeline,b.turn,b.side.value)):
                  pos=engine._resolve_position(board)
                  if pos is not None:
                      moves.extend(engine.get_legal_moves(pos))
              return sorted(moves, key=lambda m:_required_move_sort_key(m, req))

          def spec_json(move):
              s=MoveSpec.from_move(move)
              return {
                  "source":[s.source.board.timeline,s.source.board.turn,s.source.board.side.value,s.source.x,s.source.y],
                  "destination":[s.destination.board.timeline,s.destination.board.turn,s.destination.board.side.value,s.destination.x,s.destination.y],
              }

          def probe(seed, mode, state_cap=50000, seconds=60.0):
              root=load(seed)
              started=time.monotonic(); states=0; witness=None
              def dfs(engine, path):
                  nonlocal states,witness
                  if witness is not None or states>=state_cap or time.monotonic()-started>=seconds:
                      return
                  req=required(engine)
                  if not req:
                      states += 1
                      if engine.can_submit_action():
                          witness=list(path)
                      return
                  states += 1
                  moves=legal_required_moves(engine,req)
                  if mode=="pair_all":
                      target=2 if len(req)>1 else 1
                      moves=[m for m in moves if _required_board_progress(m,req)==target]
                  elif mode=="two_single":
                      moves=[m for m in moves if _required_board_progress(m,req)==1]
                  for move in moves:
                      child=engine.clone_for_simulation()
                      if not child.execute_action_move(move):
                          continue
                      dfs(child,path+(spec_json(move),))
                      if witness is not None:
                          return
              dfs(root,())
              return {
                  "seed":seed,"mode":mode,"states":states,
                  "elapsed_seconds":time.monotonic()-started,
                  "witness":witness,"witness_length":len(witness) if witness else None,
                  "exhausted": witness is None and states<state_cap and time.monotonic()-started<seconds,
              }

          results=[
              probe(53,"two_single",state_cap=20000,seconds=60.0),
              probe(51,"pair_all",state_cap=30000,seconds=60.0),
              probe(55,"pair_all",state_cap=50000,seconds=60.0),
          ]
          print("SKELETON_RESULTS="+json.dumps(results,sort_keys=True))
          Path("_work/skeleton/results.json").write_text(json.dumps(results,indent=2,sort_keys=True),encoding="utf-8")
          PY
      - name: Upload result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: planner-completion-skeleton-${{ github.run_id }}
          path: _work/skeleton
          retention-days: 7
          if-no-files-found: error
