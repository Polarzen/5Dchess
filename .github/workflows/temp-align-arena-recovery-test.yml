name: TEMP Align Arena Recovery Test

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-align-arena-recovery-test.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-ai-training-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch legacy timeout test
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/training/test_training_pipeline.py')
          text = p.read_text(encoding='utf-8')
          old_import = 'from src.training.arena import build_parser as build_arena_parser, evaluate_arena\n'
          new_import = 'import src.training.arena as arena_module\nfrom src.training.arena import build_parser as build_arena_parser, evaluate_arena\n'
          if text.count(old_import) != 1:
              raise SystemExit(f'import anchor count={text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)
          old = '    monkeypatch.setattr(NeuralPolicyValueAgent, "plan_action", fail_to_plan)\n    result = evaluate_arena(\n'
          new = '''    monkeypatch.setattr(NeuralPolicyValueAgent, "plan_action", fail_to_plan)\n    monkeypatch.setattr(\n        arena_module,\n        "_recover_incomplete_planner_action",\n        lambda engine, exc: ("unresolved", None),\n    )\n    result = evaluate_arena(\n'''
          if text.count(old) != 1:
              raise SystemExit(f'test anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24" pytest
      - name: Run focused tests
        run: |
          python -m pytest -q tests/training/test_training_pipeline.py::test_arena_incomplete_planning_failure_is_budget_termination tests/test_arena_planner_recovery.py
          git diff --check
      - name: Commit test alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/training/test_training_pipeline.py
          git diff --cached --check
          git commit -m "test(arena): preserve unresolved timeout coverage"
          git push origin HEAD:feat/local-ai-training-v2
