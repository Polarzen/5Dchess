name: TEMP Stage1 Easy Failure Attribution

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-stage1-arena-failure-attribution.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-stage1-arena-failure-attribution
  cancel-in-progress: false

jobs:
  attribute:
    name: Attribute fixed-seed Easy planner failures
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt

      - name: Install game and CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"

      - name: Download Stage 1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-stage1-500-34028226472
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: 34028226472
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate checkpoint shape
        run: python -m src.training.cloud check-resume --checkpoint _work/checkpoint/best --preset small

      - name: Re-run fixed seeds one game at a time and attribute failures
        run: |
          mkdir -p _work/arena-attribution/games
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          from src.ai.action_planner import ActionSearchBudget
          from src.training.arena import evaluate_arena

          checkpoint = Path("_work/checkpoint/best")
          out_dir = Path("_work/arena-attribution")
          games_dir = out_dir / "games"
          seeds = list(range(42, 62))
          budget = ActionSearchBudget(
              max_states=1024,
              max_actions=24,
              max_move_depth=32,
              max_seconds=5.0,
          )

          records = []
          actor_counts = Counter()
          reason_counts = Counter()
          result_counts = Counter()

          for index, seed in enumerate(seeds):
              model_color = "white" if index % 2 == 0 else "black"
              result = evaluate_arena(
                  checkpoint=checkpoint,
                  opponent="easy",
                  games=1,
                  device_name="cpu",
                  seed=seed,
                  max_actions=120,
                  budget=budget,
                  max_wall_seconds=600,
                  output="json",
                  model_color=model_color,
                  game_seeds=[seed],
              )

              first = result.get("first_failure") or {}
              planning = int(result.get("planning_failure_count", 0))
              failure_player = first.get("player")
              actor = None
              if planning:
                  actor = "neural" if failure_player == model_color else "baseline"
                  actor_counts[actor] += planning
                  reason_counts[f"{actor}:{first.get('planning_reason') or 'unknown'}"] += planning

              if int(result.get("wins", 0)):
                  outcome = "win"
              elif int(result.get("draws", 0)):
                  outcome = "draw"
              else:
                  outcome = "loss"
              result_counts[outcome] += 1

              record = {
                  "seed": seed,
                  "model_color": model_color,
                  "outcome": outcome,
                  "planning_failure_count": planning,
                  "failure_actor": actor,
                  "failure_player": failure_player,
                  "planning_reason": first.get("planning_reason"),
                  "action_index": first.get("action_index"),
                  "ply": first.get("ply"),
                  "timeline_count": first.get("timeline_count"),
                  "explored_states": first.get("explored_states"),
                  "illegal_action_count": int(result.get("illegal_action_count", 0)),
                  "stale_failure_count": int(result.get("stale_failure_count", 0)),
                  "unexpected_failure_count": int(result.get("unexpected_failure_count", 0)),
                  "budget_termination_count": int(result.get("budget_termination_count", 0)),
                  "first_failure": result.get("first_failure"),
              }
              records.append(record)
              (games_dir / f"seed-{seed}-{model_color}.json").write_text(
                  json.dumps(result, indent=2, sort_keys=True), encoding="utf-8"
              )

          total_planning = sum(r["planning_failure_count"] for r in records)
          summary = {
              "source_benchmark_run": 34087779778,
              "checkpoint_source_run": 34028226472,
              "opponent": "easy",
              "seeds": seeds,
              "planner": {"states": 1024, "actions": 24, "moves": 32, "seconds": 5.0},
              "games": len(records),
              "wins": result_counts["win"],
              "draws": result_counts["draw"],
              "losses": result_counts["loss"],
              "planning_failure_count": total_planning,
              "neural_planning_failure_count": actor_counts["neural"],
              "baseline_planning_failure_count": actor_counts["baseline"],
              "planning_reason_counts": dict(sorted(reason_counts.items())),
              "illegal_action_count": sum(r["illegal_action_count"] for r in records),
              "stale_failure_count": sum(r["stale_failure_count"] for r in records),
              "unexpected_failure_count": sum(r["unexpected_failure_count"] for r in records),
              "records": records,
          }
          if total_planning != actor_counts["neural"] + actor_counts["baseline"]:
              raise SystemExit("planning attribution is incomplete")
          (out_dir / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True), encoding="utf-8"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Publish attribution summary
        if: ${{ always() }}
        run: |
          echo "# Stage 1 Easy planner-failure attribution" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "- Seeds: \`42..61\`, same 10 White / 10 Black split as run \`34087779778\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Planner: \`5.0 s / 1024 states / 24 actions / 32 moves\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f _work/arena-attribution/summary.json ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path("_work/arena-attribution/summary.json").read_text(encoding="utf-8"))
          print(f"- W/D/L: `{r['wins']}/{r['draws']}/{r['losses']}`")
          print(f"- Planning failures: total `{r['planning_failure_count']}`, neural `{r['neural_planning_failure_count']}`, baseline `{r['baseline_planning_failure_count']}`")
          print(f"- Reasons: `{json.dumps(r['planning_reason_counts'], sort_keys=True)}`")
          print(f"- Safety: illegal `{r['illegal_action_count']}`, stale `{r['stale_failure_count']}`, unexpected `{r['unexpected_failure_count']}`")
          PY
          fi

      - name: Upload attribution artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stage1-easy-failure-attribution-${{ github.run_id }}
          path: _work/arena-attribution
          retention-days: 30
          if-no-files-found: warn

      - name: Validate attribution integrity
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("_work/arena-attribution/summary.json")
          if not path.exists():
              raise SystemExit("attribution summary missing")
          r = json.loads(path.read_text(encoding="utf-8"))
          if r["games"] != 20:
              raise SystemExit(f"expected 20 games, got {r['games']}")
          if r["planning_failure_count"] != r["neural_planning_failure_count"] + r["baseline_planning_failure_count"]:
              raise SystemExit("planning attribution mismatch")
          if r["illegal_action_count"] or r["stale_failure_count"] or r["unexpected_failure_count"]:
              raise SystemExit("non-planner Arena safety regression detected")
          PY
