name: TEMP Stage1 Planner Profile

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-stage1-arena-easy-20.yml
      - src/engine/royal_rules.py
      - src/engine/action_planner.py
      - src/training/arena.py

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-stage1-arena-easy-20
  cancel-in-progress: false

jobs:
  arena:
    name: Profile first Stage 1 Easy planner timeout
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt

      - name: Install game and CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"

      - name: Download Stage 1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-stage1-500-34028226472
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: 34028226472
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate checkpoint shape
        run: python -m src.training.cloud check-resume --checkpoint _work/checkpoint/best --preset small

      - name: Profile deterministic first Easy game
        run: |
          mkdir -p _work/arena-report
          python -m cProfile -o _work/arena-report/planner-profile.pstats -m src.training.arena \
            --checkpoint _work/checkpoint/best \
            --opponent easy \
            --games 1 \
            --planner-states 1024 \
            --planner-seconds 5.0 \
            --device cpu \
            --seed 42 \
            --max-actions 120 \
            --max-wall-seconds 1800 \
            --output json \
            --result-json _work/arena-report/arena-result.json

      - name: Render cumulative profile
        if: ${{ always() }}
        run: |
          if [[ -f _work/arena-report/planner-profile.pstats ]]; then
            python - <<'PY'
          import pstats
          from pathlib import Path

          out = Path("_work/arena-report/profile-cumulative.txt")
          with out.open("w", encoding="utf-8") as handle:
              stats = pstats.Stats("_work/arena-report/planner-profile.pstats", stream=handle)
              stats.strip_dirs().sort_stats("cumulative").print_stats(80)
          PY
          fi

      - name: Publish profile summary
        if: ${{ always() }}
        run: |
          echo "# Stage 1 planner timeout profile" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "- Baseline validation: run \`34080584015\` = 12/2/6, planning failures 6" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reproduction: Easy game 1, seed 42, 5.0 s / 1024 states" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f _work/arena-report/arena-result.json ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          result = json.loads(Path("_work/arena-report/arena-result.json").read_text(encoding="utf-8"))
          print(f"- W/D/L: `{result.get('wins')}/{result.get('draws')}/{result.get('losses')}`")
          print(f"- Planning failures: `{result.get('planning_failure_count')}`")
          first = result.get("first_failure") or {}
          if first:
              print(f"- First failure: `{first.get('planning_reason')}` after `{first.get('explored_states')}` states at action `{first.get('action_index')}`")
          PY
          fi
          if [[ -f _work/arena-report/profile-cumulative.txt ]]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "## Top cumulative profile" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            head -n 45 _work/arena-report/profile-cumulative.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload planner profile Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stage1-planner-profile-${{ github.run_id }}
          path: _work/arena-report
          retention-days: 30
          if-no-files-found: warn
