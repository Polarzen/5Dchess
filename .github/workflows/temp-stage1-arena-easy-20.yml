name: TEMP Stage1 Easy Arena 20

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-stage1-arena-easy-20.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-stage1-arena-easy-20
  cancel-in-progress: false

jobs:
  arena:
    name: Stage 1 Easy Arena 20-game 5s / 1024-state planner diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt

      - name: Install game and CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"

      - name: Download Stage 1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-stage1-500-34028226472
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: 34028226472
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate checkpoint shape
        run: python -m src.training.cloud check-resume --checkpoint _work/checkpoint/best --preset small

      - name: Run Easy Arena 20-game 5s / 1024-state planner diagnostic
        run: |
          mkdir -p _work/arena-report
          python -m src.training.arena \
            --checkpoint _work/checkpoint/best \
            --opponent easy \
            --games 20 \
            --planner-states 1024 \
            --planner-seconds 5.0 \
            --device cpu \
            --seed 42 \
            --max-actions 120 \
            --max-wall-seconds 9000 \
            --output json \
            --result-json _work/arena-report/arena-result.json

      - name: Publish Arena summary
        if: ${{ always() }}
        run: |
          if [[ -f _work/arena-report/arena-result.json ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          result = json.loads(Path("_work/arena-report/arena-result.json").read_text(encoding="utf-8"))
          print("# Stage 1 Easy Arena 20-game 5s / 1024-state planner diagnostic")
          print()
          print("- Source run: `34028226472`")
          print("- Source Artifact: `local-ai-checkpoint-stage1-500-34028226472`")
          print("- Planner budget: `5.0 s / 1024 states`")
          print(f"- Opponent: `{result.get('opponent')}`")
          print(f"- Games played: `{result.get('games_requested', result.get('games'))}`")
          print(f"- W/D/L: `{result.get('wins')}/{result.get('draws')}/{result.get('losses')}`")
          print(f"- Illegal: `{result.get('illegal_action_count')}`")
          print(f"- Stale failures: `{result.get('stale_failure_count')}`")
          print(f"- Planning failures: `{result.get('planning_failure_count')}`")
          print(f"- Unexpected failures: `{result.get('unexpected_failure_count')}`")
          print(f"- Budget terminations: `{result.get('budget_termination_count')}`")
          first_failure = result.get("first_failure")
          if first_failure:
              print(f"- First failure: `{first_failure.get('failure_stage')}: {first_failure.get('message')}`")
          PY
          else
            echo "# Stage 1 Easy Arena 20-game 5s / 1024-state planner diagnostic" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "Arena result JSON was not produced; inspect the Arena step logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Arena validation Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stage1-arena-easy-20-${{ github.run_id }}
          path: _work/arena-report
          retention-days: 30
          if-no-files-found: warn
