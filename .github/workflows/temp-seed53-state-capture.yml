name: TEMP Planner Failure State Capture

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-seed53-state-capture.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-planner-failure-state-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt
      - name: Install game and CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"
      - name: Download Stage 1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-stage1-500-34028226472
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: 34028226472
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Capture current seed 51 failure state
        run: |
          mkdir -p _work/planner-failure-states
          python - <<'PY'
          import json
          from pathlib import Path

          import src.training.arena as arena_module
          from src.ai.action_planner import ActionPlanner, ActionSearchBudget, _required_board_progress
          from src.data.archive import GameArchive
          from src.engine.action import ActionRules
          from src.training.arena import evaluate_arena

          seed = 51
          expected = "b8e7f211f1aa93e20d80509ed6d9132d84d401ad091f76e3dfdc41e4d32d5da5"
          checkpoint = Path("_work/checkpoint/best")
          out_dir = Path("_work/planner-failure-states")
          budget = ActionSearchBudget(max_states=1024, max_actions=24, max_move_depth=32, max_seconds=5.0)
          captured = False
          original_search = ActionPlanner.search

          def board_dict(board):
              return {"timeline": board.timeline, "turn": board.turn, "side": board.side.value}

          def move_dict(move, required):
              return {
                  "piece": move.piece.piece_type.value,
                  "source": {"board": board_dict(move.source.board), "x": move.source.x, "y": move.source.y},
                  "destination": {"board": board_dict(move.destination.board), "x": move.destination.x, "y": move.destination.y},
                  "capture": move.captured.piece_type.value if move.captured else None,
                  "promotion": move.promotion.value if move.promotion else None,
                  "branching": bool(move.is_branching),
                  "cross_timeline": bool(move.is_cross_timeline),
                  "required_progress": _required_board_progress(move, required),
              }

          def profiled_search(self, engine):
              global captured
              result = original_search(self, engine)
              if captured or self.budget != budget or result.candidates or result.termination_reason is None:
                  return result
              signature = arena_module._state_signature_sha256(engine)
              if signature != expected:
                  return result
              action = engine._ensure_current_action()
              required = set(ActionRules.required_boards(action, engine.timeline_manager.timelines))
              movable = tuple(ActionRules.movable_boards(action, engine.timeline_manager.timelines))
              root_moves = []
              for board in movable:
                  position = engine._resolve_position(board)
                  if position is not None:
                      root_moves.extend(move_dict(move, required) for move in engine.get_legal_moves(position))
              payload = {
                  "seed": seed,
                  "state_signature_sha256": signature,
                  "termination_reason": result.termination_reason,
                  "explored_states": result.explored_states,
                  "failed_state_cache_hits": result.failed_state_cache_hits,
                  "player": engine.current_turn_color.value,
                  "ply": engine.move_counter,
                  "timeline_count": len(engine.timeline_manager.timelines),
                  "required": [board_dict(item) for item in sorted(required, key=lambda b: (b.timeline, b.turn, b.side.value))],
                  "movable": [board_dict(item) for item in sorted(movable, key=lambda b: (b.timeline, b.turn, b.side.value))],
                  "root_move_count": len(root_moves),
                  "root_moves": root_moves,
              }
              captured = True
              (out_dir / "seed51-failure-archive.json").write_text(json.dumps(GameArchive.capture(engine), indent=2, sort_keys=True), encoding="utf-8")
              (out_dir / "seed51-root-analysis.json").write_text(json.dumps(payload, indent=2, sort_keys=True), encoding="utf-8")
              print("CAPTURE=" + json.dumps({"signature": signature, "root_moves": len(root_moves), "required": len(required), "movable": len(movable)}, sort_keys=True))
              return result

          ActionPlanner.search = profiled_search
          result = evaluate_arena(
              checkpoint=checkpoint,
              opponent="easy",
              games=1,
              device_name="cpu",
              seed=seed,
              max_actions=120,
              budget=budget,
              max_wall_seconds=900,
              output="json",
              model_color="black",
              game_seeds=[seed],
          )
          (out_dir / "seed51-arena-result.json").write_text(json.dumps(result, indent=2, sort_keys=True), encoding="utf-8")
          if not captured:
              raise SystemExit("current seed51 planner failure boundary was not captured")
          PY
      - name: Upload state artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: planner-seed51-current-${{ github.run_id }}
          path: _work/planner-failure-states
          retention-days: 7
          if-no-files-found: error
