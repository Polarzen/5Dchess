name: TEMP Seed53 Planner State Capture

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-seed53-state-capture.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-seed53-state-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt
      - name: Install game and CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"
      - name: Download Stage 1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-stage1-500-34028226472
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: 34028226472
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Capture exact seed53 failure state
        run: |
          mkdir -p _work/seed53-state
          python - <<'PY'
          import json
          from pathlib import Path

          import src.training.arena as arena_module
          from src.ai.action_planner import ActionPlanner, ActionSearchBudget, _required_board_progress
          from src.data.archive import GameArchive
          from src.engine.action import ActionRules
          from src.engine.royal_rules import RoyalRules
          from src.training.arena import evaluate_arena

          checkpoint = Path("_work/checkpoint/best")
          out_dir = Path("_work/seed53-state")
          budget = ActionSearchBudget(
              max_states=1024,
              max_actions=24,
              max_move_depth=32,
              max_seconds=5.0,
          )
          captured = []
          original_search = ActionPlanner.search

          def board_dict(board):
              return {
                  "timeline": board.timeline,
                  "turn": board.turn,
                  "side": board.side.value,
              }

          def move_dict(move, required):
              return {
                  "piece": move.piece.piece_type.value,
                  "source": {
                      "board": board_dict(move.source.board),
                      "x": move.source.x,
                      "y": move.source.y,
                  },
                  "destination": {
                      "board": board_dict(move.destination.board),
                      "x": move.destination.x,
                      "y": move.destination.y,
                  },
                  "capture": move.captured.piece_type.value if move.captured else None,
                  "promotion": move.promotion.value if move.promotion else None,
                  "branching": bool(move.is_branching),
                  "cross_timeline": bool(move.is_cross_timeline),
                  "required_progress": _required_board_progress(move, required),
              }

          def profiled_search(self, engine):
              result = original_search(self, engine)
              if (
                  not captured
                  and not result.candidates
                  and result.termination_reason is not None
                  and engine.current_turn_color.value == "white"
                  and engine.move_counter == 42
                  and len(engine.timeline_manager.timelines) == 3
              ):
                  action = engine._ensure_current_action()
                  required = set(ActionRules.required_boards(action, engine.timeline_manager.timelines))
                  movable = tuple(ActionRules.movable_boards(action, engine.timeline_manager.timelines))
                  root_moves = []
                  child_summaries = []
                  for board in movable:
                      position = engine._resolve_position(board)
                      if position is None:
                          continue
                      legal = engine.get_legal_moves(position)
                      for move in legal:
                          root_moves.append(move_dict(move, required))
                          child = engine.clone_for_simulation()
                          if not child.execute_action_move(move):
                              continue
                          child_action = child._ensure_current_action()
                          child_required = set(ActionRules.required_boards(
                              child_action, child.timeline_manager.timelines
                          ))
                          child_item = {
                              "move": move_dict(move, required),
                              "required_after": [board_dict(item) for item in sorted(
                                  child_required,
                                  key=lambda b: (b.timeline, b.turn, b.side.value),
                              )],
                              "required_after_count": len(child_required),
                              "movable_after_count": len(ActionRules.movable_boards(
                                  child_action, child.timeline_manager.timelines
                              )),
                          }
                          if not child_required:
                              safe = child.can_submit_action()
                              child_item["can_submit"] = bool(safe)
                              if not safe:
                                  threats = RoyalRules(
                                      child.timeline_manager.timelines
                                  ).direct_threats_against(child.current_turn_color)
                                  child_item["threat_count"] = len(threats)
                                  child_item["threats"] = [
                                      {
                                          "attacker": {
                                              "board": board_dict(threat.attacker.board),
                                              "x": threat.attacker.x,
                                              "y": threat.attacker.y,
                                          },
                                          "king": {
                                              "board": board_dict(threat.king.board),
                                              "x": threat.king.x,
                                              "y": threat.king.y,
                                          },
                                      }
                                      for threat in threats[:16]
                                  ]
                          child_summaries.append(child_item)
                  payload = {
                      "state_signature_sha256": arena_module._state_signature_sha256(engine),
                      "termination_reason": result.termination_reason,
                      "explored_states": result.explored_states,
                      "failed_state_cache_hits": result.failed_state_cache_hits,
                      "player": engine.current_turn_color.value,
                      "ply": engine.move_counter,
                      "timelines": len(engine.timeline_manager.timelines),
                      "required": [board_dict(item) for item in sorted(
                          required,
                          key=lambda b: (b.timeline, b.turn, b.side.value),
                      )],
                      "movable": [board_dict(item) for item in sorted(
                          movable,
                          key=lambda b: (b.timeline, b.turn, b.side.value),
                      )],
                      "root_move_count": len(root_moves),
                      "root_moves": root_moves,
                      "children": child_summaries,
                  }
                  captured.append(payload)
                  (out_dir / "seed53-failure-archive.json").write_text(
                      json.dumps(GameArchive.capture(engine), indent=2, sort_keys=True),
                      encoding="utf-8",
                  )
                  (out_dir / "seed53-root-analysis.json").write_text(
                      json.dumps(payload, indent=2, sort_keys=True), encoding="utf-8"
                  )
                  print("SEED53_CAPTURE=" + json.dumps({
                      "signature": payload["state_signature_sha256"],
                      "root_moves": payload["root_move_count"],
                      "required": len(payload["required"]),
                      "movable": len(payload["movable"]),
                  }, sort_keys=True))
              return result

          ActionPlanner.search = profiled_search
          result = evaluate_arena(
              checkpoint=checkpoint,
              opponent="easy",
              games=1,
              device_name="cpu",
              seed=42,
              max_actions=120,
              budget=budget,
              max_wall_seconds=900,
              output="json",
              model_color="black",
              game_seeds=[53],
          )
          (out_dir / "seed53-arena-result.json").write_text(
              json.dumps(result, indent=2, sort_keys=True), encoding="utf-8"
          )
          if not captured:
              raise SystemExit("expected seed53 planner failure state was not captured")
          PY
      - name: Upload state artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: seed53-planner-state-${{ github.run_id }}
          path: _work/seed53-state
          retention-days: 7
          if-no-files-found: error
