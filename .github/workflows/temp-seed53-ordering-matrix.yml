name: TEMP Seed53 Ordering Matrix

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-seed53-ordering-matrix.yml

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install game dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Download exact seed53 state
        uses: actions/download-artifact@v4
        with:
          name: seed53-planner-state-34332477538
          path: _work/seed53-state
          repository: ${{ github.repository }}
          run-id: 34332477538
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare ordering-only variants
        run: |
          mkdir -p _work/ordering
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          import src.ai.action_planner as planner_module
          from src.ai.action_planner import ActionPlanner, ActionSearchBudget
          from src.data.archive import GameArchive
          from src.utils.constants import PieceType

          payload = json.loads(Path("_work/seed53-state/seed53-failure-archive.json").read_text(encoding="utf-8"))
          original_key = planner_module._required_move_sort_key

          def load_engine():
              engine = GameArchive.restore(payload)
              if hasattr(engine, "_replay_origin"):
                  delattr(engine, "_replay_origin")
              return engine

          def progress_one_first(move, required):
              base = planner_module._move_sort_key(move)
              if len(required) != 2:
                  return original_key(move, required)
              progress = planner_module._required_board_progress(move, required)
              progress_rank = {1: 0, 2: 1, 0: 2}.get(progress, 3)
              return (
                  base[0],
                  progress_rank,
                  move.piece.piece_type is not PieceType.KING,
                  move.captured is None,
                  *base[1:],
              )

          def king_capture_then_progress(move, required):
              base = planner_module._move_sort_key(move)
              if len(required) != 2:
                  return original_key(move, required)
              return (
                  base[0],
                  move.piece.piece_type is not PieceType.KING,
                  move.captured is None,
                  -planner_module._required_board_progress(move, required),
                  *base[1:],
              )

          def deterministic_base(move, required):
              if len(required) == 2:
                  return planner_module._move_sort_key(move)
              return original_key(move, required)

          variants = [
              ("current", original_key),
              ("progress_one_first", progress_one_first),
              ("king_capture_then_progress", king_capture_then_progress),
              ("deterministic_base", deterministic_base),
          ]
          results = []
          for name, key in variants:
              planner_module._required_move_sort_key = key
              engine = load_engine()
              budget = ActionSearchBudget(
                  max_states=1024,
                  max_actions=1,
                  max_move_depth=32,
                  max_seconds=60.0,
              )
              started = time.monotonic()
              result = ActionPlanner(budget).search(engine)
              elapsed = time.monotonic() - started
              item = {
                  "variant": name,
                  "elapsed_seconds": elapsed,
                  "explored_states": result.explored_states,
                  "candidate_count": len(result.candidates),
                  "termination_reason": result.termination_reason,
                  "failed_state_cache_hits": result.failed_state_cache_hits,
                  "first_action_length": len(result.candidates[0]) if result.candidates else None,
                  "first_action": [
                      {
                          "source": [
                              spec.source.board.timeline, spec.source.board.turn,
                              spec.source.board.side.value, spec.source.x, spec.source.y,
                          ],
                          "destination": [
                              spec.destination.board.timeline, spec.destination.board.turn,
                              spec.destination.board.side.value, spec.destination.x, spec.destination.y,
                          ],
                      }
                      for spec in (result.candidates[0] if result.candidates else ())
                  ],
              }
              results.append(item)
              print("ORDERING_RESULT=" + json.dumps(item, sort_keys=True))

          planner_module._required_move_sort_key = original_key
          Path("_work/ordering/results.json").write_text(
              json.dumps(results, indent=2, sort_keys=True), encoding="utf-8"
          )
          PY
      - name: Upload matrix
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: seed53-ordering-matrix-${{ github.run_id }}
          path: _work/ordering
          retention-days: 7
          if-no-files-found: error
