name: TEMP Planner Ordering Matrix

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-seed53-ordering-matrix.yml

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install game dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Download exact planner failure states
        uses: actions/download-artifact@v4
        with:
          name: planner-failure-states-34337992183
          path: _work/failure-states
          repository: ${{ github.repository }}
          run-id: 34337992183
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare required-board ordering variants
        run: |
          mkdir -p _work/ordering
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ai/action_planner.py")
          original = path.read_text(encoding="utf-8")
          board_old = '''                key=lambda board: (\n                    board not in required,\n                    board.timeline,\n                    board.turn,\n                    _enum_value(board.side),\n                ),\n'''
          board_reverse = '''                key=lambda board: (\n                    board not in required,\n                    -board.timeline,\n                    board.turn,\n                    _enum_value(board.side),\n                ),\n'''
          sort_old = '''    return (\n        base[0],\n        move.piece.piece_type is not PieceType.KING,\n        move.captured is None,\n        -_required_board_progress(move, required),\n        *base[1:],\n    )\n'''
          sort_progress = '''    return (\n        base[0],\n        -_required_board_progress(move, required),\n        move.piece.piece_type is not PieceType.KING,\n        move.captured is None,\n        *base[1:],\n    )\n'''
          if original.count(board_old) != 1:
              raise SystemExit("board ordering pattern changed")
          if original.count(sort_old) != 1:
              raise SystemExit("required sort pattern changed")
          reverse = original.replace(board_old, board_reverse, 1)
          variants = {
              "current": original,
              "reverse_timeline": reverse,
              "reverse_progress_first": reverse.replace(sort_old, sort_progress, 1),
          }
          out = Path("_work/ordering/variants")
          out.mkdir(parents=True, exist_ok=True)
          for name, text in variants.items():
              (out / f"{name}.py").write_text(text, encoding="utf-8")
          PY

          cat > _work/ordering/run_variant.py <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          planner_path = Path("src/ai/action_planner.py")
          variant = os.environ["VARIANT"]
          planner_path.write_text(
              Path(f"_work/ordering/variants/{variant}.py").read_text(encoding="utf-8"),
              encoding="utf-8",
          )
          if os.environ.get("VARIANT_CHILD") != "1":
              import subprocess, sys
              env = dict(os.environ)
              env["VARIANT_CHILD"] = "1"
              env["PYTHONPATH"] = str(Path.cwd())
              raise SystemExit(subprocess.call([sys.executable, __file__], env=env))

          from src.ai.action_planner import ActionPlanner, ActionSearchBudget
          from src.data.archive import GameArchive

          rows = []
          for seed in (51, 53, 55):
              payload = json.loads(Path(
                  f"_work/failure-states/seed{seed}-failure-archive.json"
              ).read_text(encoding="utf-8"))
              engine = GameArchive.restore(payload)
              if hasattr(engine, "_replay_origin"):
                  delattr(engine, "_replay_origin")
              started = time.monotonic()
              result = ActionPlanner(ActionSearchBudget(
                  max_states=1024,
                  max_actions=24,
                  max_move_depth=32,
                  max_seconds=5.0,
              )).search(engine)
              row = {
                  "variant": variant,
                  "seed": seed,
                  "elapsed_seconds": time.monotonic() - started,
                  "explored_states": result.explored_states,
                  "candidate_count": len(result.candidates),
                  "termination_reason": result.termination_reason,
                  "failed_state_cache_hits": result.failed_state_cache_hits,
                  "first_action_length": len(result.candidates[0]) if result.candidates else None,
              }
              rows.append(row)
              print("ORDERING_RESULT=" + json.dumps(row, sort_keys=True))
          Path(f"_work/ordering/{variant}.json").write_text(
              json.dumps(rows, indent=2, sort_keys=True), encoding="utf-8"
          )
          PY

          for variant in current reverse_timeline reverse_progress_first; do
            echo "=== ${variant} ==="
            VARIANT="${variant}" python _work/ordering/run_variant.py
          done
          git checkout -- src/ai/action_planner.py

          python - <<'PY'
          import json
          from pathlib import Path
          rows = []
          for path in sorted(Path("_work/ordering").glob("*.json")):
              rows.extend(json.loads(path.read_text(encoding="utf-8")))
          Path("_work/ordering/results.json").write_text(
              json.dumps(rows, indent=2, sort_keys=True), encoding="utf-8"
          )
          print("ORDERING_MATRIX=" + json.dumps(rows, sort_keys=True))
          PY
      - name: Upload matrix
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: planner-ordering-matrix-${{ github.run_id }}
          path: _work/ordering
          retention-days: 7
          if-no-files-found: error
