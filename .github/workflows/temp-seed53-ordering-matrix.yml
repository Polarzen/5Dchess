name: TEMP Royal Scan Perf A-B

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-seed53-ordering-matrix.yml

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install game dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Download exact planner failure states
        uses: actions/download-artifact@v4
        with:
          name: planner-failure-states-34337992183
          path: _work/failure-states
          repository: ${{ github.repository }}
          run-id: 34337992183
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare pre-optimization and current HEAD
        run: |
          mkdir -p _work/perf
          cat > _work/perf/run_variant.py <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          from src.ai.action_planner import ActionPlanner, ActionSearchBudget
          from src.data.archive import GameArchive

          variant = os.environ["VARIANT"]
          rows = []
          for seed in (51, 53, 55):
              archive = Path(f"_work/failure-states/seed{seed}-failure-archive.json")
              payload = json.loads(archive.read_text(encoding="utf-8"))
              engine = GameArchive.restore(payload)
              if hasattr(engine, "_replay_origin"):
                  delattr(engine, "_replay_origin")
              started = time.monotonic()
              result = ActionPlanner(ActionSearchBudget(
                  max_states=1024,
                  max_actions=24,
                  max_move_depth=32,
                  max_seconds=5.0,
              )).search(engine)
              row = {
                  "variant": variant,
                  "seed": seed,
                  "elapsed_seconds": time.monotonic() - started,
                  "explored_states": result.explored_states,
                  "candidate_count": len(result.candidates),
                  "termination_reason": result.termination_reason,
                  "failed_state_cache_hits": result.failed_state_cache_hits,
                  "first_action_length": len(result.candidates[0]) if result.candidates else None,
              }
              rows.append(row)
              print("PERF_RESULT=" + json.dumps(row, sort_keys=True))
          Path(f"_work/perf/{variant}.json").write_text(
              json.dumps(rows, indent=2, sort_keys=True), encoding="utf-8"
          )
          PY

          # 89eadf is the last production-code-equivalent state before the two
          # allocation-only engine optimizations (subsequent diagnostic commits
          # touched workflows only). Run both variants on the same hosted runner.
          git show 89eadf879ada1aea74aa63b49c9218964014612f:src/engine/piece.py > src/engine/piece.py
          git show 89eadf879ada1aea74aa63b49c9218964014612f:src/engine/royal_rules.py > src/engine/royal_rules.py
          VARIANT=before python _work/perf/run_variant.py

          git checkout HEAD -- src/engine/piece.py src/engine/royal_rules.py
          VARIANT=current python _work/perf/run_variant.py

          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path("_work/perf/before.json").read_text())
          current = json.loads(Path("_work/perf/current.json").read_text())
          rows = []
          for b, c in zip(before, current):
              rows.append({
                  "seed": b["seed"],
                  "before_states": b["explored_states"],
                  "current_states": c["explored_states"],
                  "state_gain_pct": (
                      (c["explored_states"] - b["explored_states"]) / max(1, b["explored_states"]) * 100.0
                  ),
                  "before_candidate_count": b["candidate_count"],
                  "current_candidate_count": c["candidate_count"],
                  "before_termination": b["termination_reason"],
                  "current_termination": c["termination_reason"],
              })
          Path("_work/perf/comparison.json").write_text(
              json.dumps(rows, indent=2, sort_keys=True), encoding="utf-8"
          )
          print("PERF_COMPARISON=" + json.dumps(rows, sort_keys=True))
          PY
      - name: Upload comparison
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: royal-scan-perf-${{ github.run_id }}
          path: _work/perf
          retention-days: 7
          if-no-files-found: error
