name: TEMP Arena Planner Recovery Fix

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-arena-planner-recovery-fix.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-ai-training-v2

      - name: Patch Arena planner recovery
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/training/arena.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
          '''from src.ai.action_planner import (\n    ActionApplicationError,\n    ActionPlanningError,\n    ActionSearchBudget,\n    InvalidActionPlanError,\n    StaleActionPlanError,\n    apply_action_plan,\n    engine_state_signature,\n)\n''',
          '''from src.ai.action_planner import (\n    AIActionPlan,\n    ActionApplicationError,\n    ActionPlanningError,\n    ActionSearchBudget,\n    InvalidActionPlanError,\n    MoveSpec,\n    StaleActionPlanError,\n    apply_action_plan,\n    engine_state_signature,\n)\n''',
          'planner imports',
          )

          helper_anchor = '''def evaluate_arena(\n'''
          recovery_helper = '''def _recover_incomplete_planner_action(\n    engine: FiveDEngine,\n    planning_error: ActionPlanningError,\n) -> tuple[str, AIActionPlan | None]:\n    \"\"\"Recover Arena liveness after the strict Planner wall budget expires.\n\n    The Planner's original result remains a genuine timeout. Arena then runs\n    the existing larger ActionSearch proof budget on this exceptional path. If\n    that search finds a canonical legal witness, the witness is replayed through\n    ``apply_action_plan`` and explicitly counted as a recovery. A complete\n    no-Action proof is adjudicated as terminal. Another inconclusive proof keeps\n    the original planning failure semantics.\n    \"\"\"\n    if not planning_error.incomplete:\n        return \"unresolved\", None\n\n    proof = ActionSearch(\n        max_states=4096,\n        max_depth=64,\n        max_seconds=15.0,\n    ).find_legal_completion(engine)\n\n    if proof.has_legal_action:\n        plan = AIActionPlan(\n            color=engine.current_turn_color,\n            moves=tuple(MoveSpec.from_move(move) for move in proof.witness),\n            start_signature=engine_state_signature(engine),\n            metadata={\n                \"candidate_count\": 1,\n                \"selected_index\": 0,\n                \"explored_states\": proof.explored_states,\n                \"search_complete\": not proof.exhausted,\n                \"arena_recovery\": True,\n                \"recovery_from_reason\": planning_error.reason,\n                \"recovery_search_termination_reason\": proof.termination_reason,\n                \"planner_explored_states\": planning_error.explored_states,\n            },\n            warning=(\n                \"Arena recovery Action after bounded planner \"\n                f\"{planning_error.reason}\"\n            ),\n        )\n        return \"witness\", plan\n\n    if proof.exhausted:\n        return \"unresolved\", None\n\n    outcome = OutcomeRules.classify_proven_no_legal_action(\n        engine,\n        engine.current_turn_color,\n        explored_states=proof.explored_states,\n    )\n    engine.game_state = (\n        GameState.CHECKMATE\n        if outcome.kind == OutcomeKind.CHECKMATE\n        else GameState.STALEMATE\n    )\n    return \"terminal\", None\n\n\n'''
          if text.count(helper_anchor) != 1:
              raise SystemExit('evaluate_arena anchor is not unique')
          text = text.replace(helper_anchor, recovery_helper + helper_anchor, 1)

          replace_once(
          '''    neural_planning_failures = baseline_planning_failures = 0\n    proven_terminal_adjudications = 0\n''',
          '''    neural_planning_failures = baseline_planning_failures = 0\n    planner_recoveries = neural_planner_recoveries = baseline_planner_recoveries = 0\n    proven_terminal_adjudications = 0\n''',
          'counter initialization',
          )

          replace_once(
          '''                if (\n                    isinstance(exc, ActionPlanningError)\n                    and exc.incomplete\n                    and _adjudicate_incomplete_planner_terminal(engine, exc)\n                ):\n                    proven_terminal_adjudications += 1\n                    break\n                if isinstance(exc, StaleActionPlanError):\n''',
          '''                recovery_traceback_text = None\n                if isinstance(exc, ActionPlanningError) and exc.incomplete:\n                    recovery_kind, recovery_plan = _recover_incomplete_planner_action(\n                        engine, exc\n                    )\n                    if recovery_kind == \"terminal\":\n                        proven_terminal_adjudications += 1\n                        break\n                    if recovery_kind == \"witness\" and recovery_plan is not None:\n                        plan = recovery_plan\n                        failure_stage = \"recovery_application\"\n                        try:\n                            apply_action_plan(engine, plan)\n                        except Exception as recovery_exc:\n                            exc = recovery_exc\n                            recovery_traceback_text = traceback.format_exc()\n                        else:\n                            completed_actions += 1\n                            planner_recoveries += 1\n                            if neural_turn:\n                                neural_planner_recoveries += 1\n                            else:\n                                baseline_planner_recoveries += 1\n                            all_candidate_counts.append(1)\n                            all_partial_candidate_searches += 1\n                            if neural_turn:\n                                neural_candidate_counts.append(1)\n                                neural_partial_candidate_searches += 1\n                            continue\n                if isinstance(exc, StaleActionPlanError):\n''',
          'planning recovery exception branch',
          )

          replace_once(
          '''                    traceback_text=traceback.format_exc(),\n''',
          '''                    traceback_text=(\n                        recovery_traceback_text or traceback.format_exc()\n                    ),\n''',
          'failure traceback',
          )

          replace_once(
          '''    if planning_failures != neural_planning_failures + baseline_planning_failures:\n        raise RuntimeError("Arena planning failure attribution invariant violated")\n''',
          '''    if planning_failures != neural_planning_failures + baseline_planning_failures:\n        raise RuntimeError("Arena planning failure attribution invariant violated")\n    if planner_recoveries != neural_planner_recoveries + baseline_planner_recoveries:\n        raise RuntimeError("Arena planner recovery attribution invariant violated")\n''',
          'recovery invariant',
          )

          replace_once(
          '''        "baseline_planning_failure_count": baseline_planning_failures,\n        "unexpected_failure_count": unexpected_failures,\n''',
          '''        "baseline_planning_failure_count": baseline_planning_failures,\n        "planner_recovery_count": planner_recoveries,\n        "neural_planner_recovery_count": neural_planner_recoveries,\n        "baseline_planner_recovery_count": baseline_planner_recoveries,\n        "unexpected_failure_count": unexpected_failures,\n''',
          'result recovery counters',
          )

          path.write_text(text, encoding='utf-8')

          test = Path('tests/test_arena_planner_recovery.py')
          test.write_text('''from types import SimpleNamespace\n\nimport src.training.arena as arena_module\nfrom src.ai.action_planner import AIActionPlan, ActionPlanningError\nfrom src.engine.action_search import ActionSearch\nfrom src.engine.coordinates import BoardCoord, Square5D\nfrom src.engine.move_generator import Move\nfrom src.engine.outcome_rules import OutcomeKind, OutcomeRules\nfrom src.engine.piece import Piece\nfrom src.training.arena import _recover_incomplete_planner_action\nfrom src.utils.constants import ChessColor, GameState, PieceType\n\n\nclass _Engine:\n    def __init__(self):\n        self.current_turn_color = ChessColor.WHITE\n        self.game_state = GameState.PLAYING\n\n\ndef _budget_error():\n    return ActionPlanningError(\n        \"time_budget\", incomplete=True, explored_states=321\n    )\n\n\ndef _move():\n    board = BoardCoord(0, 0, ChessColor.WHITE)\n    return Move(\n        piece=Piece(PieceType.KING, ChessColor.WHITE),\n        source=Square5D(board, 1, 1),\n        destination=Square5D(board, 1, 2),\n    )\n\n\ndef test_recovery_returns_canonical_plan_for_proven_witness(monkeypatch):\n    engine = _Engine()\n    monkeypatch.setattr(\n        ActionSearch,\n        \"find_legal_completion\",\n        lambda self, candidate: SimpleNamespace(\n            has_legal_action=True,\n            exhausted=False,\n            explored_states=777,\n            witness=(_move(),),\n            termination_reason=None,\n        ),\n    )\n    monkeypatch.setattr(\n        arena_module, \"engine_state_signature\", lambda candidate: (\"sig\",)\n    )\n\n    kind, plan = _recover_incomplete_planner_action(engine, _budget_error())\n\n    assert kind == \"witness\"\n    assert isinstance(plan, AIActionPlan)\n    assert len(plan.moves) == 1\n    assert plan.metadata[\"arena_recovery\"] is True\n    assert plan.metadata[\"planner_explored_states\"] == 321\n    assert engine.game_state == GameState.PLAYING\n\n\ndef test_recovery_keeps_failure_when_proof_is_inconclusive(monkeypatch):\n    engine = _Engine()\n    monkeypatch.setattr(\n        ActionSearch,\n        \"find_legal_completion\",\n        lambda self, candidate: SimpleNamespace(\n            has_legal_action=False,\n            exhausted=True,\n            explored_states=4096,\n            witness=(),\n            termination_reason=\"state_budget\",\n        ),\n    )\n\n    kind, plan = _recover_incomplete_planner_action(engine, _budget_error())\n\n    assert kind == \"unresolved\"\n    assert plan is None\n    assert engine.game_state == GameState.PLAYING\n\n\ndef test_recovery_adjudicates_complete_no_action_proof(monkeypatch):\n    engine = _Engine()\n    monkeypatch.setattr(\n        ActionSearch,\n        \"find_legal_completion\",\n        lambda self, candidate: SimpleNamespace(\n            has_legal_action=False,\n            exhausted=False,\n            explored_states=3955,\n            witness=(),\n            termination_reason=None,\n        ),\n    )\n    monkeypatch.setattr(\n        OutcomeRules,\n        \"classify_proven_no_legal_action\",\n        lambda engine, color, explored_states=0: SimpleNamespace(\n            kind=OutcomeKind.STALEMATE\n        ),\n    )\n\n    kind, plan = _recover_incomplete_planner_action(engine, _budget_error())\n\n    assert kind == \"terminal\"\n    assert plan is None\n    assert engine.game_state == GameState.STALEMATE\n''', encoding='utf-8')
          PY

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24" pytest

      - name: Run focused regressions
        run: |
          pytest -q \
            tests/test_arena_terminal_proof_fallback.py \
            tests/test_arena_planner_recovery.py \
            tests/test_action_planner_wall_budget.py \
            tests/test_action_planner_direct_completion.py
          python -m compileall -q src tests
          git diff --check

      - name: Commit production recovery fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/training/arena.py tests/test_arena_planner_recovery.py
          git diff --cached --check
          git commit -m "fix(arena): recover legal witness after planner timeout"
          git push origin HEAD:feat/local-ai-training-v2
