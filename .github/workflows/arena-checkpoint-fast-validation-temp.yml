name: TEMP Arena fast validation

on:
  push:
    branches: [feat/local-ai-training-v2]
    paths:
      - .github/workflows/arena-checkpoint-fast-validation-temp.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-arena-fast-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-arena:
    name: Validate two-game 5s Arena without profiler overhead
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"

      - name: Download run 33347901504 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-33347901504
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: "33347901504"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run two-game 5s Arena through action 60
        run: |
          mkdir -p _work/validation
          python -m src.training.arena \
            --checkpoint _work/checkpoint/best \
            --opponent easy \
            --games 2 \
            --planner-seconds 5.0 \
            --planner-actions 24 \
            --planner-states 256 \
            --planner-moves 32 \
            --device cpu \
            --seed 42 \
            --max-actions 60 \
            --max-wall-seconds 480 \
            --output json \
            --result-json _work/validation/arena-result.json \
            > _work/validation/arena-stdout.txt

      - name: Assert Arena health
        run: |
          cat _work/validation/arena-result.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('_work/validation/arena-result.json').read_text(encoding='utf-8'))
          failures = {
              'illegal_action_count': result.get('illegal_action_count'),
              'planning_failure_count': result.get('planning_failure_count'),
              'unexpected_failure_count': result.get('unexpected_failure_count'),
              'stale_failure_count': result.get('stale_failure_count'),
          }
          bad = {key: value for key, value in failures.items() if value}
          if result.get('first_failure') is not None:
              bad['first_failure'] = result['first_failure']
          if bad:
              raise SystemExit(f'Arena validation failed: {bad}')
          print('Arena validation passed:', json.dumps({
              'games': result.get('games'),
              'average_actions': result.get('average_actions'),
              'budget_termination_count': result.get('budget_termination_count'),
              'wins': result.get('wins'),
              'draws': result.get('draws'),
              'losses': result.get('losses'),
          }, sort_keys=True))
          PY

      - name: Upload validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: temp-arena-fast-validation-${{ github.run_id }}
          path: _work/validation
          retention-days: 3
          if-no-files-found: error
