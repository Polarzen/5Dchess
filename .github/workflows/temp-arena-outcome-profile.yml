name: TEMP Arena outcome and deepcopy profile

on:
  push:
    branches: [feat/local-ai-training-v2]
    paths:
      - .github/workflows/temp-arena-outcome-profile.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-arena-outcome-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-planner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-ai-training-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"
      - name: Download checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-33347901504
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: "33347901504"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Profile matching one-game Arena scenario
        shell: bash
        run: |
          set +e
          mkdir -p _work/profile
          python -m cProfile -o _work/profile/arena-5s.pstats -m src.training.arena \
            --checkpoint _work/checkpoint/best \
            --opponent easy \
            --games 1 \
            --planner-seconds 5.0 \
            --planner-actions 24 \
            --planner-states 256 \
            --planner-moves 32 \
            --device cpu \
            --seed 42 \
            --max-actions 40 \
            --max-wall-seconds 300 \
            --output json \
            --result-json _work/profile/arena-result.json \
            > _work/profile/arena-stdout.txt 2>&1
          echo "$?" > _work/profile/arena-exit.txt
          set -e
      - name: Render profile and deepcopy attribution
        run: |
          python - <<'PY'
          from pathlib import Path
          import pstats

          root = Path('_work/profile')
          stats_path = root / 'arena-5s.pstats'
          reports = [
              ('profile-cumulative.txt', 'cumulative', None),
              ('profile-action.txt', 'cumulative', 'action_planner'),
              ('profile-engine.txt', 'cumulative', 'engine.py'),
              ('profile-search.txt', 'cumulative', 'action_search'),
              ('profile-board.txt', 'cumulative', 'board.py'),
              ('profile-validator.txt', 'cumulative', 'move_validator'),
          ]
          for filename, order, pattern in reports:
              with (root / filename).open('w', encoding='utf-8') as fh:
                  stats = pstats.Stats(str(stats_path), stream=fh).strip_dirs().sort_stats(order)
                  if pattern is None:
                      stats.print_stats(180)
                  else:
                      stats.print_stats(pattern)
          with (root / 'profile-deepcopy-callers.txt').open('w', encoding='utf-8') as fh:
              pstats.Stats(str(stats_path), stream=fh).strip_dirs().sort_stats('cumulative').print_callers('deepcopy')
          with (root / 'profile-position-copy-callers.txt').open('w', encoding='utf-8') as fh:
              pstats.Stats(str(stats_path), stream=fh).strip_dirs().sort_stats('cumulative').print_callers('copy')
          PY
          echo '=== Arena result ==='
          cat _work/profile/arena-result.json || true
          echo '=== Arena exit ==='
          cat _work/profile/arena-exit.txt
          echo '=== deepcopy callers ==='
          cat _work/profile/profile-deepcopy-callers.txt
          echo '=== ActionPlanner ==='
          cat _work/profile/profile-action.txt
          echo '=== ActionSearch ==='
          cat _work/profile/profile-search.txt
          echo '=== Board copy ==='
          cat _work/profile/profile-board.txt
          echo '=== MoveValidator ==='
          cat _work/profile/profile-validator.txt
          echo '=== Top cumulative ==='
          head -n 130 _work/profile/profile-cumulative.txt
      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: temp-arena-outcome-profile-${{ github.run_id }}
          path: _work/profile
          retention-days: 3
          if-no-files-found: error
