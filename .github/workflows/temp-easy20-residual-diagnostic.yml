name: TEMP Easy20 Residual Diagnostic

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-easy20-residual-diagnostic.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-easy20-residual-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt
      - name: Install game and CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"
      - name: Download Stage 1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-stage1-500-34028226472
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: 34028226472
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate checkpoint shape
        run: python -m src.training.cloud check-resume --checkpoint _work/checkpoint/best --preset small
      - name: Probe optional-board prepass on seed 53
        run: |
          mkdir -p _work/residual-diagnostic
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          import src.training.arena as arena_module
          from src.ai.action_planner import (
              AIActionPlan,
              ActionPlanner,
              ActionSearchBudget,
              MoveSpec,
              _required_move_sort_key,
              engine_state_signature,
          )
          from src.engine.action import ActionRules
          from src.training.arena import evaluate_arena

          checkpoint = Path("_work/checkpoint/best")
          out_dir = Path("_work/residual-diagnostic")
          seed = 53
          planner_budget = ActionSearchBudget(
              max_states=1024,
              max_actions=24,
              max_move_depth=32,
              max_seconds=5.0,
          )
          child_budget = ActionSearchBudget(
              max_states=1024,
              max_actions=1,
              max_move_depth=64,
              max_seconds=1.5,
          )

          original_recover = arena_module._recover_incomplete_planner_action
          traces = []

          def optional_prepass_recover(engine, planning_error):
              action = engine._ensure_current_action()
              required = set(ActionRules.required_boards(
                  action, engine.timeline_manager.timelines
              ))
              movable = tuple(ActionRules.movable_boards(
                  action, engine.timeline_manager.timelines
              ))
              optional = tuple(board for board in movable if board not in required)
              trace = {
                  "ply": engine.move_counter,
                  "required": [str(board) for board in sorted(required)],
                  "optional": [str(board) for board in optional],
                  "planner_reason": planning_error.reason,
                  "planner_explored_states": planning_error.explored_states,
                  "attempts": [],
              }
              started = time.monotonic()

              if planning_error.incomplete and optional:
                  optional_moves = []
                  for board in optional:
                      position = engine._resolve_position(board)
                      if position is None:
                          continue
                      optional_moves.extend(engine.get_legal_moves(position))
                  optional_moves = sorted(
                      optional_moves,
                      key=lambda move: _required_move_sort_key(move, required),
                  )[:24]

                  for move in optional_moves:
                      child = engine.clone_for_simulation()
                      if not child.execute_action_move(move):
                          continue
                      probe_started = time.monotonic()
                      result = ActionPlanner(child_budget).search(child)
                      attempt = {
                          "source": str(move.source),
                          "destination": str(move.destination),
                          "branching": bool(move.is_branching),
                          "cross_timeline": bool(move.is_cross_timeline),
                          "explored_states": result.explored_states,
                          "termination_reason": result.termination_reason,
                          "candidate_count": len(result.candidates),
                          "elapsed_seconds": time.monotonic() - probe_started,
                      }
                      trace["attempts"].append(attempt)
                      if result.candidates:
                          selected = (MoveSpec.from_move(move),) + tuple(result.candidates[0])
                          plan = AIActionPlan(
                              color=engine.current_turn_color,
                              moves=selected,
                              start_signature=engine_state_signature(engine),
                              metadata={
                                  "candidate_count": 1,
                                  "selected_index": 0,
                                  "explored_states": result.explored_states,
                                  "search_complete": not result.exhausted,
                                  "arena_recovery": True,
                                  "arena_recovery_engine": "optional_prepass+ActionPlanner",
                                  "recovery_from_reason": planning_error.reason,
                                  "recovery_search_termination_reason": result.termination_reason,
                                  "planner_explored_states": planning_error.explored_states,
                                  "optional_prepass_attempts": len(trace["attempts"]),
                              },
                              warning=(
                                  "Arena optional-board prepass recovery after bounded planner "
                                  f"{planning_error.reason}"
                              ),
                          )
                          trace["kind"] = "witness"
                          trace["elapsed_seconds"] = time.monotonic() - started
                          trace["move_count"] = len(selected)
                          traces.append(trace)
                          return "witness", plan

              kind, plan = original_recover(engine, planning_error)
              trace["kind"] = kind
              trace["elapsed_seconds"] = time.monotonic() - started
              trace["move_count"] = len(plan.moves) if plan is not None else None
              traces.append(trace)
              return kind, plan

          arena_module._recover_incomplete_planner_action = optional_prepass_recover
          started = time.monotonic()
          result = evaluate_arena(
              checkpoint=checkpoint,
              opponent="easy",
              games=1,
              device_name="cpu",
              seed=42,
              max_actions=120,
              budget=planner_budget,
              max_wall_seconds=900,
              output="json",
              model_color="black",
              game_seeds=[seed],
          )
          summary = {
              "experiment": "one optional-board Move before canonical ActionPlanner completion",
              "seed": seed,
              "planner_budget": {"states":1024,"actions":24,"moves":32,"seconds":5.0},
              "child_budget": {"states":1024,"actions":1,"moves":64,"seconds":1.5},
              "result": result,
              "traces": traces,
              "wall_seconds": time.monotonic() - started,
          }
          (out_dir / "optional-prepass-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True), encoding="utf-8"
          )
          print("OPTIONAL_PREPASS_SUMMARY=" + json.dumps({
              "planning_failures": result["planning_failure_count"],
              "recoveries": result["planner_recovery_count"],
              "traces": traces,
          }, sort_keys=True))
          PY
      - name: Upload diagnostic artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: easy20-optional-prepass-diagnostic-${{ github.run_id }}
          path: _work/residual-diagnostic
          retention-days: 7
          if-no-files-found: warn
