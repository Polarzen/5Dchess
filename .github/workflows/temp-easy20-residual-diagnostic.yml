name: TEMP Easy20 Residual Diagnostic

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-easy20-residual-diagnostic.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-easy20-residual-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt
      - name: Install game and CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"
      - name: Download Stage 1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-stage1-500-34028226472
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: 34028226472
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate checkpoint shape
        run: python -m src.training.cloud check-resume --checkpoint _work/checkpoint/best --preset small
      - name: Apply runner-only early failed-state lookup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/ai/action_planner.py")
          text = p.read_text(encoding="utf-8")
          old_head = "        found_completion = False\n\n        # A non-empty required set proves that The Present still belongs to the\n"
          new_head = "        found_completion = False\n\n        # Check the failure-only transposition cache before royal safety.\n        key = ActionSearch._state_key(state)\n        if tracker.check_time():\n            return False\n        if key in failed_states:\n            tracker.failed_state_cache_hits += 1\n            return False\n\n        # A non-empty required set proves that The Present still belongs to the\n"
          old_late = "        # Reuse the engine ActionSearch equivalence relation, whose regression\n        # tests prove that Position.move_number and commuting Action Move order\n        # do not affect future rule semantics.  This is deliberately a failed-\n        # state cache rather than a general visited set: successful states remain\n        # searchable so ordered candidate Actions and evaluator semantics are\n        # unchanged.  The cache is scoped to this one plan() call.\n        key = ActionSearch._state_key(state)\n        if tracker.check_time():\n            return found_completion\n        if key in failed_states:\n            tracker.failed_state_cache_hits += 1\n            return found_completion\n\n        tracker.explored_states += 1\n"
          new_late = "        # The failure-only transposition key was checked above before the\n        # potentially expensive canonical submission predicate.\n        tracker.explored_states += 1\n"
          if text.count(old_head) != 1 or text.count(old_late) != 1:
              raise SystemExit(f"planner anchors head={text.count(old_head)} late={text.count(old_late)}")
          p.write_text(text.replace(old_head, new_head, 1).replace(old_late, new_late, 1), encoding="utf-8")
          PY
          python -m py_compile src/ai/action_planner.py
      - name: Run focused planner regressions
        run: |
          python -m pytest -q \
            tests/test_ai_action_planning.py \
            tests/test_action_planner_direct_completion.py \
            tests/test_action_planner_ordering.py \
            tests/test_action_planner_transposition.py \
            tests/test_royal_rules.py
      - name: Run residual seeds with unchanged production budgets
        run: |
          mkdir -p _work/residual-diagnostic
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          from src.ai.action_planner import ActionSearchBudget
          from src.training.arena import evaluate_arena
          checkpoint = Path("_work/checkpoint/best")
          out_dir = Path("_work/residual-diagnostic")
          seeds = [51, 53, 55]
          budget = ActionSearchBudget(max_states=1024, max_actions=24, max_move_depth=32, max_seconds=5.0)
          rows = []
          for seed in seeds:
              started = time.monotonic()
              result = evaluate_arena(checkpoint=checkpoint, opponent="easy", games=1, device_name="cpu", seed=42, max_actions=120, budget=budget, max_wall_seconds=900, output="json", model_color="black", game_seeds=[seed])
              row = {"seed": seed, "result": result, "wall_seconds": time.monotonic() - started}
              rows.append(row)
              print("EARLY_CACHE_RESULT=" + json.dumps({"seed": seed, "planning_failures": result["planning_failure_count"], "recoveries": result["planner_recovery_count"], "terminal_proofs": result["proven_terminal_adjudication_count"], "first_failure": result.get("first_failure"), "wall_seconds": row["wall_seconds"]}, sort_keys=True))
          summary = {"experiment": "check failed-state transposition before can_submit royal-safety scan", "planner_budget": {"states":1024,"actions":24,"moves":32,"seconds":5.0}, "seeds": seeds, "failed_seeds": [row["seed"] for row in rows if row["result"]["planning_failure_count"]], "passed_seeds": [row["seed"] for row in rows if not row["result"]["planning_failure_count"]], "rows": rows}
          (out_dir / "early-failed-state-cache.json").write_text(json.dumps(summary, indent=2, sort_keys=True), encoding="utf-8")
          print("EARLY_CACHE_SUMMARY=" + json.dumps({"failed_seeds": summary["failed_seeds"], "passed_seeds": summary["passed_seeds"]}, sort_keys=True))
          PY
      - name: Upload diagnostic artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: easy20-early-failed-state-cache-${{ github.run_id }}
          path: _work/residual-diagnostic
          retention-days: 7
          if-no-files-found: warn
