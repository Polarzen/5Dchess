name: TEMP Easy20 Residual Diagnostic

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-easy20-residual-diagnostic.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-easy20-residual-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt
      - name: Install game and CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"
      - name: Download Stage 1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-stage1-500-34028226472
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: 34028226472
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate checkpoint shape
        run: python -m src.training.cloud check-resume --checkpoint _work/checkpoint/best --preset small
      - name: Probe royal-safety rescue moves on seed 53
        run: |
          mkdir -p _work/residual-diagnostic
          python - <<'PY'
          from pathlib import Path
          p = Path("src/ai/action_planner.py")
          text = p.read_text(encoding="utf-8")
          anchor = "        ordered_boards = tuple(\n"
          insert = (
              "        optional_first = (\n"
              "            len(required) == 2\n"
              "            and any(board not in required for board in movable)\n"
              "        )\n"
              "        ordered_boards = tuple(\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit(f"ordered_boards anchor count={text.count(anchor)}")
          text = text.replace(anchor, insert, 1)
          board_key = "                    board not in required,\n"
          replacement = "                    board in required if optional_first else board not in required,\n"
          if text.count(board_key) != 1:
              raise SystemExit(f"board key count={text.count(board_key)}")
          text = text.replace(board_key, replacement, 1)
          special = "        if len(required) == 2:\n            required_moves: list[Move] = []\n"
          replacement = "        if len(required) == 2 and not optional_first:\n            required_moves: list[Move] = []\n"
          if text.count(special) != 1:
              raise SystemExit(f"len2 count={text.count(special)}")
          p.write_text(text.replace(special, replacement, 1), encoding="utf-8")
          PY
          python -m py_compile src/ai/action_planner.py
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          import src.training.arena as arena_module
          from src.ai.action_planner import ActionSearchBudget, _required_move_sort_key
          from src.engine.action import ActionRules
          from src.engine.engine import FiveDEngine
          from src.training.arena import evaluate_arena

          checkpoint = Path("_work/checkpoint/best")
          out_dir = Path("_work/residual-diagnostic")
          planner_budget = ActionSearchBudget(max_states=1024, max_actions=24, max_move_depth=32, max_seconds=5.0)
          original_can_submit = FiveDEngine.can_submit_action
          unsafe_rows = []
          rescue_witness = None
          in_probe = False

          def board_key(board):
              side = getattr(board.side, "value", board.side)
              return (board.timeline, board.turn, str(side))

          def move_row(move):
              return {
                  "source": str(move.source),
                  "destination": str(move.destination),
                  "branching": bool(move.is_branching),
                  "cross_timeline": bool(move.is_cross_timeline),
              }

          def traced_can_submit(self):
              global in_probe, rescue_witness
              result = original_can_submit(self)
              if result or in_probe or len(unsafe_rows) >= 4:
                  return result
              action = self._ensure_current_action()
              required = set(ActionRules.required_boards(action, self.timeline_manager.timelines))
              if required:
                  return result

              row = {
                  "path_len": len(action.moves),
                  "path": [move_row(m) for m in action.moves],
                  "movable": [],
                  "moves_checked": 0,
                  "rescue": None,
              }
              unsafe_rows.append(row)
              in_probe = True
              try:
                  movable = sorted(
                      ActionRules.movable_boards(action, self.timeline_manager.timelines),
                      key=board_key,
                  )
                  row["movable"] = [str(b) for b in movable]
                  for board in movable:
                      position = self._resolve_position(board)
                      if position is None:
                          continue
                      moves = sorted(
                          self.get_legal_moves(position),
                          key=lambda m: _required_move_sort_key(m, set()),
                      )
                      for move in moves:
                          if row["moves_checked"] >= 160:
                              break
                          row["moves_checked"] += 1
                          child = self.clone_for_simulation()
                          if not child.execute_action_move(move):
                              continue
                          child_action = child._ensure_current_action()
                          if ActionRules.required_boards(child_action, child.timeline_manager.timelines):
                              continue
                          if original_can_submit(child):
                              row["rescue"] = move_row(move)
                              rescue_witness = {
                                  "prefix": row["path"],
                                  "rescue": row["rescue"],
                              }
                              break
                      if row["rescue"] is not None or row["moves_checked"] >= 160:
                          break
              finally:
                  in_probe = False
              return result

          FiveDEngine.can_submit_action = traced_can_submit
          arena_module._recover_incomplete_planner_action = lambda engine, err: ("unresolved", None)
          started = time.monotonic()
          result = evaluate_arena(
              checkpoint=checkpoint,
              opponent="easy",
              games=1,
              device_name="cpu",
              seed=42,
              max_actions=120,
              budget=planner_budget,
              max_wall_seconds=900,
              output="json",
              model_color="black",
              game_seeds=[53],
          )
          summary = {
              "result": result,
              "unsafe_zero_required_states": unsafe_rows,
              "rescue_witness": rescue_witness,
              "wall_seconds": time.monotonic() - started,
          }
          (out_dir / "royal-rescue-probe.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True), encoding="utf-8"
          )
          print("ROYAL_RESCUE_PROBE=" + json.dumps({
              "first_failure": result.get("first_failure"),
              "unsafe_states": unsafe_rows,
              "rescue_witness": rescue_witness,
          }, sort_keys=True))
          PY
      - name: Upload diagnostic artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: easy20-royal-rescue-probe-${{ github.run_id }}
          path: _work/residual-diagnostic
          retention-days: 7
          if-no-files-found: warn
