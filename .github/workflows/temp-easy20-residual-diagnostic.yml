name: TEMP Easy20 Residual Diagnostic

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-easy20-residual-diagnostic.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-easy20-residual-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt
      - name: Install game and CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"
      - name: Download Stage 1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-stage1-500-34028226472
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: 34028226472
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate checkpoint shape
        run: python -m src.training.cloud check-resume --checkpoint _work/checkpoint/best --preset small
      - name: Apply runner-only irreversible-threat prune
        run: |
          python - <<'PY'
          from pathlib import Path

          planner = Path("src/ai/action_planner.py")
          text = planner.read_text(encoding="utf-8")
          start = text.index("        if not required and state.can_submit_action():\n")
          end = text.index("        if tracker.check(depth):\n", start)
          replacement = "\n".join([
              "        if not required:",
              "            submit_capable = state.can_submit_action()",
              "            if tracker.check_time():",
              "                return False",
              "            if submit_capable:",
              "                candidates.append(path)",
              "                tracker.explored_actions += 1",
              "                found_completion = True",
              "                if (",
              "                    self.budget.max_actions is not None",
              "                    and tracker.explored_actions >= self.budget.max_actions",
              "                ):",
              "                    tracker.termination_reason = \"action_budget\"",
              "                    return True",
              "            else:",
              "                from src.engine.timeline_rules import TimelineRules",
              "                present = TimelineRules.present(state.timeline_manager.timelines)",
              "                if present is not None and present.side != action.color:",
              "                    return False",
              "",
          ])
          planner.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          search = Path("src/engine/action_search.py")
          text = search.read_text(encoding="utf-8")
          start = text.index("        if (\n            not required\n            and ActionRules.can_submit(action, state.timeline_manager.timelines)\n        ):\n")
          end = text.index("        if self._budget_exhausted(depth):\n", start)
          replacement = "\n".join([
              "        if not required:",
              "            submit_capable = ActionRules.can_submit(",
              "                action,",
              "                state.timeline_manager.timelines,",
              "            )",
              "            if submit_capable:",
              "                return tuple(action.moves)",
              "            from src.engine.timeline_rules import TimelineRules",
              "            present = TimelineRules.present(state.timeline_manager.timelines)",
              "            if present is not None and present.side != action.color:",
              "                return None",
              "",
          ])
          search.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
          python -m py_compile src/ai/action_planner.py src/engine/action_search.py
      - name: Run focused rule and planner regressions
        run: |
          python -m pytest -q \
            tests/test_ai_action_planning.py \
            tests/test_action_planner_direct_completion.py \
            tests/test_action_planner_ordering.py \
            tests/test_action_planner_transposition.py \
            tests/test_action_search_submit_shortcut.py \
            tests/test_checkmate_stalemate.py \
            tests/test_royal_rules.py
      - name: Run residual seeds with unchanged production budgets
        run: |
          mkdir -p _work/residual-diagnostic
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          from src.ai.action_planner import ActionSearchBudget
          from src.training.arena import evaluate_arena

          checkpoint = Path("_work/checkpoint/best")
          out_dir = Path("_work/residual-diagnostic")
          seeds = [51, 53, 55]
          budget = ActionSearchBudget(
              max_states=1024,
              max_actions=24,
              max_move_depth=32,
              max_seconds=5.0,
          )
          rows = []
          for seed in seeds:
              started = time.monotonic()
              result = evaluate_arena(
                  checkpoint=checkpoint,
                  opponent="easy",
                  games=1,
                  device_name="cpu",
                  seed=42,
                  max_actions=120,
                  budget=budget,
                  max_wall_seconds=900,
                  output="json",
                  model_color="black",
                  game_seeds=[seed],
              )
              rows.append({
                  "seed": seed,
                  "result": result,
                  "wall_seconds": time.monotonic() - started,
              })
              print("PRUNE_RESULT=" + json.dumps({
                  "seed": seed,
                  "planning_failures": result["planning_failure_count"],
                  "recoveries": result["planner_recovery_count"],
                  "terminal_proofs": result["proven_terminal_adjudication_count"],
                  "first_failure": result.get("first_failure"),
              }, sort_keys=True))
          summary = {
              "experiment": "prune irreversible direct royal threat after Present progress completes",
              "planner_budget": {"states":1024,"actions":24,"moves":32,"seconds":5.0},
              "seeds": seeds,
              "failed_seeds": [row["seed"] for row in rows if row["result"]["planning_failure_count"]],
              "passed_seeds": [row["seed"] for row in rows if not row["result"]["planning_failure_count"]],
              "rows": rows,
          }
          (out_dir / "irreversible-threat-prune.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True), encoding="utf-8"
          )
          print("PRUNE_SUMMARY=" + json.dumps({
              "failed_seeds": summary["failed_seeds"],
              "passed_seeds": summary["passed_seeds"],
          }, sort_keys=True))
          PY
      - name: Upload diagnostic artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: easy20-irreversible-threat-prune-${{ github.run_id }}
          path: _work/residual-diagnostic
          retention-days: 7
          if-no-files-found: warn
