name: TEMP Easy20 Residual Diagnostic

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-easy20-residual-diagnostic.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-easy20-residual-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt
      - name: Install game and CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"
      - name: Download Stage 1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-stage1-500-34028226472
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: 34028226472
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate checkpoint shape
        run: python -m src.training.cloud check-resume --checkpoint _work/checkpoint/best --preset small
      - name: Test generalized required-board ordering on residual seeds
        run: |
          mkdir -p _work/residual-diagnostic
          python - <<'PY'
          from pathlib import Path
          p = Path("src/engine/action_search.py")
          text = p.read_text(encoding="utf-8")
          old = "        if len(required) == 2:\n"
          if text.count(old) != 1:
              raise SystemExit(f"ordering anchor count={text.count(old)}")
          p.write_text(text.replace(old, "        if len(required) >= 2:\n", 1), encoding="utf-8")
          PY
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          import src.training.arena as arena_module
          from src.ai.action_planner import ActionSearchBudget
          from src.engine.action import ActionRules
          from src.training.arena import evaluate_arena

          checkpoint = Path("_work/checkpoint/best")
          out_dir = Path("_work/residual-diagnostic")
          seeds = [51, 53, 55]
          planner_budget = ActionSearchBudget(
              max_states=1024,
              max_actions=24,
              max_move_depth=32,
              max_seconds=5.0,
          )

          original_recover = arena_module._recover_incomplete_planner_action
          active_trace = None

          def traced_recover(engine, planning_error):
              global active_trace
              action = engine._ensure_current_action()
              required = tuple(ActionRules.required_boards(
                  action, engine.timeline_manager.timelines
              ))
              movable = tuple(ActionRules.movable_boards(
                  action, engine.timeline_manager.timelines
              ))
              started = time.monotonic()
              kind, plan = original_recover(engine, planning_error)
              elapsed = time.monotonic() - started
              if active_trace is not None:
                  active_trace.append({
                      "player": engine.current_turn_color.name,
                      "ply": engine.move_counter,
                      "timeline_count": len(engine.timeline_manager.timelines),
                      "required_count": len(required),
                      "required": [str(board) for board in required],
                      "movable_count": len(movable),
                      "movable": [str(board) for board in movable],
                      "planner_reason": planning_error.reason,
                      "planner_explored_states": planning_error.explored_states,
                      "recovery_kind": kind,
                      "recovery_elapsed_seconds": elapsed,
                      "recovery_move_count": len(plan.moves) if plan is not None else None,
                      "recovery_metadata": dict(plan.metadata) if plan is not None else None,
                  })
              return kind, plan

          arena_module._recover_incomplete_planner_action = traced_recover

          rows = []
          for seed in seeds:
              trace = []
              active_trace = trace
              started = time.monotonic()
              result = evaluate_arena(
                  checkpoint=checkpoint,
                  opponent="easy",
                  games=1,
                  device_name="cpu",
                  seed=42,
                  max_actions=120,
                  budget=planner_budget,
                  max_wall_seconds=900,
                  output="json",
                  model_color="black",
                  game_seeds=[seed],
              )
              wall = time.monotonic() - started
              row = {
                  "seed": seed,
                  "result": result,
                  "recovery_trace": trace,
                  "wall_seconds": wall,
              }
              rows.append(row)
              print("ORDERING_RESULT=" + json.dumps({
                  "seed": seed,
                  "planning_failures": result["planning_failure_count"],
                  "recoveries": result["planner_recovery_count"],
                  "first_failure": result.get("first_failure"),
                  "recovery_trace": trace,
                  "wall_seconds": wall,
              }, sort_keys=True))

          summary = {
              "experiment": "ActionSearch global required-board move queue for len(required)>=2",
              "planner_budget": {"states":1024,"actions":24,"moves":32,"seconds":5.0},
              "recovery_budget": {"states":4096,"depth":64,"seconds":15.0},
              "seeds": seeds,
              "rows": rows,
              "failed_seeds": [
                  row["seed"] for row in rows
                  if row["result"]["planning_failure_count"]
              ],
              "passed_seeds": [
                  row["seed"] for row in rows
                  if row["result"]["planning_failure_count"] == 0
              ],
          }
          (out_dir / "ordering-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True), encoding="utf-8"
          )
          print("ORDERING_SUMMARY=" + json.dumps({
              "failed_seeds": summary["failed_seeds"],
              "passed_seeds": summary["passed_seeds"],
          }, sort_keys=True))
          PY
      - name: Upload diagnostic artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: easy20-ordering-diagnostic-${{ github.run_id }}
          path: _work/residual-diagnostic
          retention-days: 7
          if-no-files-found: warn
