name: TEMP Easy20 Residual Diagnostic

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-easy20-residual-diagnostic.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-easy20-residual-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt
      - name: Install game and CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"
      - name: Download Stage 1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-stage1-500-34028226472
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: 34028226472
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate checkpoint shape
        run: python -m src.training.cloud check-resume --checkpoint _work/checkpoint/best --preset small
      - name: Profile fixed seed53 planner timeout
        run: |
          mkdir -p _work/residual-diagnostic
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          import src.training.arena as arena_module
          from src.ai.action_planner import ActionPlanner, ActionSearchBudget
          from src.engine.action import ActionRules
          from src.engine.action_search import ActionSearch
          from src.engine.engine import FiveDEngine
          from src.engine.royal_rules import RoyalRules
          from src.training.arena import evaluate_arena

          checkpoint = Path("_work/checkpoint/best")
          out_dir = Path("_work/residual-diagnostic")
          budget = ActionSearchBudget(
              max_states=1024,
              max_actions=24,
              max_move_depth=32,
              max_seconds=5.0,
          )

          metric_names = (
              "can_submit_action",
              "is_action_safe",
              "clone_for_simulation",
              "get_legal_moves",
              "execute_action_move",
              "required_boards",
              "movable_boards",
              "state_key",
          )
          active = None
          failure_profiles = []

          def new_metrics():
              return {name: {"calls": 0, "seconds": 0.0} for name in metric_names}

          def timed(name, fn):
              def wrapper(*args, **kwargs):
                  started = time.perf_counter()
                  try:
                      return fn(*args, **kwargs)
                  finally:
                      if active is not None:
                          item = active[name]
                          item["calls"] += 1
                          item["seconds"] += time.perf_counter() - started
              return wrapper

          FiveDEngine.can_submit_action = timed(
              "can_submit_action", FiveDEngine.can_submit_action
          )
          FiveDEngine.clone_for_simulation = timed(
              "clone_for_simulation", FiveDEngine.clone_for_simulation
          )
          FiveDEngine.get_legal_moves = timed(
              "get_legal_moves", FiveDEngine.get_legal_moves
          )
          FiveDEngine.execute_action_move = timed(
              "execute_action_move", FiveDEngine.execute_action_move
          )
          RoyalRules.is_action_safe = timed(
              "is_action_safe", RoyalRules.is_action_safe
          )
          ActionRules.required_boards = staticmethod(timed(
              "required_boards", ActionRules.required_boards
          ))
          ActionRules.movable_boards = staticmethod(timed(
              "movable_boards", ActionRules.movable_boards
          ))
          ActionSearch._state_key = staticmethod(timed(
              "state_key", ActionSearch._state_key
          ))

          original_search = ActionPlanner.search

          def profiled_search(self, engine):
              global active
              previous = active
              metrics = new_metrics()
              active = metrics
              started = time.perf_counter()
              try:
                  result = original_search(self, engine)
              finally:
                  elapsed = time.perf_counter() - started
                  active = previous
              if not result.candidates and result.termination_reason is not None:
                  action = engine._ensure_current_action()
                  required = ActionRules.required_boards(
                      action, engine.timeline_manager.timelines
                  )
                  movable = ActionRules.movable_boards(
                      action, engine.timeline_manager.timelines
                  )
                  profile = {
                      "player": engine.current_turn_color.value,
                      "ply": engine.move_counter,
                      "timeline_count": len(engine.timeline_manager.timelines),
                      "state_signature_sha256": arena_module._state_signature_sha256(engine),
                      "required_count": len(required),
                      "movable_count": len(movable),
                      "termination_reason": result.termination_reason,
                      "explored_states": result.explored_states,
                      "failed_state_cache_hits": result.failed_state_cache_hits,
                      "elapsed_seconds": elapsed,
                      "metrics": metrics,
                  }
                  failure_profiles.append(profile)
                  print("PLANNER_PROFILE=" + json.dumps(profile, sort_keys=True))
              return result

          ActionPlanner.search = profiled_search

          started = time.monotonic()
          result = evaluate_arena(
              checkpoint=checkpoint,
              opponent="easy",
              games=1,
              device_name="cpu",
              seed=42,
              max_actions=120,
              budget=budget,
              max_wall_seconds=900,
              output="json",
              model_color="black",
              game_seeds=[53],
          )
          summary = {
              "experiment": "seed53 per-plan planner hotspot counters",
              "planner_budget": {"states":1024,"actions":24,"moves":32,"seconds":5.0},
              "result": result,
              "failure_profiles": failure_profiles,
              "wall_seconds": time.monotonic() - started,
          }
          (out_dir / "seed53-planner-profile.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True), encoding="utf-8"
          )
          print("PROFILE_SUMMARY=" + json.dumps({
              "planning_failures": result["planning_failure_count"],
              "profile_count": len(failure_profiles),
              "first_failure": result.get("first_failure"),
          }, sort_keys=True))
          PY
      - name: Upload diagnostic artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: seed53-planner-profile-${{ github.run_id }}
          path: _work/residual-diagnostic
          retention-days: 7
          if-no-files-found: warn
