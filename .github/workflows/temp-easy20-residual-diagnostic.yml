name: TEMP Easy20 Residual Diagnostic

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-easy20-residual-diagnostic.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-easy20-residual-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt
      - name: Install game and CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"
      - name: Download Stage 1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-stage1-500-34028226472
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: 34028226472
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate checkpoint shape
        run: python -m src.training.cloud check-resume --checkpoint _work/checkpoint/best --preset small
      - name: Probe L3 canonical two-move witnesses on seed 53
        run: |
          mkdir -p _work/residual-diagnostic
          python - <<'PY'
          from pathlib import Path

          p = Path("src/ai/action_planner.py")
          text = p.read_text(encoding="utf-8")
          anchor = "        ordered_boards = tuple(\n"
          insert = (
              "        optional_first = (\n"
              "            len(required) == 2\n"
              "            and any(board not in required for board in movable)\n"
              "        )\n"
              "        ordered_boards = tuple(\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit(f"ordered_boards anchor count={text.count(anchor)}")
          text = text.replace(anchor, insert, 1)
          board_key = "                    board not in required,\n"
          board_key_new = (
              "                    board in required if optional_first "
              "else board not in required,\n"
          )
          if text.count(board_key) != 1:
              raise SystemExit(f"board-key anchor count={text.count(board_key)}")
          text = text.replace(board_key, board_key_new, 1)
          special = "        if len(required) == 2:\n            required_moves: list[Move] = []\n"
          special_new = (
              "        if len(required) == 2 and not optional_first:\n"
              "            required_moves: list[Move] = []\n"
          )
          if text.count(special) != 1:
              raise SystemExit(f"len2 anchor count={text.count(special)}")
          text = text.replace(special, special_new, 1)
          p.write_text(text, encoding="utf-8")
          PY
          python -m py_compile src/ai/action_planner.py
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          import src.training.arena as arena_module
          from src.ai.action_planner import ActionSearchBudget, _required_move_sort_key
          from src.engine.action import ActionRules
          from src.training.arena import evaluate_arena

          checkpoint = Path("_work/checkpoint/best")
          out_dir = Path("_work/residual-diagnostic")
          planner_budget = ActionSearchBudget(max_states=1024, max_actions=24, max_move_depth=32, max_seconds=5.0)
          traces = []

          def board_key(board):
              side = getattr(board.side, "value", board.side)
              return (board.timeline, board.turn, str(side))

          def move_row(move):
              return {
                  "source": str(move.source),
                  "destination": str(move.destination),
                  "branching": bool(move.is_branching),
                  "cross_timeline": bool(move.is_cross_timeline),
              }

          def traced_recover(engine, planning_error):
              action = engine._ensure_current_action()
              required = set(ActionRules.required_boards(action, engine.timeline_manager.timelines))
              movable = tuple(ActionRules.movable_boards(action, engine.timeline_manager.timelines))
              optional = sorted((b for b in movable if b not in required), key=board_key)
              l3_boards = [b for b in optional if b.timeline == 3]
              probes = []
              witness = None
              started = time.monotonic()

              for board in l3_boards:
                  position = engine._resolve_position(board)
                  if position is None:
                      continue
                  first_moves = sorted(engine.get_legal_moves(position), key=lambda m: _required_move_sort_key(m, required))
                  for first in first_moves:
                      child = engine.clone_for_simulation()
                      if not child.execute_action_move(first):
                          continue
                      child_action = child._ensure_current_action()
                      child_required = set(ActionRules.required_boards(child_action, child.timeline_manager.timelines))
                      if len(child_required) >= len(required):
                          continue
                      row = {
                          "first": move_row(first),
                          "child_required": [str(b) for b in sorted(child_required, key=board_key)],
                          "second_moves_checked": 0,
                          "submit_checks": 0,
                          "found": False,
                      }
                      probes.append(row)
                      if len(child_required) != 1:
                          continue
                      remaining = next(iter(child_required))
                      remaining_position = child._resolve_position(remaining)
                      if remaining_position is None:
                          continue
                      second_moves = sorted(child.get_legal_moves(remaining_position), key=lambda m: _required_move_sort_key(m, child_required))
                      for second in second_moves:
                          row["second_moves_checked"] += 1
                          grandchild = child.clone_for_simulation()
                          if not grandchild.execute_action_move(second):
                              continue
                          grand_action = grandchild._ensure_current_action()
                          if ActionRules.required_boards(grand_action, grandchild.timeline_manager.timelines):
                              continue
                          row["submit_checks"] += 1
                          if grandchild.can_submit_action():
                              row["found"] = True
                              row["second"] = move_row(second)
                              witness = {"first": move_row(first), "second": move_row(second)}
                              break
                      if witness is not None:
                          break
                  if witness is not None:
                      break

              traces.append({
                  "ply": engine.move_counter,
                  "required": [str(b) for b in sorted(required, key=board_key)],
                  "optional": [str(b) for b in optional],
                  "l3_boards": [str(b) for b in l3_boards],
                  "probe_elapsed_seconds": time.monotonic() - started,
                  "probes": probes,
                  "two_move_witness": witness,
              })
              return "unresolved", None

          arena_module._recover_incomplete_planner_action = traced_recover
          result = evaluate_arena(
              checkpoint=checkpoint,
              opponent="easy",
              games=1,
              device_name="cpu",
              seed=42,
              max_actions=120,
              budget=planner_budget,
              max_wall_seconds=900,
              output="json",
              model_color="black",
              game_seeds=[53],
          )
          summary = {"result": result, "traces": traces}
          (out_dir / "l3-two-move-probe.json").write_text(json.dumps(summary, indent=2, sort_keys=True), encoding="utf-8")
          print("L3_TWO_MOVE_PROBE=" + json.dumps({"first_failure": result.get("first_failure"), "traces": traces}, sort_keys=True))
          PY
      - name: Upload diagnostic artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: easy20-l3-two-move-probe-${{ github.run_id }}
          path: _work/residual-diagnostic
          retention-days: 7
          if-no-files-found: warn
