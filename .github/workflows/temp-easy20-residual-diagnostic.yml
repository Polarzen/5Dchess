name: TEMP Easy20 Residual Diagnostic

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-easy20-residual-diagnostic.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-easy20-residual-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt
      - name: Install game and CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"
      - name: Download Stage 1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-stage1-500-34028226472
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: 34028226472
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate checkpoint shape
        run: python -m src.training.cloud check-resume --checkpoint _work/checkpoint/best --preset small
      - name: Probe optional residual moves on seed 53
        run: |
          mkdir -p _work/residual-diagnostic
          python - <<'PY'
          from pathlib import Path

          p = Path("src/ai/action_planner.py")
          text = p.read_text(encoding="utf-8")
          anchor = "        ordered_boards = tuple(\n"
          insert = (
              "        optional_first = (\n"
              "            len(required) == 2\n"
              "            and any(board not in required for board in movable)\n"
              "        )\n"
              "        ordered_boards = tuple(\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit(f"ordered_boards anchor count={text.count(anchor)}")
          text = text.replace(anchor, insert, 1)
          board_key = "                    board not in required,\n"
          board_key_new = (
              "                    board in required if optional_first "
              "else board not in required,\n"
          )
          if text.count(board_key) != 1:
              raise SystemExit(f"board-key anchor count={text.count(board_key)}")
          text = text.replace(board_key, board_key_new, 1)
          special = "        if len(required) == 2:\n            required_moves: list[Move] = []\n"
          special_new = (
              "        if len(required) == 2 and not optional_first:\n"
              "            required_moves: list[Move] = []\n"
          )
          if text.count(special) != 1:
              raise SystemExit(f"len2 anchor count={text.count(special)}")
          text = text.replace(special, special_new, 1)
          p.write_text(text, encoding="utf-8")
          PY
          python -m py_compile src/ai/action_planner.py
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          import src.training.arena as arena_module
          from src.ai.action_planner import ActionPlanner, ActionSearchBudget, _required_move_sort_key
          from src.engine.action import ActionRules
          from src.training.arena import evaluate_arena

          checkpoint = Path("_work/checkpoint/best")
          out_dir = Path("_work/residual-diagnostic")
          planner_budget = ActionSearchBudget(
              max_states=1024,
              max_actions=24,
              max_move_depth=32,
              max_seconds=5.0,
          )
          probe_budget = ActionSearchBudget(
              max_states=1024,
              max_actions=1,
              max_move_depth=64,
              max_seconds=1.0,
          )
          original_recover = arena_module._recover_incomplete_planner_action
          traces = []

          def board_key(board):
              side = getattr(board.side, "value", board.side)
              return (board.timeline, board.turn, str(side))

          def traced_recover(engine, planning_error):
              action = engine._ensure_current_action()
              required = set(ActionRules.required_boards(action, engine.timeline_manager.timelines))
              movable = tuple(ActionRules.movable_boards(action, engine.timeline_manager.timelines))
              board_rows = []
              probe_rows = []
              probe_count = 0
              ordered_boards = sorted(movable, key=lambda board: (board in required, board_key(board)))
              for board in ordered_boards:
                  position = engine._resolve_position(board)
                  moves = [] if position is None else list(engine.get_legal_moves(position))
                  moves = sorted(moves, key=lambda move: _required_move_sort_key(move, required))
                  board_rows.append({
                      "board": str(board),
                      "required": board in required,
                      "legal_count": len(moves),
                      "branching_count": sum(bool(m.is_branching) for m in moves),
                      "cross_timeline_count": sum(bool(m.is_cross_timeline) for m in moves),
                      "capture_count": sum(m.captured is not None for m in moves),
                  })
                  if board in required:
                      continue
                  for move in moves:
                      if probe_count >= 16:
                          break
                      probe_count += 1
                      child = engine.clone_for_simulation()
                      if not child.execute_action_move(move):
                          continue
                      child_action = child._ensure_current_action()
                      child_required = set(ActionRules.required_boards(
                          child_action, child.timeline_manager.timelines
                      ))
                      started = time.monotonic()
                      probe = ActionPlanner(probe_budget).search(child)
                      probe_rows.append({
                          "board": str(board),
                          "board_required": False,
                          "source": str(move.source),
                          "destination": str(move.destination),
                          "branching": bool(move.is_branching),
                          "cross_timeline": bool(move.is_cross_timeline),
                          "child_required_count": len(child_required),
                          "child_required": [str(item) for item in sorted(child_required, key=board_key)],
                          "candidate_count": len(probe.candidates),
                          "explored_states": probe.explored_states,
                          "termination_reason": probe.termination_reason,
                          "elapsed_seconds": time.monotonic() - started,
                      })
                  if probe_count >= 16:
                      break
              started = time.monotonic()
              kind, plan = original_recover(engine, planning_error)
              traces.append({
                  "ply": engine.move_counter,
                  "player": engine.current_turn_color.name,
                  "timeline_count": len(engine.timeline_manager.timelines),
                  "required": [str(board) for board in sorted(required, key=board_key)],
                  "movable": [str(board) for board in sorted(movable, key=board_key)],
                  "boards": board_rows,
                  "probes": probe_rows,
                  "planner_reason": planning_error.reason,
                  "planner_explored_states": planning_error.explored_states,
                  "recovery_kind": kind,
                  "recovery_elapsed_seconds": time.monotonic() - started,
                  "recovery_move_count": len(plan.moves) if plan is not None else None,
              })
              return kind, plan

          arena_module._recover_incomplete_planner_action = traced_recover
          started = time.monotonic()
          result = evaluate_arena(
              checkpoint=checkpoint,
              opponent="easy",
              games=1,
              device_name="cpu",
              seed=42,
              max_actions=120,
              budget=planner_budget,
              max_wall_seconds=900,
              output="json",
              model_color="black",
              game_seeds=[53],
          )
          summary = {
              "experiment": "optional-first residual state trace with optional-board first-move probes",
              "planner_budget": {"states":1024,"actions":24,"moves":32,"seconds":5.0},
              "probe_budget": {"states":1024,"actions":1,"moves":64,"seconds":1.0},
              "result": result,
              "traces": traces,
              "wall_seconds": time.monotonic() - started,
          }
          (out_dir / "optional-first-trace.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True), encoding="utf-8"
          )
          print("OPTIONAL_FIRST_TRACE=" + json.dumps({
              "planning_failures": result["planning_failure_count"],
              "first_failure": result.get("first_failure"),
              "traces": traces,
          }, sort_keys=True))
          PY
      - name: Upload diagnostic artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: easy20-optional-first-trace-${{ github.run_id }}
          path: _work/residual-diagnostic
          retention-days: 7
          if-no-files-found: warn
