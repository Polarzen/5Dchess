name: TEMP Easy20 Residual Diagnostic

on:
  push:
    branches:
      - feat/local-ai-training-v2
    paths:
      - .github/workflows/temp-easy20-residual-diagnostic.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: temp-easy20-residual-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt
      - name: Install game and CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"
      - name: Download Stage 1 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-stage1-500-34028226472
          path: _work/checkpoint
          repository: ${{ github.repository }}
          run-id: 34028226472
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate checkpoint shape
        run: python -m src.training.cloud check-resume --checkpoint _work/checkpoint/best --preset small
      - name: Test ActionPlanner witness-only recovery on residual seeds
        run: |
          mkdir -p _work/residual-diagnostic
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          import src.training.arena as arena_module
          from src.ai.action_planner import (
              AIActionPlan,
              ActionPlanner,
              ActionSearchBudget,
              MoveSpec,
              engine_state_signature,
          )
          from src.engine.action import ActionRules
          from src.training.arena import evaluate_arena

          checkpoint = Path("_work/checkpoint/best")
          out_dir = Path("_work/residual-diagnostic")
          seeds = [51, 53, 55]
          planner_budget = ActionSearchBudget(
              max_states=1024,
              max_actions=24,
              max_move_depth=32,
              max_seconds=5.0,
          )
          recovery_budget = ActionSearchBudget(
              max_states=4096,
              max_actions=1,
              max_move_depth=64,
              max_seconds=15.0,
          )

          original_recover = arena_module._recover_incomplete_planner_action
          active_trace = None

          def planner_recover(engine, planning_error):
              global active_trace
              action = engine._ensure_current_action()
              required = tuple(ActionRules.required_boards(
                  action, engine.timeline_manager.timelines
              ))
              movable = tuple(ActionRules.movable_boards(
                  action, engine.timeline_manager.timelines
              ))
              started = time.monotonic()

              if not planning_error.incomplete:
                  kind, plan = original_recover(engine, planning_error)
                  result = None
              else:
                  result = ActionPlanner(recovery_budget).search(engine)
                  if result.candidates:
                      selected = result.candidates[0]
                      plan = AIActionPlan(
                          color=engine.current_turn_color,
                          moves=tuple(selected),
                          start_signature=engine_state_signature(engine),
                          metadata={
                              "candidate_count": 1,
                              "selected_index": 0,
                              "explored_states": result.explored_states,
                              "search_complete": not result.exhausted,
                              "arena_recovery": True,
                              "arena_recovery_engine": "ActionPlanner",
                              "recovery_from_reason": planning_error.reason,
                              "recovery_search_termination_reason": result.termination_reason,
                              "planner_explored_states": planning_error.explored_states,
                              "failed_state_cache_hits": result.failed_state_cache_hits,
                          },
                          warning=(
                              "Arena ActionPlanner witness recovery after bounded planner "
                              f"{planning_error.reason}"
                          ),
                      )
                      kind = "witness"
                  elif result.exhausted:
                      kind, plan = "unresolved", None
                  else:
                      kind, plan = original_recover(engine, planning_error)

              elapsed = time.monotonic() - started
              if active_trace is not None:
                  active_trace.append({
                      "player": engine.current_turn_color.name,
                      "ply": engine.move_counter,
                      "timeline_count": len(engine.timeline_manager.timelines),
                      "required_count": len(required),
                      "required": [str(board) for board in required],
                      "movable_count": len(movable),
                      "movable": [str(board) for board in movable],
                      "planner_reason": planning_error.reason,
                      "planner_explored_states": planning_error.explored_states,
                      "recovery_kind": kind,
                      "recovery_elapsed_seconds": elapsed,
                      "recovery_move_count": len(plan.moves) if plan is not None else None,
                      "recovery_metadata": dict(plan.metadata) if plan is not None else None,
                      "witness_search_explored_states": (
                          result.explored_states if result is not None else None
                      ),
                      "witness_search_termination_reason": (
                          result.termination_reason if result is not None else None
                      ),
                      "witness_search_cache_hits": (
                          result.failed_state_cache_hits if result is not None else None
                      ),
                  })
              return kind, plan

          arena_module._recover_incomplete_planner_action = planner_recover

          rows = []
          for seed in seeds:
              trace = []
              active_trace = trace
              started = time.monotonic()
              result = evaluate_arena(
                  checkpoint=checkpoint,
                  opponent="easy",
                  games=1,
                  device_name="cpu",
                  seed=42,
                  max_actions=120,
                  budget=planner_budget,
                  max_wall_seconds=900,
                  output="json",
                  model_color="black",
                  game_seeds=[seed],
              )
              wall = time.monotonic() - started
              row = {
                  "seed": seed,
                  "result": result,
                  "recovery_trace": trace,
                  "wall_seconds": wall,
              }
              rows.append(row)
              print("PLANNER_RECOVERY_RESULT=" + json.dumps({
                  "seed": seed,
                  "planning_failures": result["planning_failure_count"],
                  "recoveries": result["planner_recovery_count"],
                  "first_failure": result.get("first_failure"),
                  "recovery_trace": trace,
                  "wall_seconds": wall,
              }, sort_keys=True))

          summary = {
              "experiment": "ActionPlanner witness-only recovery",
              "planner_budget": {"states":1024,"actions":24,"moves":32,"seconds":5.0},
              "recovery_budget": {"states":4096,"actions":1,"moves":64,"seconds":15.0},
              "seeds": seeds,
              "rows": rows,
              "failed_seeds": [
                  row["seed"] for row in rows
                  if row["result"]["planning_failure_count"]
              ],
              "passed_seeds": [
                  row["seed"] for row in rows
                  if row["result"]["planning_failure_count"] == 0
              ],
          }
          (out_dir / "planner-recovery-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True), encoding="utf-8"
          )
          print("PLANNER_RECOVERY_SUMMARY=" + json.dumps({
              "failed_seeds": summary["failed_seeds"],
              "passed_seeds": summary["passed_seeds"],
          }, sort_keys=True))
          PY
      - name: Upload diagnostic artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: easy20-planner-recovery-diagnostic-${{ github.run_id }}
          path: _work/residual-diagnostic
          retention-days: 7
          if-no-files-found: warn
