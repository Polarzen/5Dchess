name: TEMP Canonical Validation Attribution

on:
  push:
    branches:
      - feat/local-ai-training-v2

permissions:
  contents: read
  actions: read

jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-training.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
          python -m pip install "safetensors>=0.4.5" "numpy>=1.24"
      - uses: actions/download-artifact@v4
        with:
          name: local-ai-checkpoint-33347901504
          path: _work/checkpoint
          repository: Polarzen/5Dchess
          run-id: '33347901504'
          github-token: ${{ github.token }}
      - name: Fresh clean Arena profile
        run: |
          mkdir -p _work/validation-attribution
          python -m cProfile -o _work/validation-attribution/clean.pstats -m src.training.arena \
            --checkpoint _work/checkpoint/best \
            --opponent easy \
            --games 1 \
            --planner-seconds 5.0 \
            --planner-actions 24 \
            --planner-states 256 \
            --planner-moves 32 \
            --device cpu \
            --seed 42 \
            --max-actions 40 \
            --max-wall-seconds 300 \
            --output json \
            --result-json _work/validation-attribution/clean-result.json
      - name: Print fresh clean profile
        run: |
          python - <<'PY'
          import pstats
          from pathlib import Path
          s = pstats.Stats('_work/validation-attribution/clean.pstats').strip_dirs().sort_stats('cumulative')
          print('=== CLEAN RESULT ===')
          print(Path('_work/validation-attribution/clean-result.json').read_text())
          print('=== CLEAN TOTAL/TOP ===')
          s.print_stats(35)
          for pattern in [
              'action_planner.py', 'can_submit', 'is_action_safe',
              'encode_candidates', 'encode_action', 'resolve_move_spec',
              'filter_legal_moves', 'action_search.py', 'clone_for_simulation',
              'deepcopy', 'board.py'
          ]:
              print('--- CLEAN', pattern, '---')
              s.print_stats(pattern)
          PY
      - name: Instrument exact canonical validation repetition
        run: |
          python - <<'PY'
          from __future__ import annotations

          import collections
          import hashlib
          import inspect
          import json
          import sys
          import time

          from src.ai import action_planner as ap
          from src.engine.action import ActionRules
          from src.engine.engine import FiveDEngine
          from src.engine.move_validator import MoveValidator
          from src.engine.royal_rules import RoyalRules
          from src.training import encoding
          from src.training import arena

          records = collections.defaultdict(list)
          signature_seconds = collections.Counter()
          origin_counts = collections.defaultdict(collections.Counter)

          def _find_engine(timelines=None):
              frame = inspect.currentframe()
              try:
                  frame = frame.f_back
                  hops = 0
                  while frame is not None and hops < 18:
                      for value in frame.f_locals.values():
                          if isinstance(value, FiveDEngine):
                              if timelines is None or value.timeline_manager.timelines is timelines:
                                  return value
                      frame = frame.f_back
                      hops += 1
              finally:
                  del frame
              return None

          def _classify(engine=None):
              frame = inspect.currentframe()
              saw_encoding = False
              saw_outcome = False
              saw_planner_dfs = False
              saw_planner_search = False
              try:
                  frame = frame.f_back
                  hops = 0
                  while frame is not None and hops < 20:
                      filename = frame.f_code.co_filename.replace('\\', '/')
                      name = frame.f_code.co_name
                      if filename.endswith('/src/ai/action_planner.py') and name == 'apply_action_plan':
                          if engine is not None:
                              if frame.f_locals.get('probe') is engine:
                                  return 'apply_probe'
                              if frame.f_locals.get('engine') is engine:
                                  return 'apply_live'
                          return 'apply_other'
                      if filename.endswith('/src/training/encoding.py'):
                          saw_encoding = True
                      elif filename.endswith('/src/engine/action_search.py'):
                          saw_outcome = True
                      elif filename.endswith('/src/ai/action_planner.py') and name == '_dfs':
                          saw_planner_dfs = True
                      elif filename.endswith('/src/ai/action_planner.py') and name == 'search':
                          saw_planner_search = True
                      frame = frame.f_back
                      hops += 1
              finally:
                  del frame
              if saw_encoding:
                  return 'encoding'
              if saw_outcome:
                  return 'outcome_action_search'
              if saw_planner_dfs:
                  return 'planner_dfs'
              if saw_planner_search:
                  return 'planner_search'
              return 'other'

          def _fallback_timeline_action_signature(action, timelines):
              timeline_parts = []
              for timeline_id in sorted(timelines):
                  timeline = timelines[timeline_id]
                  positions = []
                  for time_point in sorted(timeline.positions):
                      p = timeline.positions[time_point]
                      positions.append((
                          time_point,
                          getattr(p.turn, 'value', p.turn),
                          p.move_number,
                          tuple(tuple(row) for row in p.board),
                          tuple(sorted(p.castling_rights.items())),
                          p.en_passant_target,
                          tuple(sorted(p.unmoved_pawns or ())),
                      ))
                  timeline_parts.append((
                      timeline_id,
                      timeline.parent_id,
                      timeline.branch_move_id,
                      timeline.branch_turn,
                      bool(timeline.is_active),
                      timeline.created_at_turn,
                      getattr(timeline.owner, 'value', timeline.owner),
                      tuple(positions),
                  ))
              return (
                  'fallback',
                  ap._action_signature(action),
                  tuple(timeline_parts),
              )

          def _validation_signature(engine, *, action=None, timelines=None):
              started = time.perf_counter()
              if engine is not None:
                  value = ('engine', ap.engine_state_signature(engine))
              else:
                  value = _fallback_timeline_action_signature(action, timelines)
              elapsed = time.perf_counter() - started
              return value, elapsed

          def _spec_signature(spec):
              return (
                  ap._square_signature(spec.source),
                  ap._square_signature(spec.destination),
                  getattr(spec.promotion, 'value', spec.promotion),
              )

          def _move_list_signature(moves):
              return tuple(ap._move_signature(move) for move in moves)

          def _record(kind, key, origin, result, elapsed, sig_elapsed):
              signature_seconds[kind] += sig_elapsed
              origin_counts[kind][origin] += 1
              records[kind].append({
                  'key': key,
                  'origin': origin,
                  'result': result,
                  'elapsed': elapsed,
              })

          original_engine_can_submit = FiveDEngine.can_submit_action
          def wrapped_engine_can_submit(self):
              origin = _classify(self)
              key, sig_elapsed = _validation_signature(self)
              started = time.perf_counter()
              result = original_engine_can_submit(self)
              elapsed = time.perf_counter() - started
              _record('engine_can_submit', key, origin, bool(result), elapsed, sig_elapsed)
              return result
          FiveDEngine.can_submit_action = wrapped_engine_can_submit

          original_action_can_submit = ActionRules.can_submit
          def wrapped_action_can_submit(action, timelines):
              engine = _find_engine(timelines)
              origin = _classify(engine)
              key, sig_elapsed = _validation_signature(engine, action=action, timelines=timelines)
              started = time.perf_counter()
              result = original_action_can_submit(action, timelines)
              elapsed = time.perf_counter() - started
              _record('action_can_submit', key, origin, bool(result), elapsed, sig_elapsed)
              return result
          ActionRules.can_submit = staticmethod(wrapped_action_can_submit)

          original_royal_safe = RoyalRules.is_action_safe
          def wrapped_royal_safe(self, color):
              engine = _find_engine(self.timelines)
              origin = _classify(engine)
              key, sig_elapsed = _validation_signature(
                  engine,
                  action=(engine.current_action if engine is not None else None),
                  timelines=self.timelines,
              )
              key = (key, getattr(color, 'value', color))
              started = time.perf_counter()
              result = original_royal_safe(self, color)
              elapsed = time.perf_counter() - started
              _record('royal_safe', key, origin, bool(result), elapsed, sig_elapsed)
              return result
          RoyalRules.is_action_safe = wrapped_royal_safe

          original_resolve = ap.resolve_move_spec
          def wrapped_resolve(engine, spec):
              origin = _classify(engine)
              state_key, sig_elapsed = _validation_signature(engine)
              key = (state_key, _spec_signature(spec))
              started = time.perf_counter()
              try:
                  result = original_resolve(engine, spec)
              except Exception as exc:
                  elapsed = time.perf_counter() - started
                  _record('resolve_move_spec', key, origin, ('error', type(exc).__name__), elapsed, sig_elapsed)
                  raise
              elapsed = time.perf_counter() - started
              _record('resolve_move_spec', key, origin, ap._move_signature(result), elapsed, sig_elapsed)
              return result
          ap.resolve_move_spec = wrapped_resolve
          encoding.resolve_move_spec = wrapped_resolve

          original_filter = MoveValidator.filter_legal_moves
          def wrapped_filter(self, position, moves):
              engine = _find_engine(self.timelines)
              origin = _classify(engine)
              state_key, sig_elapsed = _validation_signature(
                  engine,
                  action=(engine.current_action if engine is not None else None),
                  timelines=self.timelines,
              )
              key = (
                  state_key,
                  position.timeline_id,
                  position.time_point,
                  getattr(position.turn, 'value', position.turn),
                  _move_list_signature(moves),
              )
              started = time.perf_counter()
              result = original_filter(self, position, moves)
              elapsed = time.perf_counter() - started
              _record('move_validator', key, origin, _move_list_signature(result), elapsed, sig_elapsed)
              return result
          MoveValidator.filter_legal_moves = wrapped_filter

          sys.argv = [
              'arena',
              '--checkpoint', '_work/checkpoint/best',
              '--opponent', 'easy',
              '--games', '1',
              '--planner-seconds', '5.0',
              '--planner-actions', '24',
              '--planner-states', '256',
              '--planner-moves', '32',
              '--device', 'cpu',
              '--seed', '42',
              '--max-actions', '40',
              '--max-wall-seconds', '300',
              '--output', 'json',
              '--result-json', '_work/validation-attribution/instrumented-result.json',
          ]
          arena.main()

          def summarize(kind):
              events = records[kind]
              first = {}
              duplicate_calls = 0
              duplicate_time = 0.0
              mismatch = []
              pairs = collections.Counter()
              groups = collections.Counter()
              for event in events:
                  key = event['key']
                  if key in first:
                      duplicate_calls += 1
                      duplicate_time += event['elapsed']
                      prior = first[key]
                      pairs[(prior['origin'], event['origin'])] += 1
                      groups[key] += 1
                      if prior['result'] != event['result']:
                          mismatch.append((prior['result'], event['result']))
                  else:
                      first[key] = event
                      groups[key] = 1
              if mismatch:
                  raise AssertionError(f'{kind}: exact signatures produced different results: {mismatch[:3]}')
              top_groups = []
              for key, count in groups.most_common(12):
                  if count < 2:
                      continue
                  digest = hashlib.sha256(repr(key).encode('utf-8')).hexdigest()[:16]
                  matching = [event for event in events if event['key'] == key]
                  top_groups.append({
                      'signature': digest,
                      'count': count,
                      'origins': [event['origin'] for event in matching],
                      'result': repr(matching[0]['result'])[:160],
                      'elapsed_total_ms': round(sum(event['elapsed'] for event in matching) * 1000.0, 3),
                  })
              return {
                  'total_calls': len(events),
                  'unique_signatures': len(first),
                  'duplicate_calls': duplicate_calls,
                  'duplicate_ratio': (duplicate_calls / len(events) if events else 0.0),
                  'duplicate_call_time_ms': round(duplicate_time * 1000.0, 3),
                  'signature_build_time_ms': round(signature_seconds[kind] * 1000.0, 3),
                  'origin_counts': dict(origin_counts[kind]),
                  'origin_pairs': {f'{a}->{b}': n for (a, b), n in pairs.most_common()},
                  'top_duplicate_groups': top_groups,
              }

          report = {kind: summarize(kind) for kind in sorted(records)}
          print('=== CANONICAL VALIDATION ATTRIBUTION ===')
          print(json.dumps(report, indent=2, sort_keys=True))
          print('=== INSTRUMENTED ARENA RESULT ===')
          with open('_work/validation-attribution/instrumented-result.json', encoding='utf-8') as fh:
              print(fh.read())
          with open('_work/validation-attribution/attribution.json', 'w', encoding='utf-8') as fh:
              json.dump(report, fh, indent=2, sort_keys=True)
          PY
